<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hệ Thống MKT - Admin</title>
    <link rel="icon" href="https://i.postimg.cc/xCjmFrb4/Untitled-design.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --white: #ffffff; 
            --blue: #01adee; 
            --red: #db1010; 
            --text-main: #333333; 
            --gray-border: #e0e0e0; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background: var(--white); color: var(--text-main); }
        
        /* TĂNG TỐC TRƯỢT TỪ 0.3s XUỐNG 0.1s */
        .sidebar { width: 250px; background: var(--white); border-right: 0.5px solid var(--gray-border); display: flex; flex-direction: column; transition: width 0.1s ease-out; white-space: nowrap; flex-shrink: 0; z-index: 50; }
        .sidebar.collapsed { width: 60px; }
        .sidebar-header { height: 60px; display: flex; align-items: center; border-bottom: 0.5px solid var(--gray-border); }
        .toggle-btn { width: 60px; height: 60px; background: transparent; border: none; font-size: 20px; color: var(--text-main); opacity: 0.7; cursor: pointer; flex-shrink: 0; display: flex; justify-content: center; align-items: center; }
        
        /* TĂNG TỐC HIỆN LOGO TỪ 0.2s XUỐNG 0.05s */
        .brand { font-size: 14px; font-weight: 300; color: #000000; opacity: 1; transition: opacity 0.05s; display: flex; align-items: center; }
        .brand img { height: 30px; margin-right: 10px; }
        .sidebar.collapsed .brand { opacity: 0; pointer-events: none; }
        
        .menu-item-side { padding: 0; display: flex; align-items: center; cursor: pointer; border-bottom: 0.5px solid var(--gray-border); transition: 0.1s; color: #000000; text-decoration: none;}
        .menu-item-side:hover, .menu-item-side.active { background: var(--blue); color: var(--white); }
        .icon { width: 60px; height: 50px; display: flex; justify-content: center; align-items: center; font-size: 18px; flex-shrink: 0; }
        
        /* TĂNG TỐC HIỆN CHỮ TỪ 0.2s XUỐNG 0.05s */
        .text { font-weight: 300; font-size: 14px; transition: opacity 0.05s; opacity: 1; }
        .sidebar.collapsed .text { opacity: 0; pointer-events: none; }

        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header-bar { height: 60px; border-bottom: 0.5px solid var(--gray-border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; flex-shrink: 0; background: var(--white); z-index: 20; }
        .search-wrapper { flex: 1; display: flex; justify-content: center; }
        .search-box { width: 100%; max-width: 500px; display: flex; align-items: center; border: 0.5px solid var(--gray-border); border-radius: 20px; overflow: hidden; padding: 5px 15px; }
        .search-box input { flex: 1; border: none; outline: none; font-size: 14px; padding: 2px; }
        .search-box i { color: var(--text-main); opacity: 0.5; font-size: 16px; cursor: pointer; }
        
        .user-actions { display: flex; align-items: center; gap: 15px; }
        .logout-btn { background: var(--red); color: var(--white); border: none; padding: 8px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        
        #iframeContainer {
            flex-grow: 1; 
            position: relative; 
            width: 100%; 
            height: 100%;
        }
        
        .module-frame { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            border: none; background: #f9f9f9; 
            visibility: hidden; 
            z-index: 0;
        }

        .module-frame.active-frame {
            visibility: visible; 
            z-index: 10;
        }

        @media (max-width: 768px) { .sidebar { position: absolute; height: 100%; transform: translateX(-100%); transition: transform 0.1s ease-out; } .sidebar.mobile-open { transform: translateX(0); } }
    </style>
    <script>if (localStorage.getItem('admin_session') !== 'verified_admin') window.location.href = 'index.html';</script>
</head>
<body>
    <div class="sidebar collapsed" id="sidebar">
        <div class="sidebar-header">
            <button class="toggle-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="brand"><img src="https://i.postimg.cc/xCjmFrb4/Untitled-design.png"> WEB MKT</div>
        </div>
        <a href="#" class="menu-item-side" onclick="loadModule('idea.html', this)" data-target="idea"><div class="icon"><i class="fas fa-lightbulb"></i></div><div class="text">Ý TƯỞNG</div></a>
        <a href="#" class="menu-item-side" onclick="loadModule('plan.html', this)" data-target="plan"><div class="icon"><i class="fas fa-calendar-alt"></i></div><div class="text">KẾ HOẠCH</div></a>
        <a href="#" class="menu-item-side" onclick="loadModule('post.html', this)" data-target="post"><div class="icon"><i class="fas fa-file-alt"></i></div><div class="text">BÀI VIẾT</div></a>
        <a href="#" class="menu-item-side" onclick="loadModule('image.html', this)" data-target="image"><div class="icon"><i class="fas fa-images"></i></div><div class="text">HÌNH ẢNH</div></a>
        
        <a href="#" id="menuSettings" class="menu-item-side" style="display: none;" onclick="loadModule('caidat.html', this)" data-target="caidat"><div class="icon"><i class="fas fa-cogs"></i></div><div class="text">CÀI ĐẶT</div></a>
    </div>

    <div class="main-content">
        <div class="header-bar">
            <div class="search-wrapper">
                <div class="search-box">
                    <input type="text" id="globalSearch" placeholder="Tìm kiếm trong module hiện tại..." onkeyup="executeGlobalSearch()">
                    <i class="fas fa-search"></i>
                </div>
            </div>
            <div class="user-actions">
                <span style="color: #000000; font-weight: 300; font-size: 14px;" id="welcomeUser"></span>
                <button class="logout-btn" onclick="logout()">Đăng Xuất</button>
            </div>
        </div>
        
        <div id="iframeContainer">
            <iframe src="idea.html" id="frame-idea" class="module-frame"></iframe>
            <iframe src="plan.html" id="frame-plan" class="module-frame"></iframe>
            <iframe src="post.html" id="frame-post" class="module-frame"></iframe>
            <iframe src="image.html" id="frame-image" class="module-frame"></iframe>
            <iframe src="caidat.html" id="frame-caidat" class="module-frame"></iframe>
        </div>
    </div>

    <script>
        document.getElementById('welcomeUser').innerText = localStorage.getItem('admin_name') || 'Admin';
        
        if (localStorage.getItem('admin_email') === 'admin@tudonghoavinhloc.com') {
            document.getElementById('menuSettings').style.display = 'flex';
        }

        document.addEventListener("DOMContentLoaded", () => {
            let savedModule = localStorage.getItem('MKT_ACTIVE_MODULE') || 'idea.html';
            let targetId = savedModule.replace('.html', '');
            
            let items = document.querySelectorAll('.menu-item-side');
            let targetItem = Array.from(items).find(el => el.getAttribute('data-target') === targetId);
            
            if (targetItem) {
                loadModule(savedModule, targetItem);
            } else {
                loadModule('idea.html', items[0]);
            }
        });

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
        
// TÌM HÀM loadModule TRONG FILE: admin.html VÀ SỬA LẠI THÀNH THẾ NÀY:

function loadModule(url, element) {
    document.querySelectorAll('.menu-item-side').forEach(el => el.classList.remove('active')); 
    element.classList.add('active');
    
    let targetId = 'frame-' + url.replace('.html', '');
    let targetFrame = document.getElementById(targetId); // <--- Nắm đầu iframe

    document.querySelectorAll('.module-frame').forEach(frame => {
        frame.classList.remove('active-frame');
    });
    targetFrame.classList.add('active-frame');

    // ================= BẮT TAY KÍCH HOẠT =================
    if (url === 'post.html' && targetFrame.contentWindow) {
        // Tránh lỗi rủi ro iframe chưa kịp mount DOM vào t=0
        setTimeout(() => {
            if (typeof targetFrame.contentWindow.forceReloadDraft === 'function') {
                targetFrame.contentWindow.forceReloadDraft();
            } else {
                targetFrame.contentWindow.location.reload(); // Lưới an toàn fallback
            }
        }, 50);
    }
    // =====================================================

    localStorage.setItem('MKT_ACTIVE_MODULE', url);
    document.getElementById('globalSearch').value = "";
}

        function executeGlobalSearch() {
            let kw = document.getElementById('globalSearch').value.trim(); 
            let activeFrame = document.querySelector('.module-frame.active-frame');
            
            if(activeFrame && activeFrame.contentWindow && typeof activeFrame.contentWindow.executeSearch === 'function') {
                activeFrame.contentWindow.executeSearch(kw);
            }
        }
    </script>
</body>
</html>
