<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hệ Thống MKT - Admin</title>
    <link rel="icon" href="https://i.postimg.cc/xCjmFrb4/Untitled-design.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --white: #ffffff; 
            --blue: #01adee; 
            --red: #db1010; 
            --text-main: #333333; 
            --gray-border: #e0e0e0; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background: var(--white); color: var(--text-main); }
        
        .sidebar { width: 250px; background: var(--white); border-right: 0.5px solid var(--gray-border); display: flex; flex-direction: column; transition: width 0.3s ease; white-space: nowrap; flex-shrink: 0; z-index: 50; }
        .sidebar.collapsed { width: 60px; }
        .sidebar-header { height: 60px; display: flex; align-items: center; border-bottom: 0.5px solid var(--gray-border); }
        .toggle-btn { width: 60px; height: 60px; background: transparent; border: none; font-size: 20px; color: var(--text-main); opacity: 0.7; cursor: pointer; flex-shrink: 0; display: flex; justify-content: center; align-items: center; }
        
        /* Cập nhật Brand: Chữ đen, nét mỏng, size 14px */
        .brand { font-size: 14px; font-weight: 300; color: #000000; opacity: 1; transition: opacity 0.2s; display: flex; align-items: center; }
        .brand img { height: 30px; margin-right: 10px; }
        .sidebar.collapsed .brand { opacity: 0; pointer-events: none; }
        
        /* Cập nhật Menu Item: Chữ đen */
        .menu-item-side { padding: 0; display: flex; align-items: center; cursor: pointer; border-bottom: 0.5px solid var(--gray-border); transition: 0.3s; color: #000000; text-decoration: none;}
        .menu-item-side:hover, .menu-item-side.active { background: var(--blue); color: var(--white); }
        .icon { width: 60px; height: 50px; display: flex; justify-content: center; align-items: center; font-size: 18px; flex-shrink: 0; }
        
        /* Cập nhật Text Menu: Nét mỏng, size 14px */
        .text { font-weight: 300; font-size: 14px; transition: opacity 0.2s; opacity: 1; }
        .sidebar.collapsed .text { opacity: 0; pointer-events: none; }

        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header-bar { height: 60px; border-bottom: 0.5px solid var(--gray-border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; flex-shrink: 0; background: var(--white); }
        .search-wrapper { flex: 1; display: flex; justify-content: center; }
        .search-box { width: 100%; max-width: 500px; display: flex; align-items: center; border: 0.5px solid var(--gray-border); border-radius: 20px; overflow: hidden; padding: 5px 15px; }
        .search-box input { flex: 1; border: none; outline: none; font-size: 14px; padding: 2px; }
        .search-box i { color: var(--text-main); opacity: 0.5; font-size: 16px; cursor: pointer; }
        
        .user-actions { display: flex; align-items: center; gap: 15px; }
        .logout-btn { background: var(--red); color: var(--white); border: none; padding: 8px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        
        /* Iframe không có transition delay để đổi trang ngay lập tức */
        #moduleFrame { 
    flex-grow: 1; 
    border: none; 
    width: 100%; 
    height: 100%; 
    background: #f9f9f9; 
    transition: opacity 0.15s ease-in-out; /* Thêm dòng này */
}

        @media (max-width: 768px) { .sidebar { position: absolute; height: 100%; transform: translateX(-100%); } .sidebar.mobile-open { transform: translateX(0); } }
    </style>
    <script>if (localStorage.getItem('admin_session') !== 'verified_admin') window.location.href = 'index.html';</script>
</head>
<body>
    <div class="sidebar collapsed" id="sidebar">
        <div class="sidebar-header">
            <button class="toggle-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="brand"><img src="https://i.postimg.cc/xCjmFrb4/Untitled-design.png"> WEB MKT</div>
        </div>
        <a href="#" class="menu-item-side active" onclick="loadModule('idea.html', this)"><div class="icon"><i class="fas fa-lightbulb"></i></div><div class="text">Ý TƯỞNG</div></a>
        <a href="#" class="menu-item-side" onclick="loadModule('plan.html', this)"><div class="icon"><i class="fas fa-calendar-alt"></i></div><div class="text">KẾ HOẠCH</div></a>
        <a href="#" class="menu-item-side" onclick="loadModule('post.html', this)"><div class="icon"><i class="fas fa-file-alt"></i></div><div class="text">BÀI VIẾT</div></a>
        <a href="#" class="menu-item-side" onclick="loadModule('image.html', this)"><div class="icon"><i class="fas fa-images"></i></div><div class="text">HÌNH ẢNH</div></a>
        
        <a href="#" id="menuSettings" class="menu-item-side" style="display: none;" onclick="loadModule('caidat.html', this)"><div class="icon"><i class="fas fa-cogs"></i></div><div class="text">CÀI ĐẶT</div></a>
    </div>

    <div class="main-content">
        <div class="header-bar">
            <div class="search-wrapper">
                <div class="search-box">
                    <input type="text" id="globalSearch" placeholder="Tìm kiếm trong module hiện tại..." onkeyup="executeGlobalSearch()">
                    <i class="fas fa-search"></i>
                </div>
            </div>
            <div class="user-actions">
                <span style="color: #000000; font-weight: 300; font-size: 14px;" id="welcomeUser"></span>
                <button class="logout-btn" onclick="logout()">Đăng Xuất</button>
            </div>
        </div>
        <iframe src="idea.html" id="moduleFrame"></iframe>
    </div>

    <script>
        document.getElementById('welcomeUser').innerText = localStorage.getItem('admin_name') || 'Admin';
        
        // KIỂM TRA QUYỀN ĐỂ MỞ KHÓA MENU CÀI ĐẶT
        if (localStorage.getItem('admin_email') === 'admin@tudonghoavinhloc.com') {
            document.getElementById('menuSettings').style.display = 'flex';
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
        
        // Hàm loadModule tải trang ngay lập tức
        function loadModule(url, element) {
    // Đổi màu menu active
    document.querySelectorAll('.menu-item-side').forEach(el => el.classList.remove('active')); 
    element.classList.add('active');
    
    const frame = document.getElementById('moduleFrame');
    
    // Giấu iframe đi cực nhanh (mờ đi) để che nhịp load trang trống
    frame.style.opacity = '0';
    
    // Đợi 1 nhịp rất ngắn (50ms) rồi mới đổi link để transition có tác dụng
    setTimeout(() => {
        frame.src = url; 
        document.getElementById('globalSearch').value = "";
        
        // Khi trang mới đã load xong 100% ngầm bên dưới, mới cho hiển thị lên lại
        frame.onload = () => {
            frame.style.opacity = '1';
        };
    }, 50);
}

        function executeGlobalSearch() {
            let kw = document.getElementById('globalSearch').value.trim(); 
            let frame = document.getElementById('moduleFrame');
            if(frame && frame.contentWindow && typeof frame.contentWindow.executeSearch === 'function') {
                frame.contentWindow.executeSearch(kw);
            }
        }
    </script>
</body>
</html>
