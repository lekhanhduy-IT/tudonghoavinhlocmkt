<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô-đun Kế Hoạch</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --white: #ffffff; --blue: #01adee; --red: #db1010; --gray-light: #f1f3f4; --gray-border: #e0e0e0; --text-main: #333333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--white); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Toolbar */
        .toolbar { height: 40px; background: var(--white); border-bottom: 0.5px solid var(--gray-border); display: flex; align-items: center; padding: 0 10px; flex-shrink: 0; justify-content: space-between; }
        .tool-btn { background: var(--white); border: 0.5px solid var(--gray-border); color: var(--blue); padding: 4px 10px; cursor: pointer; font-size: 12px; font-weight: bold; border-radius: 3px; display: inline-flex; align-items: center; gap: 4px; transition: 0.2s;}
        .tool-btn:hover { background: var(--blue); color: var(--white); border: 0.5px solid var(--blue); }
        #syncStatus { font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 4px; }

        /* Vùng cuộn chính */
        .scroll-area { flex: 1; overflow: auto; background: #f9f9f9; position: relative; }
        .content-wrapper { min-width: 100%; width: max-content; padding-bottom: 50px; background: var(--white); }
        .month-group { margin-bottom: 20px; }

        /* Mega Row (Thanh Tháng) - Sticky ở Top 0 */
        .mega-row-btn { 
            position: sticky; 
            top: 0; 
            left: 0; 
            z-index: 30; 
            width: 100%; 
            height: 48px;
            background: var(--blue); 
            color: var(--white); 
            padding: 0 20px; 
            font-size: 15px; 
            font-weight: bold; 
            border: none; 
            text-align: left; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
        }
        .mega-row-btn i { transition: transform 0.3s; }
        .mega-row-btn.collapsed i { transform: rotate(-90deg); }
        
        .table-container { display: block; border-bottom: 1px solid var(--gray-border); }
        .table-container.collapsed { display: none; }

        /* Cấu trúc Bảng Ép Cứng Kích Thước */
        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0; 
            table-layout: fixed; /* Ép cứng không cho giãn tràn lan */
        }
        
        /* Tiêu đề bảng - Sticky dưới Mega-row (48px) */
        th { 
            position: sticky; 
            top: 48px; 
            z-index: 20; 
            background: var(--gray-light); 
            color: var(--text-main); 
            height: 35px; 
            padding: 0 10px; 
            font-size: 13px;
            text-align: left;
            white-space: nowrap; 
            border-bottom: 0.5px solid var(--gray-border);
            border-right: 0.5px solid var(--gray-border);
            box-shadow: 0 1px 0 0 var(--gray-border), 0 -1px 0 0 var(--gray-border);
        }
        th:first-child { border-left: 0.5px solid var(--gray-border); }

        /* Dòng dữ liệu */
        td { 
            height: 35px; 
            padding: 0 10px; 
            font-size: 13px; 
            border-bottom: 0.5px solid var(--gray-border); 
            border-right: 0.5px solid var(--gray-border);
            background: var(--white);
            position: relative;
        }
        td:first-child { border-left: 0.5px solid var(--gray-border); }

        /* Cột số thứ tự cố định bên trái khi cuộn ngang */
        td.row-index, th.col-index {
            position: sticky;
            left: 0;
            z-index: 15;
            background: var(--gray-light) !important;
            text-align: center;
            font-weight: bold;
            color: #7f8c8d;
            user-select: none;
        }
        th.col-index { z-index: 25; } /* Đảm bảo th giao điểm nằm trên cùng */

        /* Bộ Khung Tương Tác Ô Dữ Liệu */
        .cell-view {
            width: 100%;
            height: 100%;
            line-height: 33px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }
        
        /* Khung hiển thị nội dung bung ra khi Double-click */
        .cell-expanded {
            position: absolute;
            top: -1px;
            left: -1px;
            z-index: 100;
            height: max-content;
            max-height: 250px;
            width: max-content;
            min-width: calc(100% + 2px);
            max-width: 450px;
            background: var(--white);
            border: 1.5px solid var(--blue);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            padding: 8px;
            white-space: pre-wrap; /* Giữ nguyên xuống dòng */
            word-wrap: break-word;
            overflow-y: auto;
            color: var(--text-main);
            font-weight: normal;
            text-align: left;
            border-radius: 4px;
        }

        /* Thanh Kéo Thu Kích Thước Bằng Chuột */
        .resizer-col { 
            position: absolute; 
            right: 0; 
            top: 0; 
            bottom: 0; 
            width: 6px; 
            cursor: col-resize; 
            z-index: 25; 
        }
        .resizer-col:hover { background: rgba(1, 173, 238, 0.4); }
        
        .resizer-row { 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            height: 6px; 
            cursor: row-resize; 
            z-index: 25; 
        }
        .resizer-row:hover { background: rgba(1, 173, 238, 0.4); }

        /* Thanh Footer Tabs */
        .footer-tabs { 
            height: 40px; 
            background: var(--white); 
            display: flex; 
            align-items: center; 
            padding: 0 10px; 
            border-top: 0.5px solid var(--gray-border); 
            overflow-x: auto; 
            flex-shrink: 0; 
        }
        .tab-item { 
            padding: 8px 20px; 
            background: var(--white); 
            border: 0.5px solid var(--gray-border); 
            color: var(--text-main); 
            opacity: 0.8; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: bold; 
            margin-right: 5px; 
            border-radius: 4px;
            white-space: nowrap;
        }
        .tab-item.active { background: var(--blue); color: var(--white); opacity: 1; border: 0.5px solid var(--blue); }

        .empty-msg { text-align: center; color: #999; font-style: italic; font-size: 14px; margin-top: 50px; padding: 20px; width: 100vw; }

        /* Popup Lọc */
        .popup-box { position: absolute; background: var(--white); border: 0.5px solid var(--gray-border); box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 9999; display: none; border-radius: 4px; overflow: hidden; }
        .popup-header { background: var(--gray-light); padding: 8px 15px; font-weight: bold; border-bottom: 0.5px solid var(--gray-border); font-size: 13px; }
        .menu-item { padding: 8px 15px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; color: var(--text-main); font-weight: 500;}
        .menu-item:hover { background: #f1f3f4; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div>
            <button class="tool-btn" onclick="openFilterPopup(event)"><i class="fas fa-calendar-alt"></i> Lọc Theo Tháng</button>
            <button class="tool-btn" style="background:var(--white); color:var(--text-main); border-color:var(--gray-border);" onclick="forceReload()"><i class="fas fa-sync-alt"></i> Làm Mới View</button>
        </div>
        <span id="syncStatus">✅ Dữ liệu hệ thống</span>
    </div>

    <div class="scroll-area" id="scrollArea">
        <div class="content-wrapper" id="planArea"></div>
    </div>

    <div class="footer-tabs" id="bottomTabs"></div>

    <div id="filterPopup" class="popup-box" style="min-width: 200px;">
        <div class="popup-header"><i class="fas fa-filter"></i> Lọc Tháng</div>
        <div id="filterList" style="max-height: 250px; overflow-y: auto;"></div>
        <div style="display:flex; padding: 8px; border-top: 0.5px solid var(--gray-border); gap: 5px;">
            <button class="tool-btn" style="flex:1; justify-content:center; margin:0;" onclick="applyFilter()">Lọc</button>
            <button class="tool-btn" style="flex:1; justify-content:center; margin:0; background:var(--white); color:var(--text-main);" onclick="clearFilter()">Xóa Lọc</button>
        </div>
    </div>

    <script>
        let sysData = {};
        let activeFilters = [];
        let activeBottomTab = ""; 

        // Các biến xử lý kéo giãn kích thước Hàng/Cột
        let isResizing = false;
        let resizeData = { type: '', targetEl: null, startDim: 0, startMouse: 0 };

        window.onload = () => {
            loadData();
            
            // Lắng nghe sự kiện click chuột toàn cục để đóng khung Đúp chuột và Popup Lọc
            document.addEventListener('click', (e) => {
                if(!document.getElementById('filterPopup').contains(e.target)) {
                    document.getElementById('filterPopup').style.display = 'none';
                }
                if(!e.target.closest('.cell-expanded') && !e.target.closest('.cell-view')) {
                    document.querySelectorAll(".cell-expanded").forEach(x => x.remove());
                }
            });

            // Gán sự kiện kéo thả chuột toàn hệ thống
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
        };

        function forceReload() { loadData(); }

        function loadData() {
            let cached = localStorage.getItem("MKT_DATA");
            if (cached) {
                sysData = JSON.parse(cached);
                processAndRender();
            } else {
                document.getElementById("planArea").innerHTML = `<div class="empty-msg">Chưa có dữ liệu hệ thống. Vui lòng quay lại tab Ý TƯỞNG để tải dữ liệu.</div>`;
            }
        }

        // Khởi tạo tiến trình kéo giãn (Được gọi Inline từ thẻ HTML)
        function initResize(e, type, targetEl, currentDim) {
            e.stopPropagation();
            e.preventDefault();
            isResizing = true;
            resizeData = {
                type: type,
                targetEl: targetEl,
                startDim: currentDim,
                startMouse: type === 'col' ? e.clientX : e.clientY
            };
            document.body.style.cursor = type === 'col' ? 'col-resize' : 'row-resize';
        }

        function handleMouseMove(e) {
            if (!isResizing) return;
            let delta = (resizeData.type === 'col' ? e.clientX : e.clientY) - resizeData.startMouse;
            let newDim = Math.max(30, resizeData.startDim + delta); // Giới hạn nhỏ nhất là 30px
            if (resizeData.type === 'col') {
                resizeData.targetEl.style.width = newDim + "px";
            } else {
                resizeData.targetEl.style.height = newDim + "px";
            }
        }

        function handleMouseUp() {
            if (!isResizing) return;
            isResizing = false;
            document.body.style.cursor = 'default';
        }

        function toggleMegaRow(btn) {
            btn.classList.toggle('collapsed');
            let content = btn.nextElementSibling;
            content.classList.toggle('collapsed');
        }

        function processAndRender() {
            let area = document.getElementById("planArea");
            let tabsWrapper = document.getElementById("bottomTabs");
            area.innerHTML = ""; tabsWrapper.innerHTML = "";

            let planSheet = sysData.sheets["_PLAN_DATA_"];
            if (!planSheet || planSheet.length <= 1) {
                area.innerHTML = `<div class="empty-msg"><i class="fas fa-folder-open" style="font-size:30px; color:var(--gray-border); margin-bottom:10px;"></i><br>Chưa có kế hoạch nào được lên lịch.</div>`;
                return;
            }

            let uniqueTabs = new Set();
            for (let i = 1; i < planSheet.length; i++) {
                if(planSheet[i][0]) uniqueTabs.add(planSheet[i][0]);
            }
            let availableTabs = Array.from(uniqueTabs);

            if (availableTabs.length === 0) {
                area.innerHTML = `<div class="empty-msg">Chưa có dữ liệu kế hoạch hợp lệ.</div>`;
                return;
            }

            if (!activeBottomTab || !availableTabs.includes(activeBottomTab)) {
                activeBottomTab = availableTabs[0];
            }

            availableTabs.forEach(tab => {
                let div = document.createElement("div");
                div.className = "tab-item" + (tab === activeBottomTab ? " active" : "");
                div.innerText = tab;
                div.onclick = () => {
                    activeBottomTab = tab;
                    processAndRender();
                };
                tabsWrapper.appendChild(div);
            });

            // Đọc cấu hình độ rộng cột từ cấu hình tab gốc để đồng bộ giao diện
            let tabAttrs = sysData.attributes[activeBottomTab] || {};
            let originalColWidths = tabAttrs.colWidths || {};

            let groupedData = {};
            for (let i = 1; i < planSheet.length; i++) {
                let tabName = planSheet[i][0];
                let dateStr = planSheet[i][1];
                let rowDataJson = planSheet[i][2];

                if (tabName !== activeBottomTab || !dateStr || !rowDataJson) continue; 

                let dateObj = new Date(dateStr);
                let monthKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
                let monthLabel = `Tháng ${dateObj.getMonth() + 1} / ${dateObj.getFullYear()}`;

                if (!groupedData[monthKey]) groupedData[monthKey] = { label: monthLabel, rows: [] };

                let parsedRow = [];
                try { parsedRow = JSON.parse(rowDataJson); } catch(e){}
                groupedData[monthKey].rows.push({ date: dateStr, data: parsedRow });
            }

            let sortedMonths = Object.keys(groupedData).sort();
            let hasVisibleData = false;

            let headers = [];
            if (sysData.sheets[activeBottomTab] && sysData.sheets[activeBottomTab].length > 0) {
                headers = sysData.sheets[activeBottomTab][0];
            }

            sortedMonths.forEach(mKey => {
                if (activeFilters.length > 0 && !activeFilters.includes(mKey)) return;
                hasVisibleData = true;
                let monthInfo = groupedData[mKey];

                let groupDiv = document.createElement("div");
                groupDiv.className = "month-group";

                let btn = document.createElement("button");
                btn.className = "mega-row-btn"; 
                btn.innerHTML = `<span><i class="fas fa-calendar-alt" style="margin-right:8px;"></i> ${monthInfo.label}</span> <i class="fas fa-chevron-down"></i>`;
                btn.onclick = function() { toggleMegaRow(this); };
                groupDiv.appendChild(btn);

                let tableContainer = document.createElement("div");
                tableContainer.className = "table-container";

                let table = document.createElement("table");
                
                if (headers.length === 0 && monthInfo.rows.length > 0) {
                    for(let c=0; c<monthInfo.rows[0].data.length; c++) headers.push("Cột " + (c+1));
                }
                
                // Khởi tạo phần Tiêu Đề Header (Chứa bộ kích thước cột & Nút kéo Resizer)
                let thead = document.createElement("thead");
                let trH = document.createElement("tr");
                
                // Cột '#'
                let thIndex = document.createElement("th");
                thIndex.className = "col-index";
                thIndex.style.width = "40px";
                thIndex.innerText = "#";
                trH.appendChild(thIndex);
                
                // Cột 'Ngày Lên Lịch'
                let thDate = document.createElement("th");
                thDate.style.width = "120px";
                thDate.innerHTML = `Ngày Lên Lịch<div class="resizer-col" onmousedown="initResize(event, 'col', this.parentElement, this.parentElement.offsetWidth)"></div>`;
                trH.appendChild(thDate);

                // Các cột dữ liệu từ Tab gốc
                headers.forEach((h, idx) => {
                    let th = document.createElement("th");
                    // Kế thừa độ rộng từ tab gốc nếu có, nếu không đặt mặc định 150px
                    let baseW = originalColWidths[idx] ? parseInt(originalColWidths[idx]) : 150;
                    th.style.width = baseW + "px";
                    th.innerHTML = `${h}<div class="resizer-col" onmousedown="initResize(event, 'col', this.parentElement, this.parentElement.offsetWidth)"></div>`;
                    trH.appendChild(th);
                });
                thead.appendChild(trH);
                table.appendChild(thead);

                let tbody = document.createElement("tbody");
                
                monthInfo.rows.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach((rowItem, rIdx) => {
                    let tr = document.createElement("tr");
                    tr.style.height = "35px"; // Chiều cao hàng tiêu chuẩn ban đầu
                    
                    let dObj = new Date(rowItem.date);
                    let dStrVN = `${String(dObj.getDate()).padStart(2,'0')}/${String(dObj.getMonth()+1).padStart(2,'0')}/${dObj.getFullYear()}`;
                    
                    // Ô số hàng (#) tích hợp Resizer kéo dọc chiều cao hàng
                    let tdNum = document.createElement("td");
                    tdNum.className = "row-index";
                    tdNum.innerHTML = `${rIdx + 1}<div class="resizer-row" onmousedown="initResize(event, 'row', this.parentElement.parentElement, this.parentElement.parentElement.offsetHeight)"></div>`;
                    tr.appendChild(tdNum);

                    // Ô hiển thị Ngày lên lịch
                    let tdDate = document.createElement("td");
                    tdDate.style.fontWeight = "bold";
                    tdDate.style.color = "var(--blue)";
                    tdDate.style.textAlign = "center";
                    tdDate.innerText = dStrVN;
                    tr.appendChild(tdDate);
                    
                    // Điền chuỗi dữ liệu các ô
                    rowItem.data.forEach(cell => {
                        let td = document.createElement("td");
                        let cellContent = String(cell).replace(/<[^>]*>?/gm, '').trim(); 
                        
                        let cellDiv = document.createElement("div");
                        cellDiv.className = "cell-view";
                        cellDiv.innerText = cellContent;
                        
                        // Xử lý Double Click mở bung nội dung xem toàn bộ
                        cellDiv.ondblclick = function(e) {
                            e.stopPropagation();
                            document.querySelectorAll(".cell-expanded").forEach(x => x.remove());
                            
                            let exp = document.createElement("div");
                            exp.className = "cell-expanded";
                            exp.innerText = this.innerText;
                            exp.onclick = function(ev) { ev.stopPropagation(); this.remove(); };
                            
                            this.parentElement.appendChild(exp);
                        };

                        td.appendChild(cellDiv);
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });

                table.appendChild(tbody);
                tableContainer.appendChild(table);
                groupDiv.appendChild(tableContainer);
                area.appendChild(groupDiv);
            });

            if (!hasVisibleData) {
                area.innerHTML = `<div class="empty-msg">Không có dữ liệu kế hoạch phù hợp với bộ lọc.</div>`;
            }
        }

        // ==========================================
        // XỬ LÝ POPUP LỌC THÁNG
        // ==========================================
        function openFilterPopup(e) {
            e.stopPropagation();
            let popup = document.getElementById("filterPopup");
            let list = document.getElementById("filterList");
            list.innerHTML = "";

            let planSheet = sysData.sheets["_PLAN_DATA_"];
            if(!planSheet) return;

            let uniqueMonths = new Set();
            for (let i = 1; i < planSheet.length; i++) {
                if(planSheet[i][0] === activeBottomTab && planSheet[i][1]) {
                    let d = new Date(planSheet[i][1]);
                    uniqueMonths.add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
                }
            }

            let sorted = Array.from(uniqueMonths).sort();
            sorted.forEach(mKey => {
                let parts = mKey.split("-");
                let label = `Tháng ${parts[1]}/${parts[0]}`;
                let isChecked = activeFilters.includes(mKey) ? "checked" : "";
                
                let div = document.createElement("div");
                div.className = "menu-item";
                div.innerHTML = `<input type="checkbox" value="${mKey}" class="month-cb" style="pointer-events:none;" ${isChecked}> <span>${label}</span>`;
                div.onclick = function(ev) {
                    ev.stopPropagation();
                    let cb = this.querySelector('input');
                    cb.checked = !cb.checked;
                };
                list.appendChild(div);
            });

            let rect = e.target.getBoundingClientRect();
            popup.style.top = (rect.bottom + 5) + "px";
            popup.style.left = rect.left + "px";
            popup.style.display = "block";
        }

        function applyFilter() {
            activeFilters = [];
            document.querySelectorAll(".month-cb").forEach(cb => {
                if (cb.checked) activeFilters.push(cb.value);
            });
            document.getElementById("filterPopup").style.display = "none";
            processAndRender();
        }

        function clearFilter() {
            activeFilters = [];
            document.getElementById("filterPopup").style.display = "none";
            processAndRender();
        }
    </script>
</body>
</html>
