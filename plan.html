<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô-đun Kế Hoạch</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --white: #ffffff; --blue: #01adee; --red: #db1010; --gray-light: #f1f3f4; --gray-border: #e0e0e0; --text-main: #333333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--gray-light); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Toolbar */
        .toolbar { height: 40px; background: var(--white); border-bottom: 1px solid var(--gray-border); display: flex; align-items: center; padding: 0 10px; flex-shrink: 0; justify-content: space-between; z-index: 100; }
        .tool-btn { background: var(--white); border: 1px solid var(--gray-border); color: var(--blue); padding: 4px 10px; cursor: pointer; font-size: 12px; font-weight: bold; border-radius: 3px; display: inline-flex; align-items: center; gap: 4px; transition: 0.2s;}
        .tool-btn:hover { background: var(--blue); color: var(--white); border: 1px solid var(--blue); }
        #syncStatus { font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 4px; }

        /* Vùng cuộn chính */
        .scroll-area { flex: 1; overflow: auto; background: var(--gray-light); position: relative; }
        
        .content-wrapper { display: inline-block; min-width: 100%; background: var(--white); padding-bottom: 50px; }
        .month-group { width: 100%; display: flex; flex-direction: column; }

        /* Mega Row (Thanh Tháng) - Cố định Top 0 */
        .mega-row-btn { 
            position: sticky; top: 0; z-index: 40; width: 100%; height: 48px;
            background: var(--blue); color: var(--white); font-size: 15px; border: none; 
            cursor: pointer; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .mega-row-content { position: sticky; left: 20px; display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .mega-row-btn i.fa-chevron-down { transition: transform 0.3s; margin-left: auto; position: sticky; left: calc(100vw - 40px); }
        .month-group.collapsed .table-container { display: none; }
        .month-group.collapsed i.fa-chevron-down { transform: rotate(-90deg); }

        /* Khung chứa bảng */
        .table-container { display: block; }

        /* Cấu trúc Bảng ÉP CỨNG TUYỆT ĐỐI */
        table { 
            border-collapse: separate; 
            border-spacing: 0; 
            table-layout: fixed; /* Ép cứng chiều rộng cột */
        }
        
        /* Tiêu đề bảng - Cố định dưới Mega-row (48px) */
        th { 
            position: sticky; top: 48px; z-index: 30; background: var(--gray-light); color: var(--text-main); 
            height: 35px; padding: 0 10px; font-size: 13px; text-align: left; white-space: nowrap; 
            border-bottom: 1px solid var(--gray-border); border-right: 1px solid var(--gray-border);
            box-shadow: 0 -2px 0 var(--blue); overflow: hidden; text-overflow: ellipsis;
        }
        th:first-child { border-left: 1px solid var(--gray-border); }

        /* Dòng dữ liệu */
        td { 
            height: 35px; padding: 0; border-bottom: 1px solid var(--gray-border); 
            border-right: 1px solid var(--gray-border); background: var(--white);
            position: relative; max-width: 0; /* max-width: 0 giúp table-layout: fixed hoạt động mượt mà */
        }
        td:first-child { border-left: 1px solid var(--gray-border); }

        /* Cố định cột STT (#) bên trái */
        th.col-index { left: 0; z-index: 35; text-align: center; background: #e0e0e0; }
        td.row-index { position: sticky; left: 0; z-index: 20; background: var(--gray-light); text-align: center; font-weight: bold; color: #7f8c8d; user-select: none; }

        /* Bộ Khung Giữ Chiều Cao 35px Tuyệt Đối */
        .cell-view {
            height: 34px; line-height: 34px; padding: 0 10px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            font-size: 13px; cursor: pointer; width: 100%;
        }

        /* Khung hiển thị nội dung bung ra khi Double-click */
        .cell-expanded {
            position: absolute; top: -1px; left: -1px; z-index: 100;
            height: max-content; max-height: 300px; width: max-content;
            min-width: calc(100% + 2px); max-width: 500px; background: var(--white);
            border: 1.5px solid var(--blue); box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            padding: 15px 10px 10px 10px; white-space: pre-wrap; word-wrap: break-word;
            overflow-y: auto; color: var(--text-main); font-weight: normal;
            font-size: 13px; line-height: 1.5; text-align: left; border-radius: 4px; cursor: text;
        }

        /* Nút Close cho ô bung rộng */
        .close-expanded-btn {
            position: absolute; top: 4px; right: 6px; font-size: 14px;
            color: var(--red); cursor: pointer; opacity: 0.7; transition: 0.2s;
        }
        .close-expanded-btn:hover { opacity: 1; transform: scale(1.1); }

        /* Resizer Hàng/Cột */
        .resizer-col { position: absolute; right: 0; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 25; }
        .resizer-col:hover { background: rgba(1, 173, 238, 0.5); }
        .resizer-row { position: absolute; bottom: 0; left: 0; right: 0; height: 6px; cursor: row-resize; z-index: 25; }
        .resizer-row:hover { background: rgba(1, 173, 238, 0.5); }

        /* Thanh Footer Tabs */
        .footer-tabs { 
            height: 40px; background: var(--white); display: flex; align-items: center; 
            padding: 0 10px; border-top: 1px solid var(--gray-border); overflow-x: auto; 
            flex-shrink: 0; z-index: 100;
        }
        .tab-item { 
            padding: 6px 20px; background: var(--white); border: 1px solid var(--gray-border); 
            color: var(--text-main); opacity: 0.8; cursor: pointer; font-size: 13px; 
            font-weight: bold; margin-right: 6px; border-radius: 4px; white-space: nowrap; transition: 0.2s;
        }
        .tab-item:hover { opacity: 1; border-color: var(--blue); }
        .tab-item.active { background: var(--blue); color: var(--white); opacity: 1; border: 1px solid var(--blue); }

        .empty-msg { text-align: center; color: #999; font-style: italic; font-size: 14px; margin-top: 50px; padding: 20px; width: 100vw; position: sticky; left: 0; }

        /* Popup Lọc */
        .popup-box { position: absolute; background: var(--white); border: 1px solid var(--gray-border); box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 9999; display: none; border-radius: 4px; overflow: hidden; }
        .popup-header { background: var(--gray-light); padding: 10px 15px; font-weight: bold; border-bottom: 1px solid var(--gray-border); font-size: 13px; }
        .menu-item { padding: 8px 15px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; color: var(--text-main); font-weight: 500;}
        .menu-item:hover { background: #f1f3f4; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div>
            <button class="tool-btn" onclick="openFilterPopup(event)"><i class="fas fa-filter"></i> Lọc Theo Tháng</button>
            <button class="tool-btn" style="background:var(--white); color:var(--text-main); border-color:var(--gray-border);" onclick="forceReload()"><i class="fas fa-sync-alt"></i> Làm Mới View</button>
        </div>
        <span id="syncStatus">✅ Dữ liệu hệ thống</span>
    </div>

    <div class="scroll-area" id="scrollArea">
        <div class="content-wrapper" id="planArea"></div>
    </div>

    <div class="footer-tabs" id="bottomTabs"></div>

    <div id="filterPopup" class="popup-box" style="min-width: 220px;">
        <div class="popup-header"><i class="fas fa-filter"></i> Chọn Tháng Hiển Thị</div>
        <div id="filterList" style="max-height: 250px; overflow-y: auto;"></div>
        <div style="display:flex; padding: 8px; border-top: 1px solid var(--gray-border); gap: 5px;">
            <button class="tool-btn" style="flex:1; justify-content:center; margin:0;" onclick="applyFilter()">Áp Dụng</button>
            <button class="tool-btn" style="flex:1; justify-content:center; margin:0; background:var(--white); color:var(--text-main);" onclick="clearFilter()">Bỏ Lọc</button>
        </div>
    </div>

    <script>
        let sysData = {};
        let activeFilters = [];
        let activeBottomTab = ""; 
        let isResizing = false;
        let resizeData = { type: '', targetEl: null, startDim: 0, startMouse: 0, startTableW: 0 };

        window.onload = () => {
            loadData();
            
            // Xử lý đóng Popup và Khung bung nội dung khi click ra ngoài
            document.addEventListener('click', (e) => {
                if(!document.getElementById('filterPopup').contains(e.target)) {
                    document.getElementById('filterPopup').style.display = 'none';
                }
                
                // Nếu click không trúng ô đang bung thì dọn dẹp các ô đang bung
                if(!e.target.closest('.cell-expanded')) {
                    document.querySelectorAll(".cell-expanded").forEach(x => x.remove());
                }
            });

            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
        };

        function forceReload() { loadData(); }

        function loadData() {
            let cached = localStorage.getItem("MKT_DATA");
            if (cached) {
                sysData = JSON.parse(cached);
                processAndRender();
            } else {
                document.getElementById("planArea").innerHTML = `<div class="empty-msg">Chưa có dữ liệu hệ thống. Vui lòng quay lại tab Ý TƯỞNG để tải dữ liệu.</div>`;
            }
        }

        // ==========================================
        // RESIZER: KÉO GIÃN KÍCH THƯỚC ĐỒNG BỘ CẢ BẢNG
        // ==========================================
        function initResize(e, type, targetEl, currentDim) {
            e.stopPropagation(); e.preventDefault();
            isResizing = true;
            let tableEl = targetEl.closest('table');
            resizeData = { 
                type: type, 
                targetEl: targetEl, 
                startDim: currentDim, 
                startMouse: type === 'col' ? e.clientX : e.clientY,
                startTableW: tableEl ? tableEl.offsetWidth : 0 // Lưu chiều dài gốc của bảng
            };
            document.body.style.cursor = type === 'col' ? 'col-resize' : 'row-resize';
        }

        function handleMouseMove(e) {
            if (!isResizing) return;
            let delta = (resizeData.type === 'col' ? e.clientX : e.clientY) - resizeData.startMouse;
            let newDim = Math.max(30, resizeData.startDim + delta); 
            
            if (resizeData.type === 'col') {
                resizeData.targetEl.style.width = newDim + "px";
                
                // Thay đổi chiều rộng của Table đồng thời để nó không bị ép lại
                let tbl = resizeData.targetEl.closest('table');
                if (tbl) {
                    let diff = newDim - resizeData.startDim;
                    let newTableW = resizeData.startTableW + diff;
                    tbl.style.width = newTableW + "px";
                    tbl.style.minWidth = newTableW + "px";
                }
            } else {
                resizeData.targetEl.style.height = newDim + "px";
            }
        }

        function handleMouseUp() {
            if (!isResizing) return;
            isResizing = false; document.body.style.cursor = 'default';
        }

        function toggleMegaRow(btn) {
            btn.parentElement.classList.toggle('collapsed');
        }

        // ==========================================
        // LÕI XỬ LÝ & RENDER GIAO DIỆN BẢNG
        // ==========================================
        function processAndRender() {
            let area = document.getElementById("planArea");
            let tabsWrapper = document.getElementById("bottomTabs");
            area.innerHTML = ""; tabsWrapper.innerHTML = "";

            let planSheet = sysData.sheets["_PLAN_DATA_"];
            if (!planSheet || planSheet.length <= 1) {
                area.innerHTML = `<div class="empty-msg"><i class="fas fa-folder-open" style="font-size:30px; color:var(--gray-border); margin-bottom:10px;"></i><br>Chưa có kế hoạch nào được lên lịch.</div>`;
                return;
            }

            let uniqueTabs = new Set();
            for (let i = 1; i < planSheet.length; i++) {
                if(planSheet[i][0]) uniqueTabs.add(planSheet[i][0]);
            }
            let availableTabs = Array.from(uniqueTabs);

            if (availableTabs.length === 0) {
                area.innerHTML = `<div class="empty-msg">Chưa có dữ liệu kế hoạch hợp lệ.</div>`;
                return;
            }

            if (!activeBottomTab || !availableTabs.includes(activeBottomTab)) activeBottomTab = availableTabs[0];

            availableTabs.forEach(tab => {
                let div = document.createElement("div");
                div.className = "tab-item" + (tab === activeBottomTab ? " active" : "");
                div.innerHTML = `<i class="fas fa-table" style="margin-right: 5px; opacity: 0.7;"></i> ${tab}`;
                div.onclick = () => { activeBottomTab = tab; processAndRender(); };
                tabsWrapper.appendChild(div);
            });

            let tabAttrs = sysData.attributes[activeBottomTab] || {};
            let originalColWidths = tabAttrs.colWidths || {};

            let groupedData = {};
            for (let i = 1; i < planSheet.length; i++) {
                let tabName = planSheet[i][0];
                let dateStr = planSheet[i][1];
                let rowDataJson = planSheet[i][2];

                if (tabName !== activeBottomTab || !dateStr || !rowDataJson) continue; 

                let dateObj = new Date(dateStr);
                let monthKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
                let monthLabel = `Tháng ${dateObj.getMonth() + 1} / ${dateObj.getFullYear()}`;

                if (!groupedData[monthKey]) groupedData[monthKey] = { label: monthLabel, rows: [] };

                let parsedRow = [];
                try { parsedRow = JSON.parse(rowDataJson); } catch(e){}
                groupedData[monthKey].rows.push({ date: dateStr, data: parsedRow });
            }

            let sortedMonths = Object.keys(groupedData).sort();
            let hasVisibleData = false;

            let headers = [];
            if (sysData.sheets[activeBottomTab] && sysData.sheets[activeBottomTab].length > 0) {
                headers = sysData.sheets[activeBottomTab][0];
            }

            sortedMonths.forEach(mKey => {
                if (activeFilters.length > 0 && !activeFilters.includes(mKey)) return;
                hasVisibleData = true;
                let monthInfo = groupedData[mKey];

                let groupDiv = document.createElement("div");
                groupDiv.className = "month-group";

                let btn = document.createElement("button");
                btn.className = "mega-row-btn"; 
                btn.innerHTML = `
                    <div class="mega-row-content">
                        <i class="fas fa-calendar-check"></i> Kế hoạch: ${monthInfo.label}
                    </div>
                    <i class="fas fa-chevron-down"></i>
                `;
                btn.onclick = function() { toggleMegaRow(this); };
                groupDiv.appendChild(btn);

                let tableContainer = document.createElement("div");
                tableContainer.className = "table-container";

                let table = document.createElement("table");
                
                if (headers.length === 0 && monthInfo.rows.length > 0) {
                    for(let c=0; c<monthInfo.rows[0].data.length; c++) headers.push("Cột " + (c+1));
                }
                
                // --- TÍNH TỔNG WIDTH CHIỀU NGANG CHO BẢNG ---
                let totalTableWidth = 40 + 120; // Cột STT (#) = 40, Cột Deadline = 120
                headers.forEach((h, idx) => {
                    let baseW = originalColWidths[idx] ? parseInt(originalColWidths[idx]) : 150;
                    totalTableWidth += baseW;
                });
                // Ép cứng width cho thẻ table để các cột tuân lệnh
                table.style.width = totalTableWidth + "px";
                table.style.minWidth = totalTableWidth + "px";
                
                let thead = document.createElement("thead");
                let trH = document.createElement("tr");
                
                let thIndex = document.createElement("th");
                thIndex.className = "col-index";
                thIndex.style.width = "40px";
                thIndex.innerText = "#";
                trH.appendChild(thIndex);
                
                let thDate = document.createElement("th");
                thDate.style.width = "120px";
                thDate.style.color = "var(--red)";
                thDate.innerHTML = `Deadline <div class="resizer-col" onmousedown="initResize(event, 'col', this.parentElement, this.parentElement.offsetWidth)"></div>`;
                trH.appendChild(thDate);

                headers.forEach((h, idx) => {
                    let th = document.createElement("th");
                    let baseW = originalColWidths[idx] ? parseInt(originalColWidths[idx]) : 150; 
                    th.style.width = baseW + "px";
                    th.innerHTML = `${h}<div class="resizer-col" onmousedown="initResize(event, 'col', this.parentElement, this.parentElement.offsetWidth)"></div>`;
                    trH.appendChild(th);
                });
                thead.appendChild(trH);
                table.appendChild(thead);

                let tbody = document.createElement("tbody");
                
                monthInfo.rows.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach((rowItem, rIdx) => {
                    let tr = document.createElement("tr");
                    
                    let dObj = new Date(rowItem.date);
                    let dStrVN = `${String(dObj.getDate()).padStart(2,'0')}/${String(dObj.getMonth()+1).padStart(2,'0')}/${dObj.getFullYear()}`;
                    
                    let tdNum = document.createElement("td");
                    tdNum.className = "row-index";
                    tdNum.innerHTML = `${rIdx + 1}<div class="resizer-row" onmousedown="initResize(event, 'row', this.parentElement.parentElement, this.parentElement.parentElement.offsetHeight)"></div>`;
                    tr.appendChild(tdNum);

                    let tdDate = document.createElement("td");
                    tdDate.innerHTML = `<div class="cell-view" style="font-weight:bold; color:var(--blue); text-align:center;">${dStrVN}</div>`;
                    tr.appendChild(tdDate);
                    
                    rowItem.data.forEach(cell => {
                        let td = document.createElement("td");
                        let cellContent = String(cell).replace(/<[^>]*>?/gm, '').trim(); 
                        
                        let cellDiv = document.createElement("div");
                        cellDiv.className = "cell-view";
                        cellDiv.innerText = cellContent;
                        
                        // KÍCH ĐÚP (Double Click) MỞ BUNG NỘI DUNG MỚI
                        cellDiv.ondblclick = function(e) {
                            e.stopPropagation();
                            
                            // Xóa các ô đang bung khác đi
                            document.querySelectorAll(".cell-expanded").forEach(x => x.remove());
                            
                            let exp = document.createElement("div");
                            exp.className = "cell-expanded";
                            
                            // Nút X (Đóng) góc phải
                            let closeBtn = document.createElement("i");
                            closeBtn.className = "fas fa-times close-expanded-btn";
                            closeBtn.onclick = function(ev) { ev.stopPropagation(); exp.remove(); };
                            
                            let contentDiv = document.createElement("div");
                            contentDiv.style.marginTop = "8px";
                            contentDiv.innerText = this.innerText;
                            
                            exp.appendChild(closeBtn);
                            exp.appendChild(contentDiv);
                            
                            // Chặn event để bấm bên trong text (như bôi đen copy) không làm tắt popup
                            exp.onclick = function(ev) { ev.stopPropagation(); }; 
                            
                            this.parentElement.appendChild(exp);
                        };

                        td.appendChild(cellDiv);
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });

                table.appendChild(tbody);
                tableContainer.appendChild(table);
                groupDiv.appendChild(tableContainer);
                area.appendChild(groupDiv);
            });

            if (!hasVisibleData) {
                area.innerHTML = `<div class="empty-msg">Không có dữ liệu kế hoạch phù hợp với bộ lọc.</div>`;
            }
        }

        // ==========================================
        // XỬ LÝ LỌC THÁNG
        // ==========================================
        function openFilterPopup(e) {
            e.stopPropagation();
            let popup = document.getElementById("filterPopup");
            let list = document.getElementById("filterList");
            list.innerHTML = "";

            let planSheet = sysData.sheets["_PLAN_DATA_"];
            if(!planSheet) return;

            let uniqueMonths = new Set();
            for (let i = 1; i < planSheet.length; i++) {
                if(planSheet[i][0] === activeBottomTab && planSheet[i][1]) {
                    let d = new Date(planSheet[i][1]);
                    uniqueMonths.add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
                }
            }

            let sorted = Array.from(uniqueMonths).sort();
            sorted.forEach(mKey => {
                let parts = mKey.split("-");
                let label = `Tháng ${parts[1]}/${parts[0]}`;
                let isChecked = activeFilters.includes(mKey) ? "checked" : "";
                
                let div = document.createElement("div");
                div.className = "menu-item";
                div.innerHTML = `<input type="checkbox" value="${mKey}" class="month-cb" style="pointer-events:none;" ${isChecked}> <span>${label}</span>`;
                div.onclick = function(ev) {
                    ev.stopPropagation();
                    let cb = this.querySelector('input');
                    cb.checked = !cb.checked;
                };
                list.appendChild(div);
            });

            let rect = e.target.getBoundingClientRect();
            popup.style.top = (rect.bottom + 5) + "px";
            popup.style.left = rect.left + "px";
            popup.style.display = "block";
        }

        function applyFilter() {
            activeFilters = [];
            document.querySelectorAll(".month-cb").forEach(cb => { if (cb.checked) activeFilters.push(cb.value); });
            document.getElementById("filterPopup").style.display = "none";
            processAndRender();
        }

        function clearFilter() {
            activeFilters = [];
            document.getElementById("filterPopup").style.display = "none";
            processAndRender();
        }
    </script>
</body>
</html>
