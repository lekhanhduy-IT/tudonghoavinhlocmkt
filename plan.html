<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô-đun Kế Hoạch</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --white: #ffffff; --blue: #01adee; --red: #db1010; --gray-light: #f1f3f4; --gray-border: #e0e0e0; --text-main: #333333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--white); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Toolbar */
        .toolbar { height: 40px; background: var(--white); border-bottom: 0.5px solid var(--gray-border); display: flex; align-items: center; padding: 0 10px; flex-shrink: 0; justify-content: space-between; }
        .tool-btn { background: var(--white); border: 0.5px solid var(--gray-border); color: var(--blue); padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: bold; border-radius: 4px; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s;}
        .tool-btn:hover { background: var(--blue); color: var(--white); border: 0.5px solid var(--blue); }
        #syncStatus { font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 4px; }

        /* Content Area */
        .scroll-area { flex: 1; overflow-y: auto; padding: 20px; background: #f9f9f9; }
        
        /* Mega Row (Tháng) */
        .mega-row-btn { background: var(--blue); color: var(--white); width: 100%; padding: 15px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; text-align: left; display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-top: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: background 0.2s; }
        .mega-row-btn:hover { background: #0199d3; }
        .mega-row-btn i { transition: transform 0.3s; }
        .mega-row-btn.open i { transform: rotate(180deg); }
        
        /* Content bên trong Mega Row */
        .month-content { display: none; background: var(--white); border: 1px solid var(--gray-border); border-top: none; border-radius: 0 0 6px 6px; padding: 20px; margin-top: -4px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .month-content.open { display: block; }

        /* Tab Sheet Header */
        .tab-section { margin-bottom: 25px; }
        .tab-section:last-child { margin-bottom: 0; }
        .tab-title { font-size: 14px; font-weight: bold; color: var(--red); margin-bottom: 10px; display: inline-block; border-bottom: 1.5px solid var(--red); padding-bottom: 4px; }
        
        /* Bảng dữ liệu */
        table { width: 100%; border-collapse: collapse; table-layout: auto; }
        th, td { border: 0.5px solid var(--gray-border); padding: 8px 10px; font-size: 13px; }
        th { background: var(--gray-light); color: var(--text-main); position: sticky; top: 0; text-align: left; }
        .empty-msg { text-align: center; color: #999; font-style: italic; font-size: 14px; margin-top: 50px; }

        /* Popup */
        .popup-box { position: absolute; background: var(--white); border: 0.5px solid var(--gray-border); box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 9999; display: none; border-radius: 6px; overflow: hidden; }
        .popup-header { background: var(--gray-light); padding: 10px 15px; font-weight: bold; border-bottom: 0.5px solid var(--gray-border); font-size: 13px; }
        .menu-item { padding: 8px 15px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; color: var(--text-main); font-weight: 500;}
        .menu-item:hover { background: #f1f3f4; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div>
            <button class="tool-btn" onclick="openFilterPopup(event)"><i class="fas fa-calendar-alt"></i> Lọc Theo Tháng</button>
            <button class="tool-btn" style="background:var(--white); color:var(--text-main); border-color:var(--gray-border);" onclick="renderPlanData()"><i class="fas fa-sync-alt"></i> Làm Mới View</button>
        </div>
        <span id="syncStatus">✅ Dữ liệu nội bộ</span>
    </div>

    <div class="scroll-area" id="planArea">
        </div>

    <div id="filterPopup" class="popup-box" style="min-width: 220px;">
        <div class="popup-header"><i class="fas fa-filter"></i> Chọn Tháng Hiển Thị</div>
        <div id="filterList" style="max-height: 300px; overflow-y: auto;"></div>
        <div style="display:flex; padding: 10px; border-top: 0.5px solid var(--gray-border); gap: 5px;">
            <button class="tool-btn" style="flex:1; justify-content:center; padding: 6px;" onclick="applyFilter()">Áp Dụng</button>
            <button class="tool-btn" style="flex:1; justify-content:center; padding: 6px; background:var(--white); color:var(--text-main);" onclick="clearFilter()">Bỏ Lọc</button>
        </div>
    </div>

    <script>
        let sysData = {};
        let activeFilters = [];

        window.onload = () => {
            let cached = localStorage.getItem("MKT_DATA");
            if (cached) {
                sysData = JSON.parse(cached);
                renderPlanData();
            } else {
                document.getElementById("planArea").innerHTML = `<div class="empty-msg">Không tìm thấy dữ liệu. Vui lòng mở Tab Ý TƯỞNG trước.</div>`;
            }

            // Đóng popup khi click ra ngoài
            document.addEventListener('click', (e) => {
                if(!document.getElementById('filterPopup').contains(e.target)) {
                    document.getElementById('filterPopup').style.display = 'none';
                }
            });
        };

        // Hàm ẩn hiện nội dung Mega Row
        function toggleMegaRow(btn) {
            btn.classList.toggle('open');
            let content = btn.nextElementSibling;
            content.classList.toggle('open');
        }

        // Xử lý và Render HTML từ _PLAN_DATA_
        function renderPlanData() {
            let area = document.getElementById("planArea");
            area.innerHTML = "";

            let planSheet = sysData.sheets["_PLAN_DATA_"];
            if (!planSheet || planSheet.length <= 1) {
                area.innerHTML = `<div class="empty-msg"><i class="fas fa-box-open" style="font-size:30px; color:var(--gray-border); margin-bottom:10px;"></i><br>Chưa có dữ liệu nào được lên lịch.</div>`;
                return;
            }

            // Nhóm dữ liệu: Group[Tháng/Năm][Tên Tab] = Array(Rows)
            let groupedData = {};
            
            // Chạy từ dòng 1 (bỏ qua header hệ thống)
            for (let i = 1; i < planSheet.length; i++) {
                let tabName = planSheet[i][0];
                let dateStr = planSheet[i][1];
                let rowDataJson = planSheet[i][2];

                if (!dateStr || !rowDataJson) continue;

                let dateObj = new Date(dateStr);
                // Tạo key nhóm dạng YYYY-MM để sort dễ, và Label để hiển thị
                let monthKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
                let monthLabel = `Tháng ${dateObj.getMonth() + 1} / ${dateObj.getFullYear()}`;

                if (!groupedData[monthKey]) groupedData[monthKey] = { label: monthLabel, tabs: {} };
                if (!groupedData[monthKey].tabs[tabName]) groupedData[monthKey].tabs[tabName] = [];

                let parsedRow = [];
                try { parsedRow = JSON.parse(rowDataJson); } catch(e){}
                
                groupedData[monthKey].tabs[tabName].push({
                    date: dateStr,
                    data: parsedRow
                });
            }

            // Lấy danh sách tháng và Sort mới nhất lên đầu (hoặc cũ nhất)
            let sortedMonths = Object.keys(groupedData).sort();
            
            // Xây dựng Giao diện
            let hasVisibleData = false;

            sortedMonths.forEach(mKey => {
                // Kiểm tra bộ lọc
                if (activeFilters.length > 0 && !activeFilters.includes(mKey)) return;
                
                hasVisibleData = true;
                let monthInfo = groupedData[mKey];

                // Nút Mega Row
                let btn = document.createElement("button");
                btn.className = "mega-row-btn open"; // Mặc định mở
                btn.innerHTML = `<span><i class="fas fa-calendar-check" style="margin-right:8px;"></i> ${monthInfo.label}</span> <i class="fas fa-chevron-down"></i>`;
                btn.onclick = function() { toggleMegaRow(this); };
                area.appendChild(btn);

                // Khung chứa content của tháng
                let contentDiv = document.createElement("div");
                contentDiv.className = "month-content open";

                // Vòng lặp xuất từng Bảng (theo từng Tab gốc)
                Object.keys(monthInfo.tabs).forEach(tab => {
                    let section = document.createElement("div");
                    section.className = "tab-section";
                    
                    let title = document.createElement("div");
                    title.className = "tab-title";
                    title.innerHTML = `<i class="fas fa-table"></i> Gốc: ${tab}`;
                    section.appendChild(title);

                    // Lấy Header gốc từ sysData nếu tab gốc vẫn tồn tại
                    let headers = [];
                    if (sysData.sheets[tab] && sysData.sheets[tab].length > 0) {
                        headers = sysData.sheets[tab][0];
                    } else {
                        // Cứu cánh nếu mất tab gốc, tự map header giả
                        let maxCol = monthInfo.tabs[tab][0].data.length;
                        for(let c=0; c<maxCol; c++) headers.push("Cột " + (c+1));
                    }

                    let table = document.createElement("table");
                    let thead = `<tr><th>Ngày Lên Lịch</th>`;
                    headers.forEach(h => { thead += `<th>${h}</th>`; });
                    thead += `</tr>`;
                    table.innerHTML = `<thead>${thead}</thead>`;

                    let tbody = document.createElement("tbody");
                    monthInfo.tabs[tab].sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(rowItem => {
                        let tr = document.createElement("tr");
                        // Format lại ngày hiển thị DD/MM/YYYY
                        let dObj = new Date(rowItem.date);
                        let dStrVN = `${String(dObj.getDate()).padStart(2,'0')}/${String(dObj.getMonth()+1).padStart(2,'0')}/${dObj.getFullYear()}`;
                        
                        tr.innerHTML = `<td style="font-weight:bold; color:var(--blue); width: 120px;">${dStrVN}</td>`;
                        
                        // Render các cột (lọc bỏ thẻ HTML thừa nếu là text đơn thuần)
                        rowItem.data.forEach(cell => {
                            let cellContent = String(cell).replace(/<div[^>]*>/g, '').replace(/<\/div>/g, '<br>').trim();
                            tr.innerHTML += `<td>${cellContent}</td>`;
                        });
                        tbody.appendChild(tr);
                    });

                    table.appendChild(tbody);
                    section.appendChild(table);
                    contentDiv.appendChild(section);
                });

                area.appendChild(contentDiv);
            });

            if (!hasVisibleData) {
                area.innerHTML = `<div class="empty-msg">Không có dữ liệu phù hợp với bộ lọc.</div>`;
            }
        }

        // ==========================================
        // XỬ LÝ POPUP LỌC THÁNG
        // ==========================================
        function openFilterPopup(e) {
            e.stopPropagation();
            let popup = document.getElementById("filterPopup");
            let list = document.getElementById("filterList");
            list.innerHTML = "";

            let planSheet = sysData.sheets["_PLAN_DATA_"];
            if(!planSheet) return;

            let uniqueMonths = new Set();
            for (let i = 1; i < planSheet.length; i++) {
                if(planSheet[i][1]) {
                    let d = new Date(planSheet[i][1]);
                    uniqueMonths.add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
                }
            }

            let sorted = Array.from(uniqueMonths).sort();
            sorted.forEach(mKey => {
                let parts = mKey.split("-");
                let label = `Tháng ${parts[1]}/${parts[0]}`;
                let isChecked = activeFilters.includes(mKey) ? "checked" : "";
                
                let div = document.createElement("div");
                div.className = "menu-item";
                div.innerHTML = `<input type="checkbox" value="${mKey}" class="month-cb" style="pointer-events:none;" ${isChecked}> <span>${label}</span>`;
                div.onclick = function(ev) {
                    ev.stopPropagation();
                    let cb = this.querySelector('input');
                    cb.checked = !cb.checked;
                };
                list.appendChild(div);
            });

            // Định vị popup dưới nút
            let rect = e.target.getBoundingClientRect();
            popup.style.top = (rect.bottom + 5) + "px";
            popup.style.left = rect.left + "px";
            popup.style.display = "block";
        }

        function applyFilter() {
            activeFilters = [];
            document.querySelectorAll(".month-cb").forEach(cb => {
                if (cb.checked) activeFilters.push(cb.value);
            });
            document.getElementById("filterPopup").style.display = "none";
            renderPlanData();
        }

        function clearFilter() {
            activeFilters = [];
            document.getElementById("filterPopup").style.display = "none";
            renderPlanData();
        }
    </script>
</body>
</html>
