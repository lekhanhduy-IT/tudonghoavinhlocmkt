<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô-đun Kế Hoạch</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --white: #ffffff; --blue: #01adee; --red: #db1010; --gray-light: #f1f3f4; --gray-border: #e0e0e0; --text-main: #333333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--gray-light); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Toolbar */
        .toolbar { height: 40px; background: var(--white); border-bottom: 1px solid var(--gray-border); display: flex; align-items: center; padding: 0 10px; flex-shrink: 0; justify-content: space-between; z-index: 100; }
        .tool-btn { background: var(--white); border: 1px solid var(--gray-border); color: var(--blue); padding: 4px 10px; cursor: pointer; font-size: 12px; font-weight: bold; border-radius: 3px; display: inline-flex; align-items: center; gap: 4px; transition: 0.2s;}
        .tool-btn:hover { background: var(--blue); color: var(--white); border: 1px solid var(--blue); }
        #syncStatus { font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        #syncStatus:hover { background: var(--gray-light); }

        /* Vùng cuộn chính */
        .scroll-area { flex: 1; overflow: auto; background: var(--gray-light); position: relative; }
        .content-wrapper { display: inline-block; min-width: 100%; background: var(--white); padding-bottom: 50px; }
        .month-group { width: 100%; display: flex; flex-direction: column; }

        /* Mega Row (Thanh Tháng) */
        .mega-row-btn { 
            position: sticky; top: 0; z-index: 40; width: 100%; height: 35;
            background: var(--blue); color: var(--white); font-size: 15px; border: none; 
            cursor: pointer; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .mega-row-content { position: sticky; left: 20px; display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .mega-row-btn i.fa-chevron-down { transition: transform 0.3s; margin-left: auto; position: sticky; right: 20px; z-index: 45; }
        .month-group.collapsed .table-container { display: none; }
        .month-group.collapsed i.fa-chevron-down { transform: rotate(-90deg); }

        .table-container { display: block; }
        table { border-collapse: separate; border-spacing: 0; table-layout: fixed; }
        
        /* Tiêu đề bảng */
        th { 
            position: sticky; top: 48px; z-index: 30; background: var(--gray-light); color: var(--text-main); 
            height: 35px; padding: 0 10px; font-size: 13px; text-align: left; white-space: nowrap; 
            border-bottom: 1px solid var(--gray-border); border-right: 1px solid var(--gray-border);
            box-shadow: 0 -2px 0 var(--blue); overflow: hidden; text-overflow: ellipsis; user-select: none;
        }
        th:first-child { border-left: 1px solid var(--gray-border); }

        /* Dòng dữ liệu */
        td { 
            height: 35px; padding: 0; border-bottom: 1px solid var(--gray-border); 
            border-right: 1px solid var(--gray-border); background: var(--white);
            position: relative; max-width: 0; vertical-align: middle; cursor: pointer;
        }
        td:first-child { border-left: 1px solid var(--gray-border); }
        
        /* HIỆU ỨNG CHỌN DÒNG */
        tr.row-selected td { 
            box-shadow: inset 0 0 0 9999px rgba(1, 173, 238, 0.15) !important; 
        }

        /* Cố định cột STT (#) bên trái */
        th.col-index { left: 0; z-index: 35; text-align: center; background: #e0e0e0; }
        td.row-index { position: sticky; left: 0; z-index: 20; background: var(--gray-light); text-align: center; font-weight: bold; color: #7f8c8d; user-select: none; }

        /* ====== UI EDITORS BÊ TỪ IDEA.HTML ====== */
        .cell-editor { 
            width: 100%; height: 35px; max-height: 35px; padding: 8px 4px; outline: none; border: none; background: transparent; 
            color: inherit; font-weight: inherit; font-style: inherit; text-decoration: inherit; text-align: inherit;
            overflow: hidden; white-space: pre-wrap; word-wrap: break-word; line-height: 19px; cursor: text; display: block; resize: none; 
        }
        .cell-expanded { 
            position: absolute; top: -1px; left: -1px; z-index: 100; height: auto !important; max-height: none; min-height: 60px; 
            width: max-content; min-width: calc(100% + 2px); background: var(--white); border: 1.5px solid var(--blue); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); padding: 8px 4px !important; white-space: pre-wrap; overflow: visible; 
            color: var(--text-main); font-weight: normal; font-style: normal; text-decoration: none; text-align: left;
        }
        
        .dropdown-ui { 
            display: flex; justify-content: space-between; align-items: center; background: rgba(241, 243, 244, 0.8); 
            border-radius: 12px; padding: 1px 8px; margin: 4px; cursor: pointer; font-size: 11px; height: 27px; color: inherit;
        }
        .dropdown-ui:hover { background: rgba(232, 234, 237, 0.9); }
        .dropdown-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; font-weight: inherit; }

        /* Resizer */
        .resizer-col { position: absolute; right: 0; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 25; }
        .resizer-col:hover { background: rgba(1, 173, 238, 0.5); }
        .resizer-row { position: absolute; bottom: 0; left: 0; right: 0; height: 6px; cursor: row-resize; z-index: 25; }
        .resizer-row:hover { background: rgba(1, 173, 238, 0.5); }

        /* Thanh Footer Tabs */
        .footer-tabs { height: 40px; background: var(--white); display: flex; align-items: center; padding: 0 10px; border-top: 1px solid var(--gray-border); overflow-x: auto; flex-shrink: 0; z-index: 100; }
        .tab-item { padding: 6px 20px; background: var(--white); border: 1px solid var(--gray-border); color: var(--text-main); opacity: 0.8; cursor: pointer; font-size: 13px; font-weight: bold; margin-right: 6px; border-radius: 4px; white-space: nowrap; transition: 0.2s; }
        .tab-item:hover { opacity: 1; border-color: var(--blue); }
        .tab-item.active { background: var(--blue); color: var(--white); opacity: 1; border: 1px solid var(--blue); }

        .empty-msg { text-align: center; color: #999; font-style: italic; font-size: 14px; margin-top: 50px; padding: 20px; width: 100vw; position: sticky; left: 0; }

        /* Popup Box & Modal CSS */
        .popup-box { position: absolute; background: var(--white); border: 1px solid var(--gray-border); box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 9999; display: none; border-radius: 4px; overflow: hidden; }
        .popup-header { background: var(--gray-light); padding: 10px 15px; font-weight: bold; border-bottom: 1px solid var(--gray-border); font-size: 13px; }
        .menu-item { padding: 8px 15px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; color: var(--text-main); font-weight: 500;}
        .menu-item:hover { background: #f1f3f4; color: var(--blue); }
        .divider { border-bottom: 1px solid var(--gray-border); margin: 4px 0; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 10000; display: none; justify-content: center; align-items: center; }
        .modal-box { background: var(--white); border: 1px solid var(--gray-border); padding: 20px; width: 90%; max-width: 400px; border-radius: 6px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .btn-modal { padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; font-size: 13px; margin-left: 10px; outline: none; }
        .btn-blue { background: var(--blue); color: var(--white); border: 1px solid var(--blue); }
        .btn-blue:hover { background: #0199d3; }
        .btn-cancel { background: var(--white); color: var(--text-main); border: 1px solid var(--gray-border); }
        .btn-cancel:hover { background: var(--gray-light); color: var(--red); border-color: var(--red); }
    </style>
</head>
<body>

    <div class="toolbar">
        <div>
            <button class="tool-btn" onclick="openFilterPopup(event)"><i class="fas fa-filter"></i> Lọc Theo Tháng</button>
            <button class="tool-btn" style="background:var(--white); color:var(--text-main); border-color:var(--gray-border);" onclick="forceFetchData()"><i class="fas fa-sync-alt"></i> Tải Lại Cấu Hình</button>
            
            <button class="tool-btn" style="margin-left: 10px;" onclick="transferToPost()"><i class="fas fa-edit"></i> Viết bài</button>
        </div>
        <span id="syncStatus" onclick="forceFetchData()" title="Bấm để lấy dữ liệu mới nhất từ Sheet">🔄 Đang tải...</span>
    </div>

    <div class="scroll-area" id="scrollArea">
        <div class="content-wrapper" id="planArea"></div>
    </div>

    <div class="footer-tabs" id="bottomTabs"></div>

    <div id="filterPopup" class="popup-box" style="min-width: 220px;">
        <div class="popup-header"><i class="fas fa-filter"></i> Chọn Tháng Hiển Thị</div>
        <div id="filterList" style="max-height: 250px; overflow-y: auto;"></div>
        <div style="display:flex; padding: 8px; border-top: 1px solid var(--gray-border); gap: 5px;">
            <button class="tool-btn" style="flex:1; justify-content:center; margin:0;" onclick="applyFilter()">Áp Dụng</button>
            <button class="tool-btn" style="flex:1; justify-content:center; margin:0; background:var(--white); color:var(--text-main);" onclick="clearFilter()">Bỏ Lọc</button>
        </div>
    </div>

    <div id="dropdownPopup" class="popup-box" style="padding:5px; min-width:180px;">
        <div id="dropdownListArea" style="max-height:200px; overflow-y:auto;"></div>
    </div>

    <div id="planContextMenu" class="popup-box" style="min-width: 180px;"></div>

    <div id="systemModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle" style="color:var(--blue); margin-bottom:15px; border-bottom:1px solid var(--gray-border); padding-bottom:10px;">Tiêu đề</h3>
            <div id="modalBody"></div>
            <div id="modalFooter" style="text-align:right; margin-top:15px;"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbytCrAHTpFnykzOAwTkxbAR6tm32P9RZrS42EnUFh2WTWTQRtZr60Q27Lzrbhq_cuo/exec";
        
        let sysData = {};
        let activeFilters = [];
        let activeBottomTab = ""; 
        let actionQueue = []; 
        let isProcessingQueue = false; 
        let currentSyncToken = 0;
        
        // Quản lý Dòng & Menu Chuột Phải
        let selectedPlanIndexes = []; 
        let lastClickedTr = null;
        let selectedRowData = null; 

        let isResizing = false;
        let resizeData = { type: '', targetEl: null, startDim: 0, startMouse: 0, startTableW: 0 };
        let hasPendingUpdate = false;
        window.onload = () => {
            loadLocalData();
            fetchDataFromServer();
            
            setInterval(processQueueAndSync, 4000); 
            setInterval(() => {
                if(actionQueue.length === 0 && !isProcessingQueue && !checkIsEditing()) fetchDataFromServer();
            }, 20000); 
            
            document.addEventListener('click', (e) => {
                document.querySelectorAll('.popup-box').forEach(el => {
                    if(!el.contains(e.target)) el.style.display = 'none';
                });
                if(!e.target.closest('.cell-expanded')) {
                    document.querySelectorAll(".cell-expanded").forEach(x => { x.classList.remove("cell-expanded"); x.blur(); });
                }
            });
            document.querySelectorAll('.popup-box').forEach(box => { box.addEventListener('click', (e) => e.stopPropagation()); });

            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
            window.onload = () => {
           
            
            // ... (các hàm setInterval và EventListener có sẵn giữ nguyên) ...

            // THÊM ĐOẠN NÀY VÀO CUỐI HÀM WINDOW.ONLOAD CỦA PLAN.HTML
            // Lắng nghe sự thay đổi dữ liệu từ các tab khác (ví dụ từ post.html)
            window.addEventListener('storage', function(e) {
                if (e.key === "MKT_DATA") {
                    try {
                        let newData = JSON.parse(e.newValue);
                        if (newData && newData.sheets) {
                            sysData = newData;
                            processAndRender(); // Vẽ lại bảng kế hoạch ngay lập tức
                            console.log("Đã cập nhật dữ liệu từ Post.html");
                        }
                    } catch(err) {}
                }
            });
            // TÍNH NĂNG MỚI: Tự động vẽ lại bảng ngay khi click ra ngoài ô đang gõ
            document.addEventListener('mousedown', () => {
                setTimeout(() => {
                    if (hasPendingUpdate && !checkIsEditing()) {
                        hasPendingUpdate = false;
                        fetchDataFromServer(true); // Ép tải thẳng từ Google
                    }
                }, 200);
            });
            document.addEventListener('focusout', () => {
                setTimeout(() => {
                    if (hasPendingUpdate && !checkIsEditing()) {
                        hasPendingUpdate = false;
                        fetchDataFromServer(true);
                    }
                }, 200);
            });
        };
        };
        

        // ==========================================
        // SYSTEM MODAL & CHUYỂN DỮ LIỆU
        // ==========================================
        function showModal(title, bodyHtml, btns) { 
            document.getElementById("modalTitle").innerText = title; 
            document.getElementById("modalBody").innerHTML = bodyHtml; 
            let ft = document.getElementById("modalFooter"); ft.innerHTML = ""; 
            btns.forEach(b => { 
                let btn = document.createElement("button"); 
                btn.innerText = b.text; btn.className = "btn-modal " + (b.class || "btn-blue"); 
                btn.onclick = b.onclick; ft.appendChild(btn); 
            }); 
            document.getElementById("systemModal").style.display = "flex"; 
        }
        
        function closeModal() { document.getElementById("systemModal").style.display = "none"; }

function transferToPost() {
            document.getElementById("planContextMenu").style.display = "none"; 
            
            if(!selectedRowData || selectedPlanIndexes.length !== 1) {
                showModal("Lưu ý", "<p style='font-size: 14px; color: var(--text-main);'>Vui lòng chỉ click chọn <b>một dòng</b> dữ liệu bên dưới để tiến hành viết bài!</p>", [
                    { text: "Đã hiểu", class: "btn-blue", onclick: closeModal }
                ]);
                return;
            }
            
            // =================================================================
            // NÂNG CẤP 1: Tự động cấp Giấy khai sinh (ID) cho dòng kế hoạch mới
            // =================================================================
            let rowId = selectedRowData.data[0];
            if (!rowId || String(rowId).trim() === "") {
                // Đẻ ra ID chuẩn format: POST_[thời_gian]_[vị_trí_dòng]
                rowId = "POST_" + Date.now() + "_" + selectedPlanIndexes[0];
                selectedRowData.data[0] = rowId;
                
                // Ghi ngược ID này vào Google Sheet để ghim vĩnh viễn cho dòng này
                updatePlanCell(selectedPlanIndexes[0], 0, rowId);
            }

            // Cập nhật lại giỏ hàng LocalStorage (đã có chứa ID)
            localStorage.setItem("DRAFT_POST_DATA", JSON.stringify(selectedRowData));
            
            // =================================================================
            // NÂNG CẤP 2: Ép hướng iframe đích danh tới URL có tham số ?id=...
            // =================================================================
            let targetPostUrl = 'post.html?id=' + encodeURIComponent(rowId);

            if(window.parent && typeof window.parent.loadModule === 'function') {
                let sideItems = window.parent.document.querySelectorAll('.menu-item-side');
                let postItem = Array.from(sideItems).find(el => el.innerText.includes('BÀI VIẾT'));
                
                if(postItem) {
                    // Thò tay vào iframe Post, bóp cổ bắt nó phải chuyển sang link có ID
                    let postFrame = window.parent.document.getElementById('frame-post');
                    if (postFrame) {
                        postFrame.contentWindow.location.replace(targetPostUrl);
                    }
                    // Báo Admin mở màn hình Post lên
                    window.parent.loadModule('post.html', postItem);
                } else {
                    window.location.href = targetPostUrl;
                }
            } else {
                window.location.href = targetPostUrl;
            }
        }

        // ==========================================
        // QUẢN LÝ CHỌN DÒNG (Click & Shift+Click)
        // ==========================================
        function handleRowClick(e, tr, rowItem, headers) {
            if (e.shiftKey && lastClickedTr && lastClickedTr.parentElement === tr.parentElement) {
                // Xử lý Shift + Click: Chọn mảng dòng
                let tbody = tr.parentElement;
                let rows = Array.from(tbody.children);
                let idx1 = rows.indexOf(lastClickedTr);
                let idx2 = rows.indexOf(tr);
                let minIdx = Math.min(idx1, idx2);
                let maxIdx = Math.max(idx1, idx2);
                
                document.querySelectorAll('tr.row-selected').forEach(r => r.classList.remove('row-selected'));
                selectedPlanIndexes = [];
                selectedRowData = null; // Chặn "Viết bài" khi chọn nhiều dòng
                
                for(let i = minIdx; i <= maxIdx; i++) {
                    rows[i].classList.add('row-selected');
                    selectedPlanIndexes.push(parseInt(rows[i].dataset.planIndex));
                }
            } else {
                // Click đơn lẻ 1 dòng
                document.querySelectorAll('tr.row-selected').forEach(r => r.classList.remove('row-selected'));
                tr.classList.add('row-selected');
                selectedPlanIndexes = [parseInt(tr.dataset.planIndex)];
                lastClickedTr = tr;
                
                selectedRowData = {
                    planRowIndex: rowItem.planRowIndex,
                    date: rowItem.date,
                    tab: activeBottomTab,
                    data: rowItem.data,
                    headers: headers
                };
            }
        }

        function showContextMenu(e) {
            let menu = document.getElementById("planContextMenu");
            
            let html = `
                <div class="menu-item" onclick="returnToIdea()"><i class="fas fa-undo"></i> Chuyển về Ý tưởng</div>
            `;
            
            // Chỉ hiện nút Viết Bài khi chọn ĐÚNG 1 dòng
            if (selectedPlanIndexes.length === 1) {
                html += `<div class="menu-item" onclick="transferToPost()"><i class="fas fa-edit"></i> Viết bài</div>`;
            }
            
            html += `
                <div class="divider"></div>
                <div class="menu-item" style="color:var(--red);" onclick="deletePlanRows()"><i class="fas fa-trash"></i> Xóa</div>
            `;
            
            menu.innerHTML = html;
            showPopupSafe(menu, e);
        }

        // ==========================================
        // CÁC HÀNH ĐỘNG TỪ MENU CHUỘT PHẢI
        // ==========================================
        function returnToIdea() {
            document.getElementById("planContextMenu").style.display = "none";
            if (!selectedPlanIndexes.length) return;
            
            let targetTab = activeBottomTab;
            let planSheet = sysData.sheets["_PLAN_DATA_"];
            let targetSheet = sysData.sheets[targetTab];
            
            if (!targetSheet) {
                alert("Tab gốc bên Ý Tưởng không còn tồn tại!"); return;
            }

            // Sắp xếp ID giảm dần để khi dùng splice không bị lỗi dịch chuyển index
            let indexes = [...selectedPlanIndexes].sort((a,b) => b - a);
            
            let startTargetRow = targetSheet.length + 1; // Tính cho API Queue (Index bắt đầu từ 1)
            let rowsToInsert = [];
            
            indexes.forEach((idx) => {
                let rowDataJson = planSheet[idx][2];
                let parsedData = [];
                try { parsedData = JSON.parse(rowDataJson); } catch(e){}
                rowsToInsert.unshift(parsedData); // Push vào đầu mảng vì đang chạy ngược
            });
            
            // 1. Thêm vào bảng Ý Tưởng
            rowsToInsert.forEach(row => targetSheet.push(row));
            dispatchAction({type:'STRUCTURAL', action:'insertRow', index: startTargetRow, count: rowsToInsert.length, tab: targetTab});
            
            rowsToInsert.forEach((row, rOffset) => {
                row.forEach((val, cOffset) => {
                    if (val) dispatchAction({type:'SYNC_CELL', row: startTargetRow + rOffset, col: cOffset + 1, val: val, tab: targetTab});
                });
            });
            
            // 2. Xóa khỏi _PLAN_DATA_
            indexes.forEach(idx => {
                planSheet.splice(idx, 1);
                dispatchAction({type:'STRUCTURAL', action:'deleteRow', index: idx + 1, count: 1, tab: "_PLAN_DATA_"});
            });
            
            selectedPlanIndexes = [];
            selectedRowData = null;
            processAndRender();
        }

        function deletePlanRows() {
            document.getElementById("planContextMenu").style.display = "none";
            if (!selectedPlanIndexes.length) return;
            
            showModal("Xác nhận xóa", `<p style="font-size: 14px; margin-bottom: 5px;">Bạn có chắc muốn xóa <b>${selectedPlanIndexes.length}</b> dòng khỏi kế hoạch?</p><p style="font-size: 12px; color: var(--red);">Thao tác này sẽ xóa vĩnh viễn và không chuyển về Ý tưởng.</p>`, [
                { text: "Xóa ngay", class: "btn-blue", onclick: () => {
                    let planSheet = sysData.sheets["_PLAN_DATA_"];
                    let indexes = [...selectedPlanIndexes].sort((a,b) => b - a);
                    
                    indexes.forEach(idx => {
                        planSheet.splice(idx, 1);
                        dispatchAction({type:'STRUCTURAL', action:'deleteRow', index: idx + 1, count: 1, tab: "_PLAN_DATA_"});
                    });
                    
                    selectedPlanIndexes = [];
                    selectedRowData = null;
                    closeModal();
                    processAndRender();
                }},
                { text: "Hủy", class: "btn-cancel", onclick: closeModal }
            ]);
        }

        // ==========================================
        // HỆ THỐNG ĐỒNG BỘ CROSS-DEVICE & API
        // ==========================================
        function checkIsEditing() { return document.querySelector('.cell-expanded') !== null || (document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('cell-editor')); }
        function setSyncStatus(msg, color) { let s = document.getElementById('syncStatus'); s.innerText = msg; s.style.color = color; }

        function loadLocalData() {
            let cached = localStorage.getItem("MKT_DATA");
            if (cached) { sysData = JSON.parse(cached); currentSyncToken = sysData.syncToken || 0; processAndRender(); }
        }

        function forceFetchData() {
            if(checkIsEditing()) return alert("Vui lòng click ra ngoài ô đang gõ để làm mới dữ liệu!"); 
            fetchDataFromServer();
        }

        // Bổ sung tham số forceFromGoogle
        async function fetchDataFromServer(forceFromGoogle = false) {
            try {
                if(actionQueue.length === 0) setSyncStatus("🔄 Đang lấy dữ liệu...", "var(--blue)");
                
                // Quyết định hướng đi: Vào Não nhện hay Lên thẳng Google
                let fetchUrl = (!forceFromGoogle && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') 
                    ? "/api/get-brain" 
                    : API_URL + "?t=" + new Date().getTime();

                let res = await fetch(fetchUrl);
                let json = await res.json();
                
                // MA THUẬT BẺ LÁI: Nếu Não nhện lỗi, HOẶC Não nhện bị cũ hơn thực tế -> Gọi thẳng Google!
                if (fetchUrl === "/api/get-brain") {
                    if (!json.success || (json.success && json.data.syncToken < currentSyncToken)) {
                        console.warn("Não nhện bị cũ hoặc lỗi. Đang bẻ lái lấy dữ liệu tươi từ Google...");
                        res = await fetch(API_URL + "?t=" + new Date().getTime());
                        json = await res.json();
                    }
                }

                if(json.success) {
                    let localFilters = sysData.filters || {}; 
                    sysData = json.data; 
                    sysData.filters = localFilters; 
                    currentSyncToken = sysData.syncToken;
                    localStorage.setItem("MKT_DATA", JSON.stringify(sysData)); 
                    
                    // NẾU KHÔNG GÕ CHỮ -> VẼ LUÔN
                    if (!checkIsEditing()) { 
                        processAndRender(); 
                        setSyncStatus("✅ Sẵn sàng", "#27ae60"); 
                        hasPendingUpdate = false;
                    } 
                    // NẾU ĐANG GÕ CHỮ -> TREO CỜ CHỜ VẼ
                    else {
                        setSyncStatus("⚠️ Có dữ liệu mới", "#f39c12");
                        hasPendingUpdate = true;
                    }
                }
            } catch(e) { setSyncStatus("⚠️ Ngoại tuyến", "var(--red)"); }
        }

        async function processQueueAndSync() {
            if(isProcessingQueue) return; isProcessingQueue = true;
            let batch = [...actionQueue]; actionQueue = []; 
            try {
                if(batch.length > 0) setSyncStatus("⏳ Đang lưu...", "var(--blue)");
                let res = await fetch(API_URL, { method: "POST", body: JSON.stringify(batch), headers: { "Content-Type": "text/plain;charset=utf-8" } });
                let json = await res.json();
                
                if (!json.success) { 
                    if(batch.length > 0) actionQueue = batch.concat(actionQueue); 
                } 
                else { 
                    if(batch.length > 0) setSyncStatus("✅ Đã lưu", "#27ae60"); 
                    
                    // PHÁT HIỆN GOOGLE CÓ DỮ LIỆU MỚI TỪ NGUỒN KHÁC
                    if (currentSyncToken !== 0 && json.syncToken > currentSyncToken && batch.length === 0) {
                        currentSyncToken = json.syncToken; // Cập nhật token mới để fetchData biết đường bẻ lái
                        if(!checkIsEditing()) {
                            await fetchDataFromServer(true); // Ép tải thẳng từ Google
                        } else {
                            setSyncStatus("⚠️ Có dữ liệu mới", "#f39c12");
                            hasPendingUpdate = true;
                        }
                    } else {
                        currentSyncToken = json.syncToken;
                    }
                }
            } catch(e) { 
                if(batch.length > 0) { actionQueue = batch.concat(actionQueue); setSyncStatus("⚠️ Lỗi mạng", "var(--red)"); } 
            }
            isProcessingQueue = false;
        }

        function dispatchAction(action) { actionQueue.push(action); localStorage.setItem("MKT_DATA", JSON.stringify(sysData)); }

        // ==========================================
        // CẬP NHẬT DỮ LIỆU CỦA CELL
        // ==========================================
        function updatePlanCell(planRowIndex, origColIndex, newVal) {
            let planSheet = sysData.sheets["_PLAN_DATA_"];
            let rowDataJson = planSheet[planRowIndex][2];
            let parsedRow = [];
            try { parsedRow = JSON.parse(rowDataJson); } catch(e){}
            
            parsedRow[origColIndex] = newVal;
            let newJson = JSON.stringify(parsedRow);
            
            planSheet[planRowIndex][2] = newJson;
            localStorage.setItem("MKT_DATA", JSON.stringify(sysData));
            
            dispatchAction({ type: 'SYNC_CELL', row: planRowIndex + 1, col: 3, val: newJson, tab: '_PLAN_DATA_' });
        }

        // ==========================================
        // UI COMPONENTS & RENDER ENGINE
        // ==========================================
        function createEditor(planRowIndex, origColIndex, val) { 
            let ed = document.createElement("div"); ed.className = "cell-editor"; ed.contentEditable = "true"; ed.innerHTML = val; 
            ed.ondblclick = function(e) { e.stopPropagation(); document.querySelectorAll(".cell-expanded").forEach(x=>x.classList.remove("cell-expanded")); this.classList.add("cell-expanded"); }; 
            ed.onblur = function() { this.classList.remove("cell-expanded"); updatePlanCell(planRowIndex, origColIndex, this.innerHTML); }; 
            return ed; 
        }

        function showPopupSafe(menu, e) { 
            menu.style.display = "block"; let x = e.clientX, y = e.clientY + 15; 
            if(x + menu.offsetWidth > window.innerWidth) x = window.innerWidth - menu.offsetWidth - 5; 
            if(y + menu.offsetHeight > window.innerHeight) y = window.innerHeight - menu.offsetHeight - 5; 
            menu.style.left = x + "px"; menu.style.top = y + "px"; 
        }

        function openDropdownMenu(e, planRowIndex, origColIndex, current, opts) { 
            let box = document.getElementById("dropdownListArea"); box.innerHTML = ""; 
            opts.forEach(opt => { 
                let div = document.createElement("div"); div.className = "menu-item"; 
                let isChk = current.includes(opt); 
                div.innerHTML = `<input type="checkbox" ${isChk?'checked':''} style="pointer-events:none;"> <span>${opt}</span>`; 
                div.onclick = (ev) => { 
                    ev.stopPropagation(); 
                    if(isChk) current = current.filter(x => x !== opt); else current.push(opt); 
                    updatePlanCell(planRowIndex, origColIndex, current.join(", ")); 
                    openDropdownMenu(e, planRowIndex, origColIndex, current, opts); 
                    processAndRender(); 
                }; box.appendChild(div); 
            }); 
            showPopupSafe(document.getElementById("dropdownPopup"), e); 
        }

        function initResize(e, type, targetEl, currentDim) {
            e.stopPropagation(); e.preventDefault(); isResizing = true; let tableEl = targetEl.closest('table');
            resizeData = { type: type, targetEl: targetEl, startDim: currentDim, startMouse: type === 'col' ? e.clientX : e.clientY, startTableW: tableEl ? tableEl.offsetWidth : 0 };
            document.body.style.cursor = type === 'col' ? 'col-resize' : 'row-resize';
        }

        function handleMouseMove(e) {
            if (!isResizing) return;
            let delta = (resizeData.type === 'col' ? e.clientX : e.clientY) - resizeData.startMouse;
            let newDim = Math.max(30, resizeData.startDim + delta); 
            if (resizeData.type === 'col') {
                resizeData.targetEl.style.width = newDim + "px"; let tbl = resizeData.targetEl.closest('table');
                if (tbl) { let diff = newDim - resizeData.startDim; let newTableW = resizeData.startTableW + diff; tbl.style.width = newTableW + "px"; tbl.style.minWidth = newTableW + "px"; }
            } else resizeData.targetEl.style.height = newDim + "px";
        }

        function handleMouseUp() { if (!isResizing) return; isResizing = false; document.body.style.cursor = 'default'; }
        function toggleMegaRow(btn) { btn.parentElement.classList.toggle('collapsed'); }

        // ==========================================
        // RENDER CHÍNH
        // ==========================================
        function processAndRender() {
            let area = document.getElementById("planArea"); let tabsWrapper = document.getElementById("bottomTabs");
            let oldScrollY = document.getElementById("scrollArea").scrollTop;
            area.innerHTML = ""; tabsWrapper.innerHTML = "";

            let planSheet = sysData.sheets["_PLAN_DATA_"];
            if (!planSheet || planSheet.length <= 1) { area.innerHTML = `<div class="empty-msg"><i class="fas fa-folder-open" style="font-size:30px; color:var(--gray-border); margin-bottom:10px;"></i><br>Chưa có kế hoạch nào được lên lịch.</div>`; return; }

            let uniqueTabs = new Set(); for (let i = 1; i < planSheet.length; i++) if(planSheet[i][0]) uniqueTabs.add(planSheet[i][0]);
            let availableTabs = Array.from(uniqueTabs); if (availableTabs.length === 0) { area.innerHTML = `<div class="empty-msg">Chưa có dữ liệu kế hoạch hợp lệ.</div>`; return; }
            if (!activeBottomTab || !availableTabs.includes(activeBottomTab)) activeBottomTab = availableTabs[0];

            availableTabs.forEach(tab => {
                let div = document.createElement("div"); div.className = "tab-item" + (tab === activeBottomTab ? " active" : "");
                div.innerHTML = `<i class="fas fa-table" style="margin-right: 5px; opacity: 0.7;"></i> ${tab}`;
                div.onclick = () => { activeBottomTab = tab; processAndRender(); }; tabsWrapper.appendChild(div);
            });

            let tabAttrs = sysData.attributes[activeBottomTab] || {};
            let originalColWidths = tabAttrs.colWidths || {};
            let types = tabAttrs.columnTypes || {};
            let frzCol = tabAttrs.frozenCols || 0; 

            let groupedData = {};
            for (let i = 1; i < planSheet.length; i++) {
                let tabName = planSheet[i][0]; let dateStr = planSheet[i][1]; let rowDataJson = planSheet[i][2];
                if (tabName !== activeBottomTab || !dateStr || !rowDataJson) continue; 
                let dateObj = new Date(dateStr); let monthKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
                let monthLabel = `Tháng ${dateObj.getMonth() + 1} / ${dateObj.getFullYear()}`;
                if (!groupedData[monthKey]) groupedData[monthKey] = { label: monthLabel, rows: [] };
                let parsedRow = []; try { parsedRow = JSON.parse(rowDataJson); } catch(e){}
                groupedData[monthKey].rows.push({ date: dateStr, data: parsedRow, planRowIndex: i });
            }

            let sortedMonths = Object.keys(groupedData).sort(); let hasVisibleData = false;
            let headers = []; if (sysData.sheets[activeBottomTab] && sysData.sheets[activeBottomTab].length > 0) headers = sysData.sheets[activeBottomTab][0];

            sortedMonths.forEach(mKey => {
                if (activeFilters.length > 0 && !activeFilters.includes(mKey)) return;
                hasVisibleData = true; let monthInfo = groupedData[mKey];

                let groupDiv = document.createElement("div"); groupDiv.className = "month-group";
                let btn = document.createElement("button"); btn.className = "mega-row-btn"; 
                btn.innerHTML = `<div class="mega-row-content"><i class="fas fa-calendar-check"></i> Kế hoạch: ${monthInfo.label}</div><i class="fas fa-chevron-down"></i>`;
                btn.onclick = function() { toggleMegaRow(this); }; groupDiv.appendChild(btn);

                let tableContainer = document.createElement("div"); tableContainer.className = "table-container";
                let table = document.createElement("table");
                
                if (headers.length === 0 && monthInfo.rows.length > 0) { for(let c=0; c<monthInfo.rows[0].data.length; c++) headers.push("Cột " + (c+1)); }
                
                let stickyLefts = [0, 40]; 
                let currentLeft = 160; 
                
                let totalTableWidth = 160; 
                headers.forEach((h, idx) => { 
                    stickyLefts.push(currentLeft); 
                    let w = originalColWidths[idx] ? parseInt(originalColWidths[idx]) : 150;
                    currentLeft += w;
                    totalTableWidth += w; 
                });
                
                table.style.width = totalTableWidth + "px"; table.style.minWidth = totalTableWidth + "px";
                
                let thead = document.createElement("thead"); let trH = document.createElement("tr");
                
                let thIndex = document.createElement("th"); thIndex.className = "col-index"; thIndex.style.width = "40px"; thIndex.innerText = "#"; 
                thIndex.style.position = 'sticky'; thIndex.style.left = '0px'; thIndex.style.zIndex = '35'; trH.appendChild(thIndex);
                
                let thDate = document.createElement("th"); thDate.style.width = "120px"; thDate.style.color = "var(--red)"; 
                thDate.innerHTML = `Deadline <div class="resizer-col" onmousedown="initResize(event, 'col', this.parentElement, this.parentElement.offsetWidth)"></div>`; 
                thDate.style.position = 'sticky'; thDate.style.left = '40px'; thDate.style.zIndex = '35'; trH.appendChild(thDate);

                headers.forEach((h, idx) => {
                    let th = document.createElement("th");
                    
                    let s0 = (tabAttrs.cellStyles && tabAttrs.cellStyles[`0_${idx}`]) || {};
                    let rs0 = (tabAttrs.rowStyles && tabAttrs.rowStyles[0]) || {};
                    let cs = (tabAttrs.colStyles && tabAttrs.colStyles[idx]) || {};
                    
                    th.style.backgroundColor = s0.bg || rs0.bg || cs.bg || "var(--gray-light)";
                    th.style.color = s0.color || rs0.color || cs.color || "var(--text-main)";
                    th.style.fontWeight = (s0.bold || rs0.bold || cs.bold) ? "bold" : "bold";
                    th.style.fontStyle = (s0.italic || rs0.italic || cs.italic) ? "italic" : "normal";
                    th.style.textDecoration = (s0.underline || rs0.underline || cs.underline) ? "underline" : "none";
                    th.style.textAlign = s0.align || rs0.align || cs.align || "left";

                    th.style.width = (originalColWidths[idx] ? parseInt(originalColWidths[idx]) : 150) + "px";
                    th.innerHTML = `${h}<div class="resizer-col" onmousedown="initResize(event, 'col', this.parentElement, this.parentElement.offsetWidth)"></div>`;
                    
                    if(idx < frzCol) {
                        th.style.position = 'sticky';
                        th.style.left = stickyLefts[idx + 2] + 'px'; 
                        th.style.zIndex = '35';
                        if(idx === frzCol - 1) th.style.borderRight = "2px solid var(--blue)";
                    }
                    
                    trH.appendChild(th);
                });
                thead.appendChild(trH); table.appendChild(thead);

                let tbody = document.createElement("tbody");
                
                monthInfo.rows.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach((rowItem, rIdx) => {
                    let tr = document.createElement("tr");
                    tr.dataset.planIndex = rowItem.planRowIndex;
                    
                    // Gắn sự kiện CHUỘT TRÁI (Chọn dòng / Shift Click)
                    tr.onclick = (e) => handleRowClick(e, tr, rowItem, headers);
                    
                    // Gắn sự kiện CHUỘT PHẢI (Context Menu)
                    tr.oncontextmenu = (e) => {
                        e.preventDefault();
                        if (!tr.classList.contains('row-selected')) {
                            handleRowClick({ shiftKey: false }, tr, rowItem, headers); // Ép chọn dòng này nếu chưa chọn
                        }
                        showContextMenu(e);
                    };
                    
                    let dObj = new Date(rowItem.date); let dStrVN = `${String(dObj.getDate()).padStart(2,'0')}/${String(dObj.getMonth()+1).padStart(2,'0')}/${dObj.getFullYear()}`;
                    
                    let tdNum = document.createElement("td"); tdNum.className = "row-index"; 
                    tdNum.innerHTML = `${rIdx + 1}<div class="resizer-row" onmousedown="initResize(event, 'row', this.parentElement.parentElement, this.parentElement.parentElement.offsetHeight)"></div>`;
                    tdNum.style.position = 'sticky'; tdNum.style.left = '0px'; tdNum.style.zIndex = '20'; tr.appendChild(tdNum);

                    let tdDate = document.createElement("td");
                    tdDate.innerHTML = `<div class="cell-view" style="font-weight:bold; color:var(--blue); text-align:center;">${dStrVN}</div>`;
                    tdDate.style.position = 'sticky'; tdDate.style.left = '40px'; tdDate.style.zIndex = '20'; tdDate.style.backgroundColor = "var(--white)"; tr.appendChild(tdDate);
                    
                    rowItem.data.forEach((val, c) => {
                        let td = document.createElement("td");
                        
                        let cs = (tabAttrs.colStyles && tabAttrs.colStyles[c]) || {};
                        let finalBg = cs.bg || "#ffffff";
                        td.style.backgroundColor = finalBg;
                        td.style.color = cs.color || "var(--text-main)";
                        td.style.fontWeight = cs.bold ? "bold" : "normal";
                        td.style.fontStyle = cs.italic ? "italic" : "normal";
                        td.style.textDecoration = cs.underline ? "underline" : "none";
                        td.style.textAlign = cs.align || "left";

                        if(c < frzCol) {
                            td.style.position = 'sticky';
                            td.style.left = stickyLefts[c + 2] + 'px';
                            td.style.zIndex = '20';
                            if(c === frzCol - 1) td.style.borderRight = "2px solid var(--blue)";
                            if(finalBg === "transparent" || finalBg === "rgba(0, 0, 0, 0)") td.style.backgroundColor = "#ffffff";
                        }

                        let type = types[c] || "text";
                        if (type === "dropdown") {
                            let opts = (tabAttrs.dropdownChoices && tabAttrs.dropdownChoices[c]) ? tabAttrs.dropdownChoices[c] : ["Mục 1"]; 
                            let arr = val ? String(val).split(",").map(s=>s.trim()).filter(Boolean) : []; 
                            let ui = document.createElement("div"); ui.className = "dropdown-ui"; 
                            ui.innerHTML = `<div class="dropdown-text">${arr.length ? arr.join(", ") : "<span style='opacity:0.6; font-style:italic;'>Trống...</span>"}</div> <i style="opacity:0.5;" class="fas fa-caret-down"></i>`; 
                            ui.onclick = (e) => { e.stopPropagation(); openDropdownMenu(e, rowItem.planRowIndex, c, arr, opts); }; 
                            td.appendChild(ui);
                        } 
                        else if (type === "checkbox") {
                            let chk = document.createElement("input"); chk.type = "checkbox"; chk.checked = (val === "true" || val === true); 
                            chk.style.margin = "0 8px"; chk.style.cursor = "pointer"; 
                            chk.onchange = () => updatePlanCell(rowItem.planRowIndex, c, chk.checked); td.appendChild(chk);
                        } 
                        else if (type === "link") {
                            let str = String(val); 
                            if (str.startsWith("http")) td.innerHTML = `<a href="${str}" target="_blank" style="color:var(--blue); font-weight:bold; margin:0 4px; text-decoration:none;">Link</a>`; 
                            else td.appendChild(createEditor(rowItem.planRowIndex, c, val));
                        } 
                        else td.appendChild(createEditor(rowItem.planRowIndex, c, val));

                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });

                table.appendChild(tbody); tableContainer.appendChild(table); groupDiv.appendChild(tableContainer); area.appendChild(groupDiv);
            });

            if (!hasVisibleData) area.innerHTML = `<div class="empty-msg">Không có dữ liệu kế hoạch phù hợp với bộ lọc.</div>`;
            document.getElementById("scrollArea").scrollTop = oldScrollY;
            
            // Khôi phục lại hiệu ứng bôi đen nếu mảng selectedPlanIndexes vẫn còn
            if(selectedPlanIndexes.length > 0) {
                document.querySelectorAll('tr[data-plan-index]').forEach(tr => {
                    if (selectedPlanIndexes.includes(parseInt(tr.dataset.planIndex))) {
                        tr.classList.add('row-selected');
                    }
                });
            }
        }

        // ==========================================
        // LỌC THÁNG
        // ==========================================
        function openFilterPopup(e) {
            e.stopPropagation();
            let popup = document.getElementById("filterPopup"); let list = document.getElementById("filterList"); list.innerHTML = "";
            let planSheet = sysData.sheets["_PLAN_DATA_"]; if(!planSheet) return;

            let uniqueMonths = new Set();
            for (let i = 1; i < planSheet.length; i++) {
                if(planSheet[i][0] === activeBottomTab && planSheet[i][1]) {
                    let d = new Date(planSheet[i][1]); uniqueMonths.add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
                }
            }

            Array.from(uniqueMonths).sort().forEach(mKey => {
                let parts = mKey.split("-"); let label = `Tháng ${parts[1]}/${parts[0]}`;
                let isChecked = activeFilters.includes(mKey) ? "checked" : "";
                let div = document.createElement("div"); div.className = "menu-item";
                div.innerHTML = `<input type="checkbox" value="${mKey}" class="month-cb" style="pointer-events:none;" ${isChecked}> <span>${label}</span>`;
                div.onclick = function(ev) { ev.stopPropagation(); let cb = this.querySelector('input'); cb.checked = !cb.checked; };
                list.appendChild(div);
            });

            let rect = e.target.getBoundingClientRect(); popup.style.top = (rect.bottom + 5) + "px"; popup.style.left = rect.left + "px"; popup.style.display = "block";
        }

        function applyFilter() { activeFilters = []; document.querySelectorAll(".month-cb").forEach(cb => { if (cb.checked) activeFilters.push(cb.value); }); document.getElementById("filterPopup").style.display = "none"; processAndRender(); }
        function clearFilter() { activeFilters = []; document.getElementById("filterPopup").style.display = "none"; processAndRender(); }
        
    </script>
</body>
</html>
