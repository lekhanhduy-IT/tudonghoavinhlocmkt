<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viết Bài Blog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --white: #ffffff; --blue: #01adee; --red: #db1010; --gray-light: #f9f9f9; --gray-border: #e0e0e0; --text-main: #333333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--gray-light); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Toolbar Header */
        .toolbar { height: 45px; background: var(--white); border-bottom: 0.5px solid var(--gray-border); display: flex; align-items: center; padding: 0 15px; justify-content: space-between; z-index: 100; flex-shrink: 0; }
        .tool-btn { background: var(--white); border: 0.5px solid var(--gray-border); color: var(--blue); padding: 5px 12px; cursor: pointer; font-size: 12px; font-weight: bold; border-radius: 3px; display: inline-flex; align-items: center; gap: 5px; transition: 0.2s; outline: none; }
        .tool-btn:hover { background: var(--blue); color: var(--white); border-color: var(--blue); }
        .save-btn { background: var(--blue); color: var(--white); border-color: var(--blue); }
        .save-btn:hover { background: #0199d3; }

        /* Workspace */
        .workspace { flex: 1; position: relative; overflow-y: auto; overflow-x: hidden; display: flex; justify-content: center; padding: 40px 0 100px 0; }
        .editor-container { width: 100%; max-width: 800px; background: var(--white); border: 0.5px solid var(--gray-border); box-shadow: 0 5px 20px rgba(0,0,0,0.05); position: relative; display: flex; flex-direction: column; margin-top: 20px;}
        
        /* Thước đo căn lề */
        .ruler-h { position: absolute; top: -20px; left: 0; right: 0; height: 20px; background: repeating-linear-gradient(90deg, #ccc 0, #ccc 1px, transparent 1px, transparent 10px), var(--white); border: 0.5px solid var(--gray-border); display: block; border-bottom: none; z-index: 10;}
        .ruler-v { position: absolute; top: 0; left: -20px; bottom: 0; width: 20px; background: repeating-linear-gradient(180deg, #ccc 0, #ccc 1px, transparent 1px, transparent 10px), var(--white); border: 0.5px solid var(--gray-border); display: block; border-right: none; }
        .ruler-marker { position: absolute; top: 0; width: 10px; height: 100%; cursor: ew-resize; z-index: 20; display: flex; justify-content: center;}
        .ruler-marker::before { content: ''; width: 2px; height: 100%; background: var(--blue); }
        .ruler-marker::after { content: ''; position: absolute; top: 100%; border-width: 5px 4px 0 4px; border-style: solid; border-color: var(--blue) transparent transparent transparent; }
        #markerLeft { left: 0px; transform: translateX(-5px); } 
        #markerRight { right: 0px; transform: translateX(5px); }

        /* Rich Text Inputs */
        .rich-input { padding: 15px 20px; outline: none; border-bottom: 0.5px dashed var(--gray-border); width: 100%; line-height: 1.6; position: relative; }
        .rich-input:empty:before { content: attr(data-placeholder); color: #aaa; pointer-events: none; display: block; }
        
        #postTitle { font-size: 26px; font-weight: bold; color: var(--blue); }
        #postSapo { font-size: 16px; font-style: italic; color: #555; background: #fdfdfd; }
        #postContent { font-size: 15px; flex: 1; min-height: 500px; border-bottom: none; padding-bottom: 80px; }
        
        .cover-area { padding: 10px 20px; border-bottom: 0.5px dashed var(--gray-border); background: var(--white); }
        .cover-input { width: 100%; padding: 6px 10px; border: 0.5px solid var(--gray-border); outline: none; font-size: 12px; border-radius: 2px; margin-bottom: 5px; color: var(--blue); }
        .cover-preview { width: 100%; max-height: 400px; object-fit: contain; display: none; border: 0.5px solid var(--gray-border); margin-top: 5px; }

        /* Custom HTML Blocks (Viền xanh, X đỏ) */
        .custom-html-block { position: relative; border: 0.5px solid transparent; padding: 10px 5px; margin: 10px 0; transition: 0.2s; }
        .custom-html-block:hover, .custom-html-block.active { border: 0.5px solid var(--blue); }
        .block-del-btn { position: absolute; left: 50%; transform: translateX(-50%); width: 18px; height: 18px; background: var(--red); color: var(--white); border-radius: 50%; display: none; justify-content: center; align-items: center; font-size: 10px; cursor: pointer; z-index: 10; border: none;}
        .custom-html-block:hover .block-del-btn { display: flex; }
        .del-top { top: -9px; } .del-bot { bottom: -9px; }

        /* Floating Panels (Cố định & Cuộn) */
        .floating-panel { position: absolute; width: 280px; background: var(--white); border: 0.5px solid var(--gray-border); box-shadow: 0 5px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; max-height: 85vh; z-index: 50; }
        .panel-header { padding: 8px 12px; background: var(--gray-light); border-bottom: 0.5px solid var(--gray-border); font-weight: bold; font-size: 12px; cursor: move; user-select: none; display: flex; justify-content: space-between; align-items: center; color: var(--blue); }
        .panel-content { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; }

        .data-row { margin-bottom: 8px; border: 0.5px solid var(--gray-border); overflow: hidden; }
        .data-label { background: var(--gray-light); padding: 4px 8px; font-weight: bold; border-bottom: 0.5px solid var(--gray-border); font-size: 11px; color: var(--text-main); }
        .data-val { padding: 6px 8px; background: var(--white); word-wrap: break-word; font-size: 12px; }

        .panel-tabs { display: flex; border-bottom: 0.5px solid var(--gray-border); }
        .ptab-btn { flex: 1; text-align: center; padding: 8px; cursor: pointer; font-size: 11px; font-weight: bold; color: #777; transition: 0.2s; border-bottom: 1px solid transparent; }
        .ptab-btn.active { color: var(--blue); border-bottom: 1px solid var(--blue); background: var(--white); }
        .ptab-content { display: none; }
        .ptab-content.active { display: block; }

        /* Tools Định dạng */
        .tool-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 12px; }
        .fmt-btn { background: var(--white); border: 0.5px solid var(--gray-border); padding: 5px 0; text-align: center; cursor: pointer; color: var(--text-main); font-size: 13px; transition: 0.2s; }
        .fmt-btn:hover { background: var(--gray-light); color: var(--blue); border-color: var(--blue); }
        
        .tool-row { display: flex; gap: 5px; margin-bottom: 8px; align-items: center; }
        /* Fix lỗi ô nhập bị teo nhỏ */
        .tool-input { flex: 1; min-width: 0; width: 100%; border: 0.5px solid var(--gray-border); padding: 5px 8px; font-size: 12px; outline: none; color: var(--text-main); }
        .tool-input:focus { border-color: var(--blue); }
        .tool-label { font-size: 11px; color: #777; min-width: 60px; }

        /* Templates (Mẫu HTML) */
        .mega-row-cat { background: var(--blue); color: var(--white); padding: 6px 10px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; margin-top: 10px; border: 0.5px solid var(--blue); }
        .cat-content { border: 0.5px solid var(--gray-border); border-top: none; padding: 5px; display: none; }
        .cat-content.open { display: block; }
        .template-item { padding: 6px; font-size: 11px; cursor: pointer; border-bottom: 0.5px solid var(--gray-border); display: flex; justify-content: space-between; align-items: center; transition: 0.2s;}
        .template-item:hover { background: #f1f3f4; color: var(--blue); border-color: var(--blue); }
        .template-item:last-child { border-bottom: none; }

        /* Modals (Cảnh báo, Mã HTML) */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 9999; display: none; justify-content: center; align-items: center; }
        .modal-box { background: var(--white); border: 0.5px solid var(--gray-border); box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; border-radius: 4px; overflow: hidden; }
        .modal-header { padding: 10px 15px; background: var(--gray-light); border-bottom: 0.5px solid var(--gray-border); font-weight: bold; display: flex; justify-content: space-between; font-size: 13px; color: var(--blue); }
        
        .code-container { display: flex; height: 350px; border-bottom: 0.5px solid var(--gray-border); background: #1e1e1e; }
        .line-numbers { width: 35px; background: #252526; color: #858585; text-align: right; padding: 10px 5px; font-family: monospace; font-size: 13px; overflow: hidden; border-right: 0.5px solid #444; line-height: 1.5; }
        .html-textarea { flex: 1; background: transparent; color: #d4d4d4; border: none; outline: none; padding: 10px; font-family: monospace; font-size: 13px; resize: none; line-height: 1.5; white-space: pre; overflow: auto; }

        /* Alert/Prompt Custom */
        .custom-alert { width: 350px; text-align: center; padding: 20px; }
        .alert-title { font-size: 16px; margin-bottom: 10px; color: var(--blue); font-weight: bold;}
        .alert-msg { font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
        .custom-prompt-input { width: 100%; border: 0.5px solid var(--gray-border); padding: 8px; outline: none; margin-bottom: 15px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div>
            <span style="font-weight: bold; color: var(--blue); font-size: 14px;"><i class="fas fa-edit"></i> Trình Soạn Thảo Blog</span>
        </div>
        <div style="display: flex; align-items: center;">
            <span id="syncStatus" style="font-size: 11px; font-weight: bold; margin-right: 15px; color: #27ae60;">✅ Hệ thống kết nối</span>
            <button class="tool-btn save-btn" onclick="savePostToSheet()"><i class="fas fa-save"></i> Lưu bài viết</button>
        </div>
    </div>

    <div class="workspace" id="workspaceArea">
        
        <div class="floating-panel" id="panelLeft" style="left: 20px; top: 60px;">
            <div class="panel-header" onmousedown="dragElement(event, 'panelLeft')">
                <span><i class="fas fa-database"></i> Dữ Liệu Nguồn</span>
                <i class="fas fa-arrows-alt"></i>
            </div>
            <div class="panel-content" id="sourceDataContainer">
                <div style="color: #999; text-align: center; margin-top: 20px; font-style: italic;">Chưa có dữ liệu từ Kế Hoạch.</div>
            </div>
        </div>

        <div class="floating-panel" id="panelRight" style="right: 20px; top: 60px;">
            <div class="panel-header" onmousedown="dragElement(event, 'panelRight')">
                <span><i class="fas fa-toolbox"></i> Bộ Công Cụ</span>
                <i class="fas fa-arrows-alt"></i>
            </div>
            <div class="panel-tabs">
                <div class="ptab-btn active" onclick="switchRightTab('tabFormat', this)">Định Dạng</div>
                <div class="ptab-btn" onclick="switchRightTab('tabBlocks', this)">Khối & Mẫu</div>
            </div>
            <div class="panel-content">
                
                <div id="tabFormat" class="ptab-content active">
                    <select class="tool-input" style="margin-bottom: 12px; font-weight: bold;" onchange="formatDoc('formatBlock', this.value); this.selectedIndex=0;">
                        <option value="">-- Chọn Tiêu Đề (Heading) --</option>
                        <option value="H1">Heading 1</option>
                        <option value="H2">Heading 2</option>
                        <option value="H3">Heading 3</option>
                        <option value="H4">Heading 4</option>
                        <option value="P">Đoạn văn bình thường (P)</option>
                    </select>

                    <div class="tool-grid">
                        <button class="fmt-btn" onclick="formatDoc('bold')" title="In đậm (Ctrl+B)"><b>B</b></button>
                        <button class="fmt-btn" onclick="formatDoc('italic')" title="In nghiêng (Ctrl+I)"><i>I</i></button>
                        <button class="fmt-btn" onclick="formatDoc('underline')" title="Gạch chân (Ctrl+U)"><u>U</u></button>
                        <button class="fmt-btn" onclick="formatDoc('strikeThrough')" title="Gạch ngang"><strike>S</strike></button>
                        
                        <button class="fmt-btn" onclick="formatDoc('justifyLeft')" title="Căn trái"><i class="fas fa-align-left"></i></button>
                        <button class="fmt-btn" onclick="formatDoc('justifyCenter')" title="Căn giữa"><i class="fas fa-align-center"></i></button>
                        <button class="fmt-btn" onclick="formatDoc('justifyRight')" title="Căn phải"><i class="fas fa-align-right"></i></button>
                        <button class="fmt-btn" onclick="formatDoc('justifyFull')" title="Căn đều"><i class="fas fa-align-justify"></i></button>

                        <button class="fmt-btn" onclick="formatDoc('insertUnorderedList')" title="Bullet list"><i class="fas fa-list-ul"></i></button>
                        <button class="fmt-btn" onclick="formatDoc('insertOrderedList')" title="Number list"><i class="fas fa-list-ol"></i></button>
                        <button class="fmt-btn" onclick="insertLink()" title="Chèn Link URL"><i class="fas fa-link"></i></button>
                        <button class="fmt-btn" onclick="insertComment()" title="Chèn Ghi chú (Highlight)"><i class="fas fa-comment"></i></button>
                    </div>

                    <div class="tool-row">
                        <span class="tool-label">Cỡ chữ:</span>
                        <input type="number" id="inpFontSize" class="tool-input" placeholder="VD: 16" onchange="applyCustomStyle('font-size', this.value + 'px')">
                    </div>
                    <div class="tool-row">
                        <span class="tool-label">Dãn dòng:</span>
                        <input type="number" id="inpLineHeight" class="tool-input" placeholder="VD: 24" onchange="applyCustomStyle('line-height', this.value + 'px')">
                    </div>
                    <div class="tool-row">
                        <span class="tool-label">Màu chữ:</span>
                        <input type="color" class="tool-input" style="padding: 0; height: 24px;" onchange="formatDoc('foreColor', this.value)">
                    </div>
                    <div class="tool-row">
                        <span class="tool-label">Màu nền:</span>
                        <input type="color" class="tool-input" style="padding: 0; height: 24px;" onchange="formatDoc('hiliteColor', this.value)">
                    </div>

                    <hr style="border-bottom: 0.5px dashed var(--gray-border); margin: 15px 0;">
                    
                    <div style="font-weight: bold; margin-bottom: 8px; color: var(--blue); font-size: 12px;"><i class="fab fa-google"></i> Google Fonts:</div>
                    <div class="tool-row">
                        <input type="text" id="fontLink" class="tool-input" placeholder="Dán thẻ <link> Google Font...">
                        <button class="tool-btn" style="margin: 0; padding: 4px 8px;" onclick="addGoogleFont()"><i class="fas fa-plus"></i></button>
                    </div>
                    <select id="fontSelect" class="tool-input" style="margin-top: 5px;" onchange="applyCustomStyle('font-family', this.value)">
                        <option value="Segoe UI, sans-serif">Mặc định (Segoe UI)</option>
                    </select>

                    <button class="tool-btn" style="width: 100%; justify-content: center; margin-top: 15px;" onclick="toggleRulers()">
                        <i class="fas fa-ruler-combined"></i> Bật / Tắt Thước Đo
                    </button>
                </div>

                <div id="tabBlocks" class="ptab-content">
                    <button class="tool-btn" style="width: 100%; justify-content: center; background: var(--blue); color: var(--white); margin-bottom: 15px;" onclick="openHtmlModal('')">
                        <i class="fas fa-code"></i> Viết Mã HTML
                    </button>
                    
                    <hr style="border-bottom: 0.5px dashed var(--gray-border); margin: 15px 0;">
                    <div style="font-weight: bold; margin-bottom: 8px; color: var(--red); font-size: 12px;"><i class="fas fa-box"></i> Lưu Mẫu HTML Mới:</div>
                    
                    <div style="border: 0.5px solid var(--gray-border); padding: 8px; background: #fdfdfd; margin-bottom: 15px;">
                        <select id="catSelect" class="tool-input" style="margin-bottom: 5px;" onchange="checkNewCategory(this)">
                            <option value="">-- Chọn Loại Khối --</option>
                            <option value="NEW" style="color: var(--blue); font-weight: bold;">+ Thêm Loại Mới...</option>
                        </select>
                        <input type="text" id="tplNameInput" class="tool-input" style="margin-bottom: 5px;" placeholder="Tên mẫu...">
                        <textarea id="tplHtmlInput" class="tool-input" style="height: 60px; resize: none; margin-bottom: 5px; font-family: monospace;" placeholder="Dán mã HTML mẫu vào đây..."></textarea>
                        
                        <div style="font-size:11px; margin-bottom:5px; color:#555;">Xem trước (Preview):</div>
                        <div id="tplPreview" style="border:0.5px dashed var(--gray-border); padding:5px; margin-bottom:5px; min-height:20px; font-size:12px; background:#fff; overflow:hidden;"></div>

                        <button class="tool-btn" style="width: 100%; justify-content: center;" onclick="saveTemplate()"><i class="fas fa-save"></i> Lưu Mẫu</button>
                    </div>

                    <div style="font-weight: bold; margin-bottom: 8px; color: var(--blue); font-size: 12px;">Kho Mẫu (Click để chèn):</div>
                    <div id="templatesList"></div>
                </div>

            </div>
        </div>

        <div class="editor-container">
            <div class="ruler-h" id="rulerH">
                <div class="ruler-marker" id="markerLeft" onmousedown="startDragRuler(event, 'left')"></div>
                <div class="ruler-marker" id="markerRight" onmousedown="startDragRuler(event, 'right')"></div>
            </div>
            <div class="ruler-v" id="rulerV"></div>

            <div class="rich-input" contenteditable="true" id="postTitle" data-placeholder="Nhập Tiêu đề bài viết tại đây..."></div>
            <div class="rich-input" contenteditable="true" id="postSapo" data-placeholder="Nhập Sapo (Đoạn tóm tắt) tại đây..."></div>
            
            <div class="cover-area">
                <input type="text" id="coverUrlInput" class="cover-input" placeholder="Dán URL ảnh bìa (Thumbnail) vào đây..." oninput="updateCoverPreview()">
                <img id="coverPreview" class="cover-preview">
            </div>

            <div class="rich-input" contenteditable="true" id="postContent" data-placeholder="Soạn thảo nội dung chi tiết bài viết..."></div>
        </div>

    </div>

    <div class="modal-overlay" id="htmlModal">
        <div class="modal-box" style="width: 700px;">
            <div class="modal-header">
                <span><i class="fas fa-code"></i> Mã HTML của Khối</span>
                <i class="fas fa-times" style="cursor: pointer; color: var(--red);" onclick="closeHtmlModal()"></i>
            </div>
            <div class="code-container">
                <div class="line-numbers" id="lineNumbers">1</div>
                <textarea id="htmlEditorTextarea" class="html-textarea" wrap="off" oninput="syncCodeToEditor(); updateLineNumbers()" onscroll="syncScroll()"></textarea>
            </div>
            <div style="padding: 10px 15px; text-align: right; background: var(--gray-light); border-top: 0.5px solid var(--gray-border);">
                <button class="tool-btn save-btn" onclick="insertHtmlBlock()"><i class="fas fa-check"></i> Áp dụng & Đóng</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="customAlert">
        <div class="modal-box custom-alert">
            <div class="alert-title" id="alertTitle">Thông báo</div>
            <div class="alert-msg" id="alertMsg">Nội dung</div>
            <button class="tool-btn btn-blue" onclick="document.getElementById('customAlert').style.display='none'">Đã hiểu</button>
        </div>
    </div>

    <div class="modal-overlay" id="customPrompt">
        <div class="modal-box custom-alert">
            <div class="alert-title" id="promptTitle">Nhập dữ liệu</div>
            <input type="text" id="promptInput" class="custom-prompt-input">
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="tool-btn btn-blue" id="promptOkBtn">Xác nhận</button>
                <button class="tool-btn" style="background:var(--white); color:var(--text-main);" onclick="document.getElementById('customPrompt').style.display='none'">Hủy</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbytCrAHTpFnykzOAwTkxbAR6tm32P9RZrS42EnUFh2WTWTQRtZr60Q27Lzrbhq_cuo/exec";
        let sysData = {};
        let draftData = null;
        
        let savedSelectionRange = null; 
        let activeHtmlBlock = null;     
        let promptCallback = null;

        window.onload = async () => {
            await fetchAllData();
            loadDraftData();
            loadGoogleFonts();
            loadTemplates();
            
            // Render Live Preview cho ô nhập template
            document.getElementById('tplHtmlInput').addEventListener('input', function() {
                document.getElementById('tplPreview').innerHTML = this.value;
            });

            // LƯU LẠI VÙNG BÔI ĐEN LIÊN TỤC ĐỂ CHỐNG LỖI MẤT FOCUS KHI CLICK INPUT
            document.addEventListener('selectionchange', () => {
                let sel = window.getSelection();
                if (sel.rangeCount > 0) {
                    let r = sel.getRangeAt(0);
                    let content = document.getElementById('postContent');
                    let title = document.getElementById('postTitle');
                    let sapo = document.getElementById('postSapo');
                    
                    if(content.contains(r.commonAncestorContainer) || title.contains(r.commonAncestorContainer) || sapo.contains(r.commonAncestorContainer)) {
                        savedSelectionRange = r;
                    }
                }
            });

            // Lắng nghe sự kiện đồng bộ 2 chiều từ ngoài vào trong popup mã HTML
            document.getElementById('postContent').addEventListener('input', function(e) {
                if(activeHtmlBlock && activeHtmlBlock.contains(e.target)) {
                    document.getElementById('htmlEditorTextarea').value = activeHtmlBlock.querySelector('.block-content').innerHTML;
                    updateLineNumbers();
                }
            });
        };

        // ==========================================
        // UI MODALS MỚI
        // ==========================================
        function showAlert(msg, isError = false) {
            document.getElementById('alertMsg').innerHTML = msg;
            document.getElementById('alertTitle').style.color = isError ? "var(--red)" : "var(--blue)";
            document.getElementById('customAlert').style.display = 'flex';
        }

        function showPrompt(title, defaultVal, callback) {
            document.getElementById('promptTitle').innerText = title;
            document.getElementById('promptInput').value = defaultVal || "";
            promptCallback = callback;
            document.getElementById('customPrompt').style.display = 'flex';
            document.getElementById('promptInput').focus();
            
            document.getElementById('promptOkBtn').onclick = () => {
                document.getElementById('customPrompt').style.display='none';
                if(promptCallback) promptCallback(document.getElementById('promptInput').value);
            };
        }

        // ==========================================
        // FETCH DATA TỪ HỆ THỐNG
        // ==========================================
        async function fetchAllData() {
            try {
                let res = await fetch(API_URL + "?t=" + new Date().getTime(), { method: "GET" });
                let json = await res.json();
                if(json.success) {
                    sysData = json.data;
                    localStorage.setItem("MKT_DATA", JSON.stringify(sysData));
                }
            } catch(e) { console.log("Offline mode"); }
        }

        function loadDraftData() {
            let draftStr = localStorage.getItem("DRAFT_POST_DATA");
            if (!draftStr) return;
            
            draftData = JSON.parse(draftStr);
            let container = document.getElementById("sourceDataContainer");
            container.innerHTML = "";

            draftData.headers.forEach((h, i) => {
                let val = draftData.data[i] || "";
                if(typeof val === 'string') val = val.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                container.innerHTML += `
                    <div class="data-row">
                        <div class="data-label">${h}</div>
                        <div class="data-val">${val || "<i style='color:#ccc'>Trống</i>"}</div>
                    </div>
                `;
            });
        }

        // ==========================================
        // KÉO THẢ PANEL (FIXED)
        // ==========================================
        function dragElement(e, panelId) {
            e.preventDefault();
            let panel = document.getElementById(panelId);
            let pos1 = 0, pos2 = 0, pos3 = e.clientX, pos4 = e.clientY;
            
            // Chuyển sang Fixed để không trôi khi cuộn
            let rect = panel.getBoundingClientRect();
            panel.style.position = 'fixed';
            panel.style.top = rect.top + 'px';
            panel.style.left = rect.left + 'px';
            panel.style.right = 'auto'; 

            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;

            function elementDrag(ev) {
                ev.preventDefault();
                pos1 = pos3 - ev.clientX; pos2 = pos4 - ev.clientY;
                pos3 = ev.clientX; pos4 = ev.clientY;
                
                let newTop = panel.offsetTop - pos2;
                let newLeft = panel.offsetLeft - pos1;
                if(newTop < 45) newTop = 45; 
                
                panel.style.top = newTop + "px";
                panel.style.left = newLeft + "px";
            }

            function closeDragElement() {
                document.onmouseup = null; document.onmousemove = null;
                // Nhả ra ở vị trí cũ (Gần header) thì trả về Absolute để cuộn theo trang
                if (panel.offsetTop < 100 && (panel.offsetLeft < 50 || window.innerWidth - panel.offsetLeft < 350)) {
                    panel.style.position = 'absolute';
                    if (panelId === 'panelRight') {
                        panel.style.right = '20px'; panel.style.left = 'auto'; panel.style.top = '60px';
                    } else {
                        panel.style.left = '20px'; panel.style.top = '60px';
                    }
                }
            }
        }

        // ==========================================
        // RICH TEXT & PHỤC HỒI BÔI ĐEN
        // ==========================================
        function switchRightTab(tabId, btn) {
            document.querySelectorAll('.ptab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.ptab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active'); document.getElementById(tabId).classList.add('active');
        }

        function restoreSelection() {
            if (savedSelectionRange) {
                let sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(savedSelectionRange);
            }
        }

        function formatDoc(cmd, value=null) {
            restoreSelection(); 
            if(value) document.execCommand(cmd, false, value);
            else document.execCommand(cmd);
        }

        function applyCustomStyle(property, value) {
            if(!value || value === 'px') return;
            restoreSelection(); 
            
            let sel = window.getSelection();
            if(sel.rangeCount) {
                let range = sel.getRangeAt(0);
                
                if(range.collapsed) {
                    // Không bôi đen: Áp dụng cho cả thẻ P chứa con trỏ
                    let block = range.startContainer.nodeType === 3 ? range.startContainer.parentNode : range.startContainer;
                    while (block && block.tagName !== 'P' && block.tagName !== 'DIV' && !block.classList?.contains('rich-input')) {
                        block = block.parentNode;
                    }
                    if(block && block.style) block.style[property] = value;
                } else {
                    // Bôi đen chữ: Bọc span
                    let span = document.createElement("span");
                    span.style[property] = value;
                    span.appendChild(range.extractContents());
                    range.insertNode(span);
                }
            }
        }

        function insertLink() {
            restoreSelection();
            showPrompt("Nhập đường dẫn (URL):", "https://", (url) => {
                if (url) { restoreSelection(); document.execCommand('createLink', false, url); }
            });
        }

        function insertComment() {
            restoreSelection();
            showPrompt("Nhập ghi chú cho đoạn bôi đen:", "", (note) => {
                if(note) {
                    restoreSelection();
                    let sel = window.getSelection();
                    if(sel.rangeCount) {
                        let range = sel.getRangeAt(0);
                        let span = document.createElement("span");
                        span.style.backgroundColor = "rgba(255, 235, 59, 0.4)";
                        span.title = note;
                        span.style.borderBottom = "1px dashed var(--red)";
                        span.appendChild(range.extractContents());
                        range.insertNode(span);
                    }
                }
            });
        }

        function updateCoverPreview() {
            let url = document.getElementById('coverUrlInput').value.trim();
            let img = document.getElementById('coverPreview');
            if(url) { img.src = url; img.style.display = 'block'; } 
            else { img.style.display = 'none'; }
        }

        // ==========================================
        // KÉO THƯỚC CĂN LÊ (RULER DRAG)
        // ==========================================
        let isDraggingRuler = false; let activeRulerSide = '';
        
        function startDragRuler(e, side) {
            e.preventDefault(); isDraggingRuler = true; activeRulerSide = side;
            document.onmousemove = dragRuler; document.onmouseup = stopDragRuler;
        }

        function dragRuler(e) {
            if(!isDraggingRuler) return;
            let container = document.querySelector('.editor-container');
            let rect = container.getBoundingClientRect();
            
            // Xác định thẻ đang bôi đen để căn lề
            let targetEl = null;
            if(savedSelectionRange) {
                let node = savedSelectionRange.startContainer;
                targetEl = node.nodeType === 3 ? node.parentNode : node;
                while (targetEl && targetEl.tagName !== 'P' && targetEl.tagName !== 'DIV' && !targetEl.classList?.contains('rich-input')) {
                    targetEl = targetEl.parentNode;
                }
            }
            if(!targetEl || targetEl.classList.contains('rich-input')) targetEl = document.getElementById('postContent'); // Chỉnh cả khung nếu không bôi đen

            if(activeRulerSide === 'left') {
                let offset = e.clientX - rect.left;
                if(offset < 0) offset = 0; if(offset > 300) offset = 300;
                document.getElementById('markerLeft').style.left = offset + 'px';
                targetEl.style.paddingLeft = offset + 'px';
            } else {
                let offset = rect.right - e.clientX;
                if(offset < 0) offset = 0; if(offset > 300) offset = 300;
                document.getElementById('markerRight').style.right = offset + 'px';
                targetEl.style.paddingRight = offset + 'px';
            }
        }
        function stopDragRuler() { isDraggingRuler = false; document.onmousemove = null; document.onmouseup = null; }
        function toggleRulers() {
            let h = document.getElementById('rulerH'); let v = document.getElementById('rulerV');
            if(h.style.display === 'block') { h.style.display = 'none'; v.style.display = 'none'; } 
            else { h.style.display = 'block'; v.style.display = 'block'; }
        }

        // ==========================================
        // GOOGLE FONTS (Lưu Sheet tự động)
        // ==========================================
        function loadGoogleFonts() {
            let fontsTab = sysData.sheets["Google Fonts"];
            if(fontsTab) {
                let select = document.getElementById('fontSelect');
                for(let r=1; r<fontsTab.length; r++) {
                    let fontName = fontsTab[r][1]; let link = fontsTab[r][0];
                    if(fontName && link) {
                        let temp = document.createElement('div'); temp.innerHTML = link;
                        temp.querySelectorAll('link').forEach(t => { let newLink = document.createElement('link'); newLink.rel = "stylesheet"; newLink.href = t.href; document.head.appendChild(newLink); });
                        let opt = document.createElement('option'); opt.value = `'${fontName}', sans-serif`; opt.innerText = fontName; select.appendChild(opt);
                    }
                }
            }
        }

        async function addGoogleFont() {
            let link = document.getElementById('fontLink').value.trim();
            if(!link.includes('<link')) return showAlert("Vui lòng dán nguyên thẻ &lt;link&gt; lấy từ Google Fonts.", true);
            
            let match = link.match(/family=([^:&]+)/);
            if(match && match[1]) {
                let fontName = match[1].replace(/\+/g, ' ');
                
                let select = document.getElementById('fontSelect');
                let opt = document.createElement('option');
                opt.value = `'${fontName}', sans-serif`; opt.innerText = fontName;
                select.appendChild(opt); select.value = opt.value;
                
                let temp = document.createElement('div'); temp.innerHTML = link;
                temp.querySelectorAll('link').forEach(t => { let n = document.createElement('link'); n.rel="stylesheet"; n.href=t.href; document.head.appendChild(n); });
                applyCustomStyle('font-family', opt.value);
                document.getElementById('fontLink').value = "";
                showAlert("Đã tải và áp dụng Font thành công!");

                // LƯU VỀ SHEET
                if(!sysData.sheets["Google Fonts"]) {
                    sysData.tabOrder.push("Google Fonts"); sysData.sheets["Google Fonts"] = [["Mã Link", "Tên Font"]];
                    await pushQueue({type:'MANAGE_TAB', action:'create', tab: "Google Fonts"});
                    await pushQueue({type:'SYNC_CELL', row: 1, col: 1, val: "Mã Link", tab: "Google Fonts"});
                    await pushQueue({type:'SYNC_CELL', row: 1, col: 2, val: "Tên Font", tab: "Google Fonts"});
                }
                let gfTab = sysData.sheets["Google Fonts"];
                let newRow = gfTab.length + 1; gfTab.push([link, fontName]);
                await pushQueue({type:'STRUCTURAL', action:'insertRow', index: newRow, count: 1, tab: "Google Fonts"});
                await pushQueue({type:'SYNC_CELL', row: newRow, col: 1, val: link, tab: "Google Fonts"});
                await pushQueue({type:'SYNC_CELL', row: newRow, col: 2, val: fontName, tab: "Google Fonts"});
            }
        }

        // ==========================================
        // KHỐI HTML TÙY CHỈNH (Realtime 2-way)
        // ==========================================
        function updateLineNumbers() {
            let ta = document.getElementById('htmlEditorTextarea');
            let lines = ta.value.split('\n').length;
            document.getElementById('lineNumbers').innerHTML = Array(lines).fill(0).map((_, i) => i + 1).join('<br>');
        }
        function syncScroll() { document.getElementById('lineNumbers').scrollTop = document.getElementById('htmlEditorTextarea').scrollTop; }

        function openHtmlModal(preFill = "") {
            restoreSelection();
            let sel = window.getSelection();
            let ta = document.getElementById('htmlEditorTextarea');
            activeHtmlBlock = null;

            // NẾU CON TRỎ ĐANG NẰM TRONG KHỐI CŨ -> LOAD CODE CŨ LÊN ĐỂ SỬA
            if(sel.rangeCount) {
                let node = sel.anchorNode;
                let block = node.nodeType === 3 ? node.parentNode : node;
                while (block && !block.classList?.contains('custom-html-block') && block.id !== 'postContent') {
                    block = block.parentNode;
                }
                if(block && block.classList.contains('custom-html-block')) {
                    activeHtmlBlock = block; 
                    ta.value = block.querySelector('.block-content').innerHTML; 
                } else {
                    ta.value = preFill; 
                }
            } else {
                ta.value = preFill;
            }

            updateLineNumbers();
            document.getElementById('htmlModal').style.display = 'flex';
        }
        
        function closeHtmlModal() { document.getElementById('htmlModal').style.display = 'none'; activeHtmlBlock = null; }

        function syncCodeToEditor() {
            if (activeHtmlBlock) {
                activeHtmlBlock.querySelector('.block-content').innerHTML = document.getElementById('htmlEditorTextarea').value;
            }
        }

        function insertHtmlBlock() {
            let html = document.getElementById('htmlEditorTextarea').value;
            if(!html) { closeHtmlModal(); return; }
            
            if (activeHtmlBlock) { closeHtmlModal(); return; } // Nếu đang sửa khối cũ thì đã sync realtime rồi

            // TẠO KHỐI MỚI CHUẨN YÊU CẦU
            let block = document.createElement("div");
            block.className = "custom-html-block";
            block.innerHTML = `
                <button class="block-del-btn del-top" onclick="this.parentElement.remove()" title="Xóa khối này"><i class="fas fa-times"></i></button>
                <div class="block-content">${html}</div>
                <button class="block-del-btn del-bot" onclick="this.parentElement.remove()" title="Xóa khối này"><i class="fas fa-times"></i></button>
            `;
            
            restoreSelection();
            let sel = window.getSelection();
            let editor = document.getElementById('postContent');
            
            // Xử lý chèn khối liên tiếp: Nếu con trỏ đang nằm trong khối, nhét luôn vào khối đó.
            let isInsideOtherBlock = false;
            if(sel.rangeCount && editor.contains(sel.anchorNode)) {
                let node = sel.anchorNode;
                let parentBlock = node.nodeType === 3 ? node.parentNode : node;
                while (parentBlock && !parentBlock.classList?.contains('custom-html-block') && parentBlock.id !== 'postContent') {
                    parentBlock = parentBlock.parentNode;
                }
                if(parentBlock && parentBlock.classList.contains('custom-html-block')) {
                    // Trộn chung HTML vào khối cũ
                    parentBlock.querySelector('.block-content').innerHTML += html;
                    isInsideOtherBlock = true;
                    block = parentBlock; // Trỏ biến block về parent để xử lý con trỏ
                } else {
                    let range = sel.getRangeAt(0);
                    range.insertNode(block);
                    range.collapse(false);
                }
            } else {
                editor.appendChild(block);
            }

            // ĐẨY CON TRỎ XUỐNG DÒNG TRỐNG MỚI BÊN DƯỚI
            let emptyP = document.createElement('p'); emptyP.innerHTML = "<br>";
            block.parentNode.insertBefore(emptyP, block.nextSibling);
            
            let newRange = document.createRange();
            newRange.setStart(emptyP, 0); newRange.collapse(true);
            sel.removeAllRanges(); sel.addRange(newRange);
            savedSelectionRange = newRange;

            closeHtmlModal();
        }

        // ==========================================
        // MẪU HTML (Templates & Dropdown)
        // ==========================================
        function loadTemplates() {
            let tplTab = sysData.sheets["Mẫu html"];
            if(!tplTab) return;
            
            let cats = {}; let catSelect = document.getElementById('catSelect');
            while(catSelect.options.length > 2) catSelect.remove(2);

            for(let r=1; r<tplTab.length; r++) {
                let cat = tplTab[r][0]; let name = tplTab[r][1]; let html = tplTab[r][2];
                if(!cats[cat]) cats[cat] = [];
                cats[cat].push({name: name, html: html});
                if(!Array.from(catSelect.options).some(o => o.value === cat)) catSelect.add(new Option(cat, cat));
            }

            let listHTML = "";
            for(let c in cats) {
                let id = 'cat_' + Math.random().toString(36).substr(2, 5);
                listHTML += `
                    <div class="mega-row-cat" onclick="document.getElementById('${id}').classList.toggle('open')">
                        <span><i class="fas fa-folder-open"></i> ${c}</span> <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="cat-content" id="${id}">
                `;
                cats[c].forEach(item => {
                    listHTML += `
                        <div class="template-item" data-html="${item.html.replace(/"/g, '&quot;')}" onclick="openHtmlModal(this.dataset.html)">
                            <span>${item.name}</span> <i class="fas fa-plus-circle"></i>
                        </div>
                    `;
                });
                listHTML += `</div>`;
            }
            document.getElementById('templatesList').innerHTML = listHTML;
        }

        function checkNewCategory(sel) {
            if(sel.value === "NEW") {
                showPrompt("Nhập tên Loại Khối mới:", "", (newCat) => {
                    if(newCat) {
                        let opt = new Option(newCat, newCat);
                        sel.add(opt); sel.value = newCat;
                    } else {
                        sel.selectedIndex = 0;
                    }
                });
            }
        }

        async function saveTemplate() {
            let cat = document.getElementById('catSelect').value;
            let name = document.getElementById('tplNameInput').value.trim();
            let html = document.getElementById('tplHtmlInput').value.trim();
            
            if(!cat || !name || !html) return showAlert("Vui lòng nhập đủ Loại khối, Tên mẫu và Mã HTML!", true);

            if(!sysData.sheets["Mẫu html"]) {
                sysData.tabOrder.push("Mẫu html"); sysData.sheets["Mẫu html"] = [["Loại Khối", "Tên Mẫu", "Mã HTML"]];
                await pushQueue({type:'MANAGE_TAB', action:'create', tab: "Mẫu html"});
                await pushQueue({type:'SYNC_CELL', row: 1, col: 1, val: "Loại Khối", tab: "Mẫu html"});
                await pushQueue({type:'SYNC_CELL', row: 1, col: 2, val: "Tên Mẫu", tab: "Mẫu html"});
                await pushQueue({type:'SYNC_CELL', row: 1, col: 3, val: "Mã HTML", tab: "Mẫu html"});
            }
            let tplTab = sysData.sheets["Mẫu html"];
            let newRow = tplTab.length + 1;
            tplTab.push([cat, name, html]);
            await pushQueue({type:'STRUCTURAL', action:'insertRow', index: newRow, count: 1, tab: "Mẫu html"});
            await pushQueue({type:'SYNC_CELL', row: newRow, col: 1, val: cat, tab: "Mẫu html"});
            await pushQueue({type:'SYNC_CELL', row: newRow, col: 2, val: name, tab: "Mẫu html"});
            await pushQueue({type:'SYNC_CELL', row: newRow, col: 3, val: html, tab: "Mẫu html"});

            showAlert("Đã lưu Mẫu HTML vào hệ thống thành công!");
            document.getElementById('tplNameInput').value = ""; document.getElementById('tplHtmlInput').value = "";
            loadTemplates();
        }

        // ==========================================
        // LƯU BÀI VIẾT (Sheet "Bài viết")
        // ==========================================
        async function savePostToSheet() {
            if(!draftData) return showAlert("Không tìm thấy dữ liệu Kế Hoạch gốc!", true);

            let title = document.getElementById("postTitle").innerHTML;
            let sapo = document.getElementById("postSapo").innerHTML;
            let coverUrl = document.getElementById("coverUrlInput").value.trim();
            let content = document.getElementById("postContent").innerHTML;
            
            // Xóa rác định dạng UI trước khi lưu
            let tempDiv = document.createElement('div'); tempDiv.innerHTML = content;
            tempDiv.querySelectorAll('.block-del-btn').forEach(el => el.remove());
            tempDiv.querySelectorAll('.custom-html-block').forEach(el => { el.style.border = ""; el.style.padding = ""; el.style.margin = ""; });
            content = tempDiv.innerHTML;

            let finalHtml = `
                <div class="post-wrapper">
                    ${title ? `<h1 class="post-title">${title}</h1>` : ""}
                    ${sapo ? `<div class="post-sapo">${sapo}</div>` : ""}
                    ${coverUrl ? `<img class="post-cover" src="${coverUrl}">` : ""}
                    <div class="post-body">${content}</div>
                </div>
            `;

            let planId = draftData.data[1]; // Cột 1 luôn là ID

            if(!sysData.sheets["Bài viết"]) {
                sysData.tabOrder.push("Bài viết"); sysData.sheets["Bài viết"] = [["ID Kế Hoạch", "Tiêu đề", "Sapo", "Ảnh Bìa", "Nội Dung HTML"]];
                await pushQueue({type:'MANAGE_TAB', action:'create', tab: "Bài viết"});
                await pushQueue({type:'SYNC_CELL', row: 1, col: 1, val: "ID Kế Hoạch", tab: "Bài viết"});
                await pushQueue({type:'SYNC_CELL', row: 1, col: 2, val: "Tiêu đề", tab: "Bài viết"});
                await pushQueue({type:'SYNC_CELL', row: 1, col: 3, val: "Sapo", tab: "Bài viết"});
                await pushQueue({type:'SYNC_CELL', row: 1, col: 4, val: "Ảnh Bìa", tab: "Bài viết"});
                await pushQueue({type:'SYNC_CELL', row: 1, col: 5, val: "Nội Dung HTML", tab: "Bài viết"});
            }

            let bvTab = sysData.sheets["Bài viết"];
            let targetRow = -1;
            for(let r=1; r<bvTab.length; r++) { if(bvTab[r][0] == planId) { targetRow = r; break; } }

            if(targetRow !== -1) {
                bvTab[targetRow] = [planId, title, sapo, coverUrl, finalHtml];
                await pushQueue({type:'SYNC_CELL', row: targetRow+1, col: 2, val: title, tab: "Bài viết"});
                await pushQueue({type:'SYNC_CELL', row: targetRow+1, col: 3, val: sapo, tab: "Bài viết"});
                await pushQueue({type:'SYNC_CELL', row: targetRow+1, col: 4, val: coverUrl, tab: "Bài viết"});
                await pushQueue({type:'SYNC_CELL', row: targetRow+1, col: 5, val: finalHtml, tab: "Bài viết"});
            } else {
                targetRow = bvTab.length; bvTab.push([planId, title, sapo, coverUrl, finalHtml]);
                await pushQueue({type:'STRUCTURAL', action:'insertRow', index: targetRow+1, count: 1, tab: "Bài viết"});
                await pushQueue({type:'SYNC_CELL', row: targetRow+1, col: 1, val: planId, tab: "Bài viết"});
                await pushQueue({type:'SYNC_CELL', row: targetRow+1, col: 2, val: title, tab: "Bài viết"});
                await pushQueue({type:'SYNC_CELL', row: targetRow+1, col: 3, val: sapo, tab: "Bài viết"});
                await pushQueue({type:'SYNC_CELL', row: targetRow+1, col: 4, val: coverUrl, tab: "Bài viết"});
                await pushQueue({type:'SYNC_CELL', row: targetRow+1, col: 5, val: finalHtml, tab: "Bài viết"});
            }
            showAlert("Bài viết đã được lưu hoàn tất!");
        }

        // PUSH QUEUE API
        let actionQueue = [];
        async function pushQueue(action) {
            actionQueue.push(action); localStorage.setItem("MKT_DATA", JSON.stringify(sysData));
            let s = document.getElementById('syncStatus'); s.innerText = "⏳ Đang lưu..."; s.style.color = "#f39c12";
            try {
                let res = await fetch(API_URL, { method: "POST", body: JSON.stringify([action]), headers: { "Content-Type": "text/plain;charset=utf-8" } });
                let json = await res.json();
                if(json.success) { s.innerText = "✅ Đã lưu"; s.style.color = "#27ae60"; }
            } catch(e) { s.innerText = "⚠️ Mất mạng"; s.style.color = "var(--red)"; }
        }
    </script>
