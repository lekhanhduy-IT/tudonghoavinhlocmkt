<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quản Lý Hình Ảnh & Canvas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --white: #ffffff; 
            --blue: #01adee; 
            --red: #db1010; 
            --gray-light: #f4f6f8; 
            --gray-border: #e0e0e0; 
            --text-main: #333333; 
            --canvas-bg: #e5e5e5;
            --grid-cols: 3;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--gray-light); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* TOOLBAR */
        .toolbar { height: 52px; background: var(--white); border-bottom: 1px solid var(--gray-border); display: flex; align-items: center; padding: 0 15px; justify-content: space-between; z-index: 100; flex-shrink: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tool-btn { background: var(--white); border: 0.5px solid var(--gray-border); color: var(--text-main); padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 600; border-radius: 4px; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; outline: none; }
        .tool-btn:hover { background: var(--gray-light); color: var(--blue); border-color: var(--blue); }
        .tool-btn.primary { background: var(--blue); color: var(--white); border-color: var(--blue); }
        .tool-select { padding: 6px; border: 0.5px solid var(--gray-border); border-radius: 4px; font-size: 13px; outline: none; cursor: pointer; }
        
        .view-controls { display: flex; align-items: center; gap: 10px; background: #fff; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--gray-border); }
        .view-btn { border: none; background: transparent; color: #777; cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: 0.2s; }
        .view-btn.active, .view-btn:hover { color: var(--blue); background: #eaf9fe; }

        /* WORKSPACE & LAYOUT */
        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }
        .canvas-area { flex: 1; background: var(--canvas-bg); position: relative; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: 40px; transition: all 0.3s; }
        .side-panel { width: 320px; background: var(--white); border-left: 1px solid var(--gray-border); display: flex; flex-direction: column; z-index: 10; flex-shrink: 0; }

        /* CANVAS PAGES */
        .canvas-page { background: var(--white); position: relative; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 30px; transition: transform 0.2s; transform-origin: top center; flex-shrink: 0; }
        .canvas-page.active-page { outline: 2px solid var(--blue); }
        .page-label { position: absolute; top: -25px; left: 0; font-size: 12px; font-weight: bold; color: #777; }

        /* LAYER & TRANSFORM */
        .layer { position: absolute; cursor: move; user-select: none; }
        .layer img, .layer svg { width: 100%; height: 100%; display: block; pointer-events: none; }
        .layer.selected { outline: 1px solid var(--blue); z-index: 100 !important; }
        
        /* RESIZE HANDLES */
        .handle { position: absolute; width: 10px; height: 10px; background: var(--white); border: 1px solid var(--blue); border-radius: 50%; display: none; }
        .layer.selected .handle { display: block; }
        .handle.tl { top: -5px; left: -5px; cursor: nwse-resize; }
        .handle.tr { top: -5px; right: -5px; cursor: nesw-resize; }
        .handle.bl { bottom: -5px; left: -5px; cursor: nesw-resize; }
        .handle.br { bottom: -5px; right: -5px; cursor: nwse-resize; }
        .handle.rotate { top: -25px; left: calc(50% - 5px); cursor: grab; border-radius: 50%; background: var(--blue); }

        /* VIEW MODES */
        /* 1. Dọc (Mặc định) */
        .view-vertical .canvas-page { margin-bottom: 40px; }
        
        /* 2. Ngang (Horizontal) */
        .view-horizontal { flex-direction: row; overflow-x: auto; overflow-y: hidden; align-items: center; padding: 20px; gap: 40px; scroll-snap-type: x mandatory; }
        .view-horizontal .canvas-page { scroll-snap-align: center; margin-bottom: 0; }
        .horizontal-strip { display: none; position: absolute; bottom: 0; left: 0; width: calc(100% - 320px); height: 80px; background: #fff; border-top: 1px solid var(--gray-border); padding: 10px; gap: 10px; overflow-x: auto; z-index: 50; }
        .strip-item { height: 100%; aspect-ratio: 1; background: #eee; cursor: pointer; border: 2px solid transparent; border-radius: 4px; overflow: hidden; position: relative; }
        .strip-item.active { border-color: var(--blue); }
        .strip-item img { width: 100%; height: 100%; object-fit: cover; }

        /* 3. Lưới (Grid) */
        .view-grid { display: grid; grid-template-columns: repeat(var(--grid-cols), 1fr); gap: 30px; align-items: start; justify-content: center; padding: 30px; }
        .view-grid .canvas-page { margin-bottom: 0; transform: scale(1); width: 100% !important; height: auto !important; aspect-ratio: 16/9; }

        /* SIDEBAR TABS */
        .panel-tabs { display: flex; border-bottom: 1px solid var(--gray-border); }
        .ptab { flex: 1; text-align: center; padding: 12px 5px; font-size: 13px; font-weight: bold; color: #777; cursor: pointer; border-bottom: 2px solid transparent; transition: 0.2s; }
        .ptab.active { color: var(--blue); border-bottom-color: var(--blue); background: #fdfdfd; }
        
        .sub-tabs { display: flex; background: #f9f9f9; border-bottom: 1px solid var(--gray-border); padding: 5px 10px; gap: 5px; }
        .stab { padding: 4px 10px; font-size: 11px; font-weight: bold; border-radius: 12px; cursor: pointer; color: #666; }
        .stab.active { background: var(--blue); color: #fff; }

        .panel-content { flex: 1; overflow-y: auto; padding: 15px; }
        .resource-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .res-item { background: #fff; border: 1px solid var(--gray-border); border-radius: 6px; overflow: hidden; cursor: pointer; position: relative; aspect-ratio: 1; display: flex; justify-content: center; align-items: center; padding: 5px; transition: 0.2s; }
        .res-item:hover { border-color: var(--blue); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .res-item img, .res-item svg { max-width: 100%; max-height: 100%; object-fit: contain; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 8px; border: 1px solid var(--gray-border); border-radius: 4px; font-size: 13px; outline: none; }
        
        /* CONTEXT MENU */
        .context-menu { position: fixed; background: #fff; border: 1px solid var(--gray-border); box-shadow: 0 5px 15px rgba(0,0,0,0.15); border-radius: 4px; z-index: 9999; display: none; min-width: 150px; padding: 5px 0; }
        .ctx-item { padding: 8px 15px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--text-main); }
        .ctx-item:hover { background: #f0f8ff; color: var(--blue); }
        .ctx-item.danger:hover { background: #fef0f0; color: var(--red); }
    </style>
</head>
<body>

<div class="toolbar">
    <div style="display: flex; align-items: center; gap: 10px;">
        <div style="font-weight: bold; color: var(--blue);"><i class="fas fa-paint-brush"></i> Studio Ảnh</div>
        <select id="projectSelect" class="tool-select" style="width: 180px; margin-left: 15px;" onchange="loadProjectImages()">
            <option value="">-- Chọn Project (Drive) --</option>
            </select>
        <button class="tool-btn" onclick="document.getElementById('uploadFile').click()"><i class="fas fa-upload"></i> Tải ảnh lên</button>
        <input type="file" id="uploadFile" multiple accept="image/*" style="display: none;" onchange="handleLocalUpload(event)">
    </div>

    <div class="view-controls">
        <button class="view-btn active" onclick="setViewMode('vertical')" title="Cuộn Dọc"><i class="fas fa-arrows-alt-v"></i></button>
        <button class="view-btn" onclick="setViewMode('horizontal')" title="Cuộn Ngang"><i class="fas fa-arrows-alt-h"></i></button>
        <button class="view-btn" onclick="setViewMode('grid')" title="Dạng Lưới"><i class="fas fa-th"></i></button>
        <div id="gridZoomWrapper" style="display: none; align-items: center; gap: 5px; margin-left: 10px; border-left: 1px solid #ccc; padding-left: 10px;">
            <i class="fas fa-search-minus" style="font-size: 11px; color:#777;"></i>
            <input type="range" id="gridZoom" min="2" max="6" value="3" style="width: 60px;" oninput="changeGridZoom(this.value)">
            <i class="fas fa-search-plus" style="font-size: 11px; color:#777;"></i>
        </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
        <button class="tool-btn" onclick="openResizeModal()"><i class="fas fa-crop-alt"></i> Resize Page</button>
        <button class="tool-btn primary"><i class="fas fa-save"></i> Lưu Thay Đổi</button>
    </div>
</div>

<div class="workspace">
    <div class="canvas-area view-vertical" id="canvasArea">
        </div>
    
    <div class="horizontal-strip" id="horizontalStrip">
        </div>

    <div class="side-panel">
        <div class="panel-tabs">
            <div class="ptab active" onclick="switchMainTab('tabUploads', this)">Tải Lên</div>
            <div class="ptab" onclick="switchMainTab('tabResources', this)">Tài Nguyên</div>
        </div>

        <div id="tabUploads" class="panel-content">
            <div style="font-size: 12px; color: #777; margin-bottom: 10px;">Ảnh trong Project hiện tại:</div>
            <div class="resource-grid" id="projectUploadsGrid">
                </div>
        </div>

        <div id="tabResources" class="panel-content" style="display: none; padding: 0;">
            <div class="sub-tabs">
                <div class="stab active" onclick="switchSubTab('subImg', this)">Ảnh</div>
                <div class="stab" onclick="switchSubTab('subShape', this)">Shape</div>
                <div class="stab" onclick="switchSubTab('subFrame', this)">Frame</div>
            </div>
            
            <div style="padding: 15px; overflow-y: auto; height: calc(100% - 32px);">
                <div id="subImg" class="sub-content">
                    <button class="tool-btn" style="width: 100%; justify-content: center; margin-bottom: 15px;" onclick="uploadResourceImage()"><i class="fas fa-cloud-upload-alt"></i> Tải ảnh lên Kho chung</button>
                    <div class="resource-grid" id="globalImageGrid"></div>
                </div>

                <div id="subShape" class="sub-content" style="display: none;">
                    <div class="form-group">
                        <label>Thêm mã HTML/SVG Shape mới:</label>
                        <textarea id="svgShapeInput" class="form-control" rows="3" placeholder="<svg>...</svg>"></textarea>
                        <button class="tool-btn primary" style="width: 100%; margin-top: 5px; justify-content: center;" onclick="saveCanvaResource('Shape')">Lưu Shape vào Sheet</button>
                    </div>
                    <hr style="border:0; border-top:1px dashed #ccc; margin: 15px 0;">
                    <div class="resource-grid" id="shapeGrid"></div>
                </div>

                <div id="subFrame" class="sub-content" style="display: none;">
                    <div class="form-group">
                        <label>Thêm mã HTML/SVG Frame mới:</label>
                        <textarea id="svgFrameInput" class="form-control" rows="3" placeholder="<svg>...</svg>"></textarea>
                        <button class="tool-btn primary" style="width: 100%; margin-top: 5px; justify-content: center;" onclick="saveCanvaResource('Frame')">Lưu Frame vào Sheet</button>
                    </div>
                    <hr style="border:0; border-top:1px dashed #ccc; margin: 15px 0;">
                    <div class="resource-grid" id="frameGrid"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="layerContextMenu" class="context-menu">
    <div class="ctx-item" onclick="execLayerAction('copy')"><i class="fas fa-copy"></i> Sao chép (Ctrl+C)</div>
    <div class="ctx-item" onclick="execLayerAction('cut')"><i class="fas fa-cut"></i> Cắt (Ctrl+X)</div>
    <div class="ctx-item" onclick="execLayerAction('paste')"><i class="fas fa-paste"></i> Dán (Ctrl+V)</div>
    <hr style="margin: 2px 0; border:0; border-top: 1px solid #eee;">
    <div class="ctx-item danger" onclick="execLayerAction('delete')"><i class="fas fa-trash"></i> Xóa (Delete)</div>
</div>

<script>
    // --- STATE MANAGEMENT ---
    let pages = []; // Mảng chứa các trang { id, width, height, dom }
    let activePageId = null;
    let activeLayer = null;
    let clipboardLayer = null;
    let currentViewMode = 'vertical'; // vertical | horizontal | grid
    const DRIVE_PROXY = "/api/drive-image?id="; // Mock endpoint for rendering

    // Lấy ID Sheet từ hệ thống admin.html (Mock)
    const API_URL = "https://script.google.com/macros/s/AKfycbytCrAHTpFnykzOAwTkxbAR6tm32P9RZrS42EnUFh2WTWTQRtZr60Q27Lzrbhq_cuo/exec";
    
    // --- KHO CHỨA TÀI NGUYÊN TẠM ---
    let canvaResources = { Shape: [], Frame: [] };

    window.onload = () => {
        // Mock fetch projects & sheets
        mockFetchDriveProjects();
        loadCanvaResourcesFromLocal();
        
        // Bắt sự kiện bàn phím
        document.addEventListener('keydown', handleKeyboard);
        // Đóng menu chuột phải
        document.addEventListener('click', () => { document.getElementById('layerContextMenu').style.display = 'none'; });
        
        // Bắt sự kiện zoom bằng touchpad (Wheel / Pinch)
        document.getElementById('canvasArea').addEventListener('wheel', handlePinchZoom, { passive: false });
    };

    // --- TAB SWITCHING ---
    function switchMainTab(id, btn) {
        document.querySelectorAll('.ptab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tabUploads').style.display = id === 'tabUploads' ? 'block' : 'none';
        document.getElementById('tabResources').style.display = id === 'tabResources' ? 'block' : 'none';
    }

    function switchSubTab(id, btn) {
        document.querySelectorAll('.stab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.sub-content').forEach(c => c.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    }

    // --- VIEW MODES ---
    function setViewMode(mode) {
        currentViewMode = mode;
        const area = document.getElementById('canvasArea');
        const strip = document.getElementById('horizontalStrip');
        const zoomWrap = document.getElementById('gridZoomWrapper');

        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        event.currentTarget.classList.add('active');

        area.className = `canvas-area view-${mode}`;
        
        if(mode === 'horizontal') {
            strip.style.display = 'flex';
            zoomWrap.style.display = 'none';
            renderStrip();
        } else if (mode === 'grid') {
            strip.style.display = 'none';
            zoomWrap.style.display = 'flex';
        } else {
            strip.style.display = 'none';
            zoomWrap.style.display = 'none';
        }
    }

    function changeGridZoom(val) {
        document.documentElement.style.setProperty('--grid-cols', val);
    }

    function handlePinchZoom(e) {
        if(currentViewMode === 'grid' && e.ctrlKey) {
            e.preventDefault();
            let zoomSlider = document.getElementById('gridZoom');
            let currentVal = parseInt(zoomSlider.value);
            if(e.deltaY > 0 && currentVal < parseInt(zoomSlider.max)) zoomSlider.value = currentVal + 1;
            else if(e.deltaY < 0 && currentVal > parseInt(zoomSlider.min)) zoomSlider.value = currentVal - 1;
            changeGridZoom(zoomSlider.value);
        }
    }

    // --- MOCK API & INITIALIZATION ---
    function mockFetchDriveProjects() {
        const select = document.getElementById('projectSelect');
        const mockFolders = [
            { id: "f1", name: "Dự án Thiết Bị Khí Nén" },
            { id: "f2", name: "Dự án Bơm Công Nghiệp" }
        ];
        mockFolders.forEach(f => {
            let opt = document.createElement('option');
            opt.value = f.id; opt.innerText = f.name;
            select.appendChild(opt);
        });
    }

    function loadProjectImages() {
        const folderId = document.getElementById('projectSelect').value;
        if(!folderId) return;

        // Mock: Sinh ra 3 ảnh giả làm layer đầu tiên của 3 Canvas Pages
        const mockImages = [
            "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=500",
            "https://images.unsplash.com/photo-1504328345606-18bbc8c9d7d1?w=500"
        ];

        const grid = document.getElementById('projectUploadsGrid');
        grid.innerHTML = "";
        document.getElementById('canvasArea').innerHTML = "";
        pages = [];

        mockImages.forEach((url, idx) => {
            // Render vào sidebar
            let item = document.createElement('div');
            item.className = 'res-item';
            item.innerHTML = `<img src="${url}">`;
            item.onclick = () => addLayerToActivePage('image', url);
            grid.appendChild(item);

            // Tạo page tương ứng
            createCanvasPage(800, 600, url, `Page ${idx + 1}`);
        });
        
        if(currentViewMode === 'horizontal') renderStrip();
    }

    function handleLocalUpload(e) {
        Array.from(e.target.files).forEach(file => {
            const url = URL.createObjectURL(file);
            let item = document.createElement('div');
            item.className = 'res-item';
            item.innerHTML = `<img src="${url}">`;
            item.onclick = () => addLayerToActivePage('image', url);
            document.getElementById('projectUploadsGrid').prepend(item);
        });
    }

    // --- CANVAS ENGINE ---
    function createCanvasPage(w, h, initialImgUrl, title) {
        const pageId = 'page_' + Date.now() + Math.random().toString(36).substr(2, 5);
        const area = document.getElementById('canvasArea');

        const wrapper = document.createElement('div');
        wrapper.className = 'canvas-page';
        wrapper.id = pageId;
        wrapper.style.width = w + 'px';
        wrapper.style.height = h + 'px';
        wrapper.innerHTML = `<div class="page-label">${title}</div>`;

        wrapper.addEventListener('mousedown', (e) => {
            if(e.target === wrapper) {
                clearLayerSelection();
                setActivePage(pageId);
            }
        });

        area.appendChild(wrapper);
        pages.push({ id: pageId, width: w, height: h, dom: wrapper });

        if(initialImgUrl) {
            appendLayer(wrapper, 'image', initialImgUrl, 0, 0, w, h);
        }
        
        if(!activePageId) setActivePage(pageId);
    }

    function setActivePage(pageId) {
        document.querySelectorAll('.canvas-page').forEach(p => p.classList.remove('active-page'));
        const p = document.getElementById(pageId);
        if(p) p.classList.add('active-page');
        activePageId = pageId;
    }

    function addLayerToActivePage(type, content) {
        if(!activePageId) return alert('Vui lòng chọn một trang Canvas để chèn!');
        const page = document.getElementById(activePageId);
        // Default size 200x200, center of page
        const pw = parseInt(page.style.width);
        const ph = parseInt(page.style.height);
        appendLayer(page, type, content, pw/2 - 100, ph/2 - 100, 200, 200);
    }

    function appendLayer(pageDom, type, content, x, y, w, h) {
        const layer = document.createElement('div');
        layer.className = 'layer';
        layer.style.left = x + 'px';
        layer.style.top = y + 'px';
        layer.style.width = w + 'px';
        layer.style.height = h + 'px';
        layer.style.transform = 'rotate(0deg)';
        layer.dataset.angle = '0';

        if(type === 'image') layer.innerHTML = `<img src="${content}">`;
        else if (type === 'svg') layer.innerHTML = content;

        // Handles
        const handles = ['tl', 'tr', 'bl', 'br', 'rotate'].map(pos => `<div class="handle ${pos}" data-pos="${pos}"></div>`).join('');
        layer.insertAdjacentHTML('beforeend', handles);

        // Events
        layer.addEventListener('mousedown', handleLayerMouseDown);
        layer.addEventListener('contextmenu', showContextMenu);
        
        pageDom.appendChild(layer);
    }

    function clearLayerSelection() {
        document.querySelectorAll('.layer').forEach(l => l.classList.remove('selected'));
        activeLayer = null;
    }

    // --- INTERACTION ENGINE (DRAG, RESIZE MỎ NEO ĐỐI DIỆN, ROTATE) ---
    let dragState = null;

    function handleLayerMouseDown(e) {
        if(e.button !== 0) return; // Only left click
        e.stopPropagation();
        clearLayerSelection();
        
        activeLayer = e.currentTarget;
        activeLayer.classList.add('selected');
        setActivePage(activeLayer.parentElement.id);

        const handle = e.target.closest('.handle');
        const rect = activeLayer.getBoundingClientRect();
        const parentRect = activeLayer.parentElement.getBoundingClientRect();

        dragState = {
            action: handle ? (handle.dataset.pos === 'rotate' ? 'rotate' : 'resize') : 'move',
            handlePos: handle ? handle.dataset.pos : null,
            startX: e.clientX,
            startY: e.clientY,
            layerX: parseFloat(activeLayer.style.left),
            layerY: parseFloat(activeLayer.style.top),
            layerW: parseFloat(activeLayer.style.width),
            layerH: parseFloat(activeLayer.style.height),
            angle: parseFloat(activeLayer.dataset.angle) || 0,
            centerX: rect.left + rect.width / 2,
            centerY: rect.top + rect.height / 2
        };

        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
    }

    function handleMouseMove(e) {
        if(!dragState || !activeLayer) return;

        const dx = e.clientX - dragState.startX;
        const dy = e.clientY - dragState.startY;

        if (dragState.action === 'move') {
            activeLayer.style.left = (dragState.layerX + dx) + 'px';
            activeLayer.style.top = (dragState.layerY + dy) + 'px';
        } 
        else if (dragState.action === 'resize') {
            // Toán học thu phóng với mỏ neo góc đối diện (dành cho Layer không xoay để đơn giản hóa)
            let newW = dragState.layerW;
            let newH = dragState.layerH;
            let newX = dragState.layerX;
            let newY = dragState.layerY;

            // Tính tỷ lệ
            const ratio = dragState.layerW / dragState.layerH;

            switch(dragState.handlePos) {
                case 'br':
                    newW = Math.max(20, dragState.layerW + dx);
                    newH = newW / ratio;
                    break;
                case 'bl':
                    newW = Math.max(20, dragState.layerW - dx);
                    newH = newW / ratio;
                    newX = dragState.layerX + (dragState.layerW - newW);
                    break;
                case 'tr':
                    newW = Math.max(20, dragState.layerW + dx);
                    newH = newW / ratio;
                    newY = dragState.layerY + (dragState.layerH - newH);
                    break;
                case 'tl':
                    newW = Math.max(20, dragState.layerW - dx);
                    newH = newW / ratio;
                    newX = dragState.layerX + (dragState.layerW - newW);
                    newY = dragState.layerY + (dragState.layerH - newH);
                    break;
            }

            activeLayer.style.width = newW + 'px';
            activeLayer.style.height = newH + 'px';
            activeLayer.style.left = newX + 'px';
            activeLayer.style.top = newY + 'px';
        }
        else if (dragState.action === 'rotate') {
            const rad = Math.atan2(e.clientY - dragState.centerY, e.clientX - dragState.centerX);
            let deg = (rad * 180 / Math.PI) + 90; // +90 do điểm neo nằm ở Top
            activeLayer.style.transform = `rotate(${deg}deg)`;
            activeLayer.dataset.angle = deg;
        }
    }

    function handleMouseUp() {
        dragState = null;
        document.removeEventListener('mousemove', handleMouseMove);
        document.removeEventListener('mouseup', handleMouseUp);
        if(currentViewMode === 'horizontal') syncThumbnailStrip();
    }

    // --- MINI CONTEXT MENU ---
    function showContextMenu(e) {
        e.preventDefault();
        e.stopPropagation();
        activeLayer = e.currentTarget;
        clearLayerSelection();
        activeLayer.classList.add('selected');

        const menu = document.getElementById('layerContextMenu');
        menu.style.display = 'block';
        menu.style.left = e.clientX + 'px';
        menu.style.top = e.clientY + 'px';
    }

    function execLayerAction(action) {
        document.getElementById('layerContextMenu').style.display = 'none';
        if(!activeLayer) return;

        if (action === 'delete') {
            activeLayer.remove();
            activeLayer = null;
        } else if (action === 'copy') {
            clipboardLayer = activeLayer.cloneNode(true);
            clipboardLayer.classList.remove('selected');
        } else if (action === 'cut') {
            clipboardLayer = activeLayer.cloneNode(true);
            clipboardLayer.classList.remove('selected');
            activeLayer.remove();
            activeLayer = null;
        } else if (action === 'paste' && clipboardLayer) {
            const newLayer = clipboardLayer.cloneNode(true);
            // Lệch đi 20px
            newLayer.style.left = (parseFloat(newLayer.style.left) + 20) + 'px';
            newLayer.style.top = (parseFloat(newLayer.style.top) + 20) + 'px';
            newLayer.addEventListener('mousedown', handleLayerMouseDown);
            newLayer.addEventListener('contextmenu', showContextMenu);
            activeLayer.parentElement.appendChild(newLayer);
            
            clearLayerSelection();
            activeLayer = newLayer;
            activeLayer.classList.add('selected');
        }
    }

    function handleKeyboard(e) {
        if(!activeLayer) return;
        if(e.key === 'Delete' || e.key === 'Backspace') {
            execLayerAction('delete');
        } else if (e.ctrlKey && e.key === 'c') {
            execLayerAction('copy');
        } else if (e.ctrlKey && e.key === 'x') {
            execLayerAction('cut');
        } else if (e.ctrlKey && e.key === 'v') {
            execLayerAction('paste');
        }
    }

    // --- HORIZONTAL SYNC STRIP ---
    function renderStrip() {
        const strip = document.getElementById('horizontalStrip');
        strip.innerHTML = '';
        pages.forEach(p => {
            const dom = p.dom;
            // Tạo bản sao thu nhỏ nhanh
            let thumb = document.createElement('div');
            thumb.className = 'strip-item';
            if(p.id === activePageId) thumb.classList.add('active');
            
            // Tìm hình ảnh đầu tiên làm thumb
            let img = dom.querySelector('img');
            if(img) {
                thumb.innerHTML = `<img src="${img.src}">`;
            } else {
                thumb.innerHTML = `<div style="padding:10px; font-size:10px;">${dom.querySelector('.page-label').innerText}</div>`;
            }

            thumb.onclick = () => {
                setActivePage(p.id);
                dom.scrollIntoView({behavior: "smooth", inline: "center"});
                document.querySelectorAll('.strip-item').forEach(i=>i.classList.remove('active'));
                thumb.classList.add('active');
            };
            strip.appendChild(thumb);
        });
    }

    function syncThumbnailStrip() {
        if(currentViewMode === 'horizontal') renderStrip();
    }

    // --- GOOGLE SHEET SYNC CHO SHAPE/FRAME ---
    function loadCanvaResourcesFromLocal() {
        try {
            let cached = localStorage.getItem("MKT_DATA");
            if (cached) {
                let sysData = JSON.parse(cached);
                let sheet = sysData.sheets["Canva_hidden"];
                if (sheet) {
                    for(let i=1; i<sheet.length; i++) {
                        let type = sheet[i][0]; // Shape hoặc Frame
                        let svgCode = sheet[i][1];
                        if (canvaResources[type]) {
                            canvaResources[type].push(svgCode);
                        }
                    }
                }
            }
        } catch(e) {}
        renderResources();
    }

    function renderResources() {
        ['Shape', 'Frame'].forEach(type => {
            let grid = document.getElementById(type.toLowerCase() + 'Grid');
            if(grid) {
                grid.innerHTML = '';
                canvaResources[type].forEach(svg => {
                    let item = document.createElement('div');
                    item.className = 'res-item';
                    item.innerHTML = svg;
                    item.onclick = () => addLayerToActivePage('svg', svg);
                    grid.appendChild(item);
                });
            }
        });
    }

    function saveCanvaResource(type) {
        let inputId = type === 'Shape' ? 'svgShapeInput' : 'svgFrameInput';
        let svgCode = document.getElementById(inputId).value.trim();
        if(!svgCode || !svgCode.startsWith('<svg')) {
            alert('Mã HTML không hợp lệ (phải bắt đầu bằng <svg>)');
            return;
        }

        // Mock đẩy lên Sheet qua actionQueue (Yêu cầu AppScript hỗ trợ)
        // pushQueue({type:'STRUCTURAL', action:'insertRow', index: 2, count: 1, tab: "Canva_hidden"});
        // pushQueue({type:'SYNC_CELL', row: 2, col: 1, val: type, tab: "Canva_hidden"});
        // pushQueue({type:'SYNC_CELL', row: 2, col: 2, val: svgCode, tab: "Canva_hidden"});

        // Local cập nhật UI
        canvaResources[type].unshift(svgCode);
        document.getElementById(inputId).value = '';
        renderResources();
        alert(`Đã lưu ${type} vào hệ thống!`);
    }

    // --- MODAL RESIZE CANVAS ---
    function openResizeModal() {
        if(!activePageId) return alert('Hãy chọn 1 Canvas Page để đổi kích thước!');
        const p = pages.find(x => x.id === activePageId);
        let newW = prompt("Nhập Chiều Rộng (Width) mới:", p.width);
        let newH = prompt("Nhập Chiều Cao (Height) mới:", p.height);
        
        if(newW && newH) {
            let applyAll = confirm("Bạn có muốn áp dụng kích thước này cho TẤT CẢ các page trong Project không?");
            if(applyAll) {
                pages.forEach(page => {
                    page.width = newW; page.height = newH;
                    page.dom.style.width = newW + 'px';
                    page.dom.style.height = newH + 'px';
                });
            } else {
                p.width = newW; p.height = newH;
                p.dom.style.width = newW + 'px';
                p.dom.style.height = newH + 'px';
            }
        }
    }
</script>
