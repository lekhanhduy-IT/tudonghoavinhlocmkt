<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
    <title>Canva Studio - Hệ Thống MKT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --white: #ffffff;
            --blue: #01adee;
            --red: #db1010;
            --gray-light: #f4f6f8;
            --gray-border: #e0e0e0;
            --text-main: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body { background: #e8ecef; color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* ================= TOOLBAR ================= */
        .toolbar {
            height: 56px; background: var(--white); border-bottom: 1px solid var(--gray-border);
            display: flex; align-items: center; padding: 0 15px; justify-content: space-between; z-index: 100; flex-shrink: 0;
            gap: 10px;
        }
        .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
        
        .tool-btn {
            background: var(--white); border: 1px solid var(--gray-border); color: var(--text-main);
            padding: 6px 12px; cursor: pointer; font-size: 12px; font-weight: 600; border-radius: 6px;
            display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; outline: none; white-space: nowrap;
        }
        .tool-btn:hover, .tool-btn.active { background: #eef9fd; color: var(--blue); border-color: var(--blue); }
        .tool-btn.primary { background: var(--blue); color: var(--white); border-color: var(--blue); }
        
        .select-project {
            padding: 6px 10px; border-radius: 6px; border: 1px solid var(--gray-border);
            font-size: 12px; font-weight: bold; color: var(--blue); outline: none; min-width: 180px; cursor: pointer;
        }

        /* ================= WORKSPACE CHÍNH ================= */
        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* KHU VỰC CUỘN CHỨA CANVAS: LUÔN CÁCH BIÊN 20PX */
        #workspaceScroll {
            flex: 1; overflow: auto; background: #e8ecef; position: relative;
            padding: 20px; /* Cách mép màn hình 20px */
        }

        /* BỘ KHUNG HIỂN THỊ CÁC PAGE: ĐẢM BẢO GAP 20PX */
        #zoomContent {
            display: flex; flex-direction: column; align-items: center; gap: 20px; /* Các page cách nhau đúng 20px */
            min-height: 100%;
        }
        #zoomContent.view-grid {
            display: grid;
            grid-template-columns: repeat(var(--grid-cols, 3), auto);
            justify-content: center; align-items: start; align-content: start;
        }

        /* STRIP THUMBNAIL (DÙNG KHI CHẾ ĐỘ TRƯỢT NGANG) */
        #horizStrip {
            height: 150px; width: 100%; background: var(--white); border-top: 1px solid var(--gray-border);
            display: none; gap: 15px; padding: 15px; overflow-x: auto; flex-shrink: 0; align-items: flex-start;
        }
        .horiz-thumb-wrapper { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
        .horiz-thumb-item { 
            border: 2px solid var(--gray-border); border-radius: 6px; cursor: pointer; 
            height: 90px; width: 90px; background: #fff; overflow: hidden; position: relative;
            box-sizing: border-box;
        }
        .horiz-thumb-item.active { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(1,173,238,0.3); }
        .horiz-thumb-label { font-size: 11px; font-weight: bold; color: #555; }

        /* ================= PAGE CONTAINER (NỀN TẢNG CHUẨN) ================= */
        /* Wrapper giữ không gian thật cho Flex/Grid ko bị xô lệch */
        .page-wrapper {
            position: relative; flex-shrink: 0;
        }
        /* Container mới là thứ bị phóng to thu nhỏ */
        .page-container {
            background: #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 4px;
            position: absolute; top: 0; left: 0; display: flex; flex-direction: column; overflow: hidden;
            transform-origin: top left; 
        }
        .page-toolbar {
            height: 30px; background: #2f3640; color: #fff; display: flex; align-items: center;
            justify-content: space-between; padding: 0 10px; font-size: 12px; flex-shrink: 0; pointer-events: none; 
        }
        .canvas-frame {
            flex: 1; /* Fix sập khung canvas: Ép chiếm toàn bộ chiều cao còn lại */
            position: relative; overflow: hidden; background: #ffffff; width: 100%; 
        }

        /* ================= LAYER TƯƠNG TÁC ================= */
        .canvas-layer {
            position: absolute; cursor: move; box-sizing: border-box;
            display: flex; justify-content: center; align-items: center;
        }
        .layer-content { width: 100%; height: 100%; pointer-events: none; display: flex; overflow: hidden; }
        .layer-content img, .layer-content svg { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
        
        .canvas-layer.selected { outline: 1.5px solid var(--blue); outline-offset: 0; }
        .canvas-layer:not(.selected) .layer-handle { display: none !important; }
        
        .layer-handle { position: absolute; z-index: 10; display: flex; align-items: center; justify-content: center; }
        
        /* 4 GÓC: Thu phóng giữ tỷ lệ */
        .layer-handle.corner { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 1.5px solid var(--blue); }
        .layer-handle.tl { top: -7px; left: -7px; cursor: nwse-resize; }
        .layer-handle.tr { top: -7px; right: -7px; cursor: nesw-resize; }
        .layer-handle.bl { bottom: -7px; left: -7px; cursor: nesw-resize; }
        .layer-handle.br { bottom: -7px; right: -7px; cursor: nwse-resize; }

        /* 4 CẠNH: Cắt xén (Crop) */
        .layer-handle.edge { background: #fff; border: 1.5px solid var(--blue); border-radius: 4px; }
        .layer-handle.tc { top: -4px; left: 50%; transform: translateX(-50%); width: 24px; height: 8px; cursor: ns-resize; }
        .layer-handle.bc { bottom: -4px; left: 50%; transform: translateX(-50%); width: 24px; height: 8px; cursor: ns-resize; }
        .layer-handle.lc { top: 50%; left: -4px; transform: translateY(-50%); width: 8px; height: 24px; cursor: ew-resize; }
        .layer-handle.rc { top: 50%; right: -4px; transform: translateY(-50%); width: 8px; height: 24px; cursor: ew-resize; }

        /* Nút Xoay 360 */
        .layer-handle.rot {
            top: -30px; left: 50%; transform: translateX(-50%); cursor: grab;
            width: 24px; height: 24px; border-radius: 50%; background: #fff; 
            border: 1px solid var(--gray-border); box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .layer-handle.rot i { font-size: 11px; pointer-events: none; color: var(--text-main); }

        /* Mini Menu Layer */
        .layer-mini-menu {
            position: absolute; top: -45px; right: 0; background: #2f3640; border-radius: 6px; 
            display: flex; gap: 4px; padding: 4px; z-index: 20; box-shadow: 0 4px 10px rgba(0,0,0,0.2); white-space: nowrap;
        }
        .layer-mini-menu button { background: transparent; border: none; color: #fff; font-size: 12px; padding: 4px 8px; cursor: pointer; border-radius: 3px; }
        .layer-mini-menu button:hover { background: var(--blue); }
        .canvas-layer:not(.selected) .layer-mini-menu { display: none !important; }

        /* ================= MENU CHUỘT PHẢI (CONTEXT MENU) ================= */
        .context-menu {
            position: fixed; background: #fff; border: 1px solid var(--gray-border); border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 9999; display: none; flex-direction: column;
            padding: 5px 0; min-width: 170px; font-size: 13px; color: var(--text-main);
        }
        .context-menu-item { padding: 10px 15px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: 500;}
        .context-menu-item:hover { background: #eef9fd; color: var(--blue); }
        .context-menu-item i { width: 14px; text-align: center; }

        /* ================= RIGHT SIDEBAR ================= */
        .right-sidebar-container { display: flex; height: 100%; z-index: 50; flex-shrink: 0; border-left: 1px solid var(--gray-border); background: var(--white); }
        .sidebar-panel { width: 300px; background: var(--white); display: flex; flex-direction: column; transition: width 0.2s ease; overflow: hidden; }
        .sidebar-panel.collapsed { width: 0; border: none; opacity: 0; pointer-events: none;}
        .sidebar-icon-strip { width: 65px; background: #f9f9f9; border-left: 1px solid var(--gray-border); display: flex; flex-direction: column; align-items: center; padding-top: 15px; gap: 15px; }
        .icon-tab { width: 50px; height: 50px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: #666; font-size: 18px; transition: 0.2s; }
        .icon-tab span { font-size: 9px; font-weight: bold; margin-top: 3px; white-space: nowrap;}
        .icon-tab:hover, .icon-tab.active { background: #eef9fd; color: var(--blue); }
        .sidebar-panel-header { padding: 15px; border-bottom: 1px solid var(--gray-border); font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .close-panel-btn { cursor: pointer; color: #999; font-size: 14px; padding: 5px; }
        .close-panel-btn:hover { color: var(--red); }
        .tab-content { flex: 1; overflow-y: auto; padding: 15px; display: none; }
        .tab-content.active { display: flex; flex-direction: column; gap: 15px; }
        .sub-tabs { display: flex; gap: 5px; border-bottom: 1px solid var(--gray-border); padding-bottom: 8px; }
        .sub-tab-btn { font-size: 11px; padding: 5px 10px; border-radius: 4px; cursor: pointer; background: var(--gray-light); font-weight: 600; flex: 1; text-align: center; }
        .sub-tab-btn.active { background: var(--blue); color: #fff; }
        .sub-content { display: none; flex-direction: column; gap: 10px; }
        .sub-content.active { display: flex; }
        .asset-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .asset-item { border: 1px solid var(--gray-border); border-radius: 6px; padding: 6px; cursor: pointer; background: #fff; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .asset-item img, .asset-item svg { width: 100%; height: 100%; object-fit: contain; }
        .asset-item:hover { border-color: var(--blue); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        /* MODAL & LOADER */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; display: none; align-items: center; justify-content: center; }
        .modal-box { background: var(--white); padding: 20px; border-radius: 8px; width: 340px; }
        .loader-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.85); z-index: 1000; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; font-weight: bold; color: var(--blue); }
        .spinner { width: 36px; height: 36px; border: 4px solid #f3f3f3; border-top: 4px solid var(--blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* POPUP LAYER */
.layer-popup {
    position: absolute; top: 60px; left: 20px; width: 280px; background: #fff;
    border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 1000;
    display: none; flex-direction: column; border: 1px solid var(--gray-border);
}
.layer-popup-header {
    padding: 12px 15px; border-bottom: 1px solid var(--gray-border);
    font-weight: bold; display: flex; justify-content: space-between; align-items: center;
}
.layer-list { max-height: 300px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
.layer-list-item {
    padding: 8px; background: var(--gray-light); border: 1px solid transparent;
    border-radius: 6px; display: flex; align-items: center; gap: 10px; cursor: pointer;
}
.layer-list-item.active { background: #eef9fd; border-color: var(--blue); }

/* BỘ LỌC TEXTURE */
.filter-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.filter-group label { font-size: 11px; font-weight: bold; color: #555; display: flex; justify-content: space-between; }
.filter-group input[type="range"] { width: 100%; cursor: pointer; }
/* GIAO DIỆN KHI CHỌN NHIỀU LAYER */
.canvas-layer.multi-selected { outline: 1.5px dashed var(--blue); outline-offset: 0; }
.canvas-layer.multi-selected .layer-handle { display: none !important; }
.canvas-layer.multi-selected .layer-mini-menu { display: none !important; }
/* ================= CSS CHO NHÓM NÚT CHẾ ĐỘ XEM ================= */
#viewModeGroup .tool-btn {
    border-radius: 0; /* Nút ở giữa không bo góc */
}

#viewModeGroup .tool-btn:not(:last-child) {
    border-right: none; /* Bỏ viền phải của các nút đầu/giữa để tránh tạo viền đôi */
}

#viewModeGroup .tool-btn:first-child {
    border-radius: 6px 0 0 6px; /* Bo 2 góc bên trái cho nút đầu tiên */
}

#viewModeGroup .tool-btn:last-child {
    border-radius: 0 6px 6px 0; /* Bo 2 góc bên phải cho nút cuối cùng */
}
    </style>
</head>
<body>

        </div>

        <div class="toolbar-right">
            <div style="display: flex; align-items: center; gap: 5px; margin-right: 15px; font-size: 12px; font-weight: bold;">
                <button class="tool-btn" onclick="manualZoom(-0.1)" title="Thu nhỏ"><i class="fas fa-search-minus"></i></button>
                <span id="zoomDisplay" style="min-width: 40px; text-align: center;">100%</span>

            <div style="display: flex;" id="viewModeGroup">

            <div id="gridZoomBar" style="display: none; align-items: center; gap: 5px; font-size: 11px; margin-left: 10px;">

            </div>
        </div>

    <div class="workspace" id="mainWorkspace">
        
        <div style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
            <div id="workspaceScroll">
                <div id="zoomContent" class="view-vertical">
                    <div style="color: #999; margin: auto; padding-top: 50px;">Vui lòng chọn Project hoặc Tải ảnh lên để bắt đầu.</div>
                </div>
            </div>
            <div id="horizStrip"></div>
        </div>

            <div class="context-menu-item" style="color:var(--red)" onclick="ctxDeletePage()"><i class="fas fa-trash"></i> Xóa Page</div>
        </div>

        <div class="right-sidebar-container">
            <div class="sidebar-panel" id="sidebarPanel">
<div class="tab-content" id="tab-adjust">
    <div style="font-size: 12px; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
        <span>Chỉnh sửa Texture</span>

    <div class="filter-group"><label>Bão hòa <span id="val-saturate">100%</span></label><input type="range" id="f-saturate" min="0" max="200" value="100" oninput="applyFilters()" onchange="saveState()"></div>

</div>
                <div class="sidebar-panel-header">

    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbytCrAHTpFnykzOAwTkxbAR6tm32P9RZrS42EnUFh2WTWTQRtZr60Q27Lzrbhq_cuo/exec";
        
let pagesData = []; 
let activePageIndex = 0;
// THAY ĐỔI: Chuyển selectedLayer thành mảng để hỗ trợ Multi-select
let selectedLayers = []; 
let layerClipboard = null;
let currentViewMode = 'vertical';
let currentZoom = 1;
let ctxMenuTargetPage = -1;

// MỚI: Biến lưu trữ History
let undoStack = [];
let redoStack = [];

// Hàm lưu trạng thái để Undo
function saveState() {
    // Lưu bản sao sâu (deep copy) của pagesData
    // Lưu ý loại bỏ thuộc tính 'dom' vì không thể stringify DOM element
    let cleanData = pagesData.map(p => ({
        ...p,
        layers: p.layers.map(l => {
            let cl = {...l}; delete cl.dom; return cl;
        })
    }));
    undoStack.push(JSON.stringify(cleanData));
    if(undoStack.length > 30) undoStack.shift(); // Giới hạn 30 bước
    redoStack = []; // Xóa redo khi có hành động mới
}

// Hàm 1: Gộp ảnh lại vào Frame khi click ra ngoài
function commitFrameEdit(dom, layerObj) {
    // Lưu lại vị trí/kích thước mới của Ảnh so với Khung
    layerObj.imgX = layerObj.x - layerObj.frameCanvasX;
    layerObj.imgY = layerObj.y - layerObj.frameCanvasY;
    layerObj.imgW = layerObj.w;
    layerObj.imgH = layerObj.h;

    // Trả lại tọa độ Layer về chính cái Khung
    layerObj.x = layerObj.frameCanvasX;
    layerObj.y = layerObj.frameCanvasY;
    layerObj.w = layerObj.frameW;
    layerObj.h = layerObj.frameH;
    layerObj.isEditingFrame = false;

    dom.style.left = layerObj.x + 'px';
    dom.style.top = layerObj.y + 'px';
    dom.style.width = layerObj.w + 'px';
    dom.style.height = layerObj.h + 'px';

    // Đóng gói lại chuỗi HTML
    layerObj.content = `
        <div style="width: 100%; height: 100%; clip-path: ${layerObj.frameClipPath}; border-radius: ${layerObj.frameRadius}; overflow: hidden; position: relative;">
            <div style="position: absolute; left: ${layerObj.imgX}px; top: ${layerObj.imgY}px; width: ${layerObj.imgW}px; height: ${layerObj.imgH}px; display: flex; align-items: center; justify-content: center;">
                ${layerObj.rawContent}
            </div>
        </div>
    `;
    dom.querySelector('.layer-content').innerHTML = layerObj.content;
    syncAllThumbnails();
}

// Hàm 2: Đồng bộ Khung ảo đứng im khi bạn kéo Ảnh mờ
function updateFrameEditMask(dom, layerObj) {
    if (!layerObj.isEditingFrame) return;
    let frameRelX = layerObj.frameCanvasX - layerObj.x;
    let frameRelY = layerObj.frameCanvasY - layerObj.y;
    
    let mask = dom.querySelector('.edit-frame-mask');
    let inner = dom.querySelector('.edit-frame-inner');
    if (mask && inner) {
        mask.style.left = `${frameRelX}px`;
        mask.style.top = `${frameRelY}px`;
        inner.style.left = `${-frameRelX}px`;
        inner.style.top = `${-frameRelY}px`;
        inner.style.width = `${layerObj.w}px`;
        inner.style.height = `${layerObj.h}px`;
    }
}

        /* ================= TẢI DỮ LIỆU TỪ SHEET & DRIVE ================= */
        async function fetchSubFolders() {
            try {
                let res = await fetch(`${API_URL}?action=get_projects`);
                let json = await res.json();
                let select = document.getElementById("projectSelect");
                if (json.success && json.folders) {
                    json.folders.forEach(f => select.innerHTML += `<option value="${f.id}">${f.name}</option>`);
                }
            } catch(e) {}
        }

async function fetchResourceData() {
            try {
                // Thêm tham số &t= để phá cache trình duyệt
                let res = await fetch(`${API_URL}?action=get_canva_resources&t=${Date.now()}`);
                let json = await res.json();
                if (json.success) {
                    renderAssetGrid("resourceImgGrid", json.images, 'img');
                    renderAssetGrid("resourceShapeGrid", json.shapes, 'svg');
                    renderAssetGrid("resourceFrameGrid", json.frames, 'svg');
                }
            } catch(e) {
                console.error("Lỗi fetch resource:", e);
            }
        }

        function renderAssetGrid(containerId, list, type) {
            let el = document.getElementById(containerId);
            el.innerHTML = "";
            (list || []).forEach(item => {
                let div = document.createElement("div");
                div.className = "asset-item";
                let content = type === 'img' ? `<img src="https://drive.google.com/thumbnail?id=${item.id}&sz=w1000">` : item.code;
                div.innerHTML = content;
                div.onclick = () => addLayerToActivePage(content);
                el.appendChild(div);
            });
        }

        /* ================= LOAD HÌNH ẢNH MỚI VÀO CANVAS ================= */
        async function loadProjectImages(folderId) {
            if (!folderId) return;
            showLoader("Đang nạp ảnh Project...");
            pagesData = [];
            document.getElementById("uploadAssetGrid").innerHTML = "";
            try {
                let res = await fetch(`${API_URL}?action=get_images&folderId=${folderId}`);
                let json = await res.json();
                if (json.success && json.images) {
                    for (let img of json.images) {
                        // CHUẨN XÁC: SỬ DỤNG THUMBNAIL ĐỂ TRÁNH LỖI CORS 100%
                        let thumbUrl = `https://drive.google.com/thumbnail?id=${img.id}&sz=w1000`;
                        createPageFromImage(img.name, thumbUrl);
                    }
                }
            } finally { hideLoader(); }
        }

        function handleLocalUpload(input) {
            Array.from(input.files).forEach(file => {
                let reader = new FileReader();
                reader.onload = async (e) => {
                    createPageFromImage(file.name, e.target.result);
                };
                reader.readAsDataURL(file);
            });
        }

        // BỎ QUA VIỆC TÍNH KÍCH THƯỚC QUA JS ĐỂ CHỐNG TREO - RENDER TRỰC TIẾP
        function createPageFromImage(title, url) {
            let canvasW = 800; 
            let canvasH = 800;
            let pageId = "p_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5);
            let page = { id: pageId, title: title, width: canvasW, height: canvasH, layers: [] };
            pagesData.push(page);
            
            addAssetToUploadTab(url);

            // Gán cứng tỷ lệ ảnh mặc định chiếm 80% Canvas ban đầu, trình duyệt sẽ tự Object-fit vừa vặn
            let layerW = 640; 
            let layerH = 640; 
            let startX = (canvasW - layerW) / 2;
            let startY = (canvasH - layerH) / 2;
            
            let content = `<img src="${url}" style="width:100%; height:100%; object-fit:cover; pointer-events:none;">`;
            
            let layerObj = { id: "l_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5), content, w: layerW, h: layerH, x: startX, y: startY, rot: 0 };
            page.layers.push(layerObj);

            renderAllPages();
        }

        function addAssetToUploadTab(url) {
            let grid = document.getElementById("uploadAssetGrid");
            let div = document.createElement("div");
            div.className = "asset-item";
            div.innerHTML = `<img src="${url}">`;
            div.onclick = () => addLayerToActivePage(`<img src="${url}" style="width:100%; height:100%; object-fit:cover; pointer-events:none;">`);
            grid.appendChild(div);
        }

        /* ================= RENDER CANVAS VÀ TÍNH KÍCH THƯỚC CHUẨN XÁC ================= */
        function renderAllPages() {
            deselectAllLayers();
            let zoomContent = document.getElementById("zoomContent");
            let horizStrip = document.getElementById("horizStrip");
            
            zoomContent.innerHTML = "";
            
            if (pagesData.length === 0) {
                zoomContent.innerHTML = `<div style="color:#999; margin:auto; padding-top:50px;">Chưa có trang canvas nào.</div>`;
                horizStrip.style.display = 'none';
                return;
            }

            if (currentViewMode === 'horizontal') {
                horizStrip.style.display = 'flex';
                let activePage = pagesData[activePageIndex] || pagesData[0];
                zoomContent.appendChild(createPageDOM(activePage, activePageIndex));
                renderThumbnailsStrip();
            } else {
                horizStrip.style.display = 'none';
                pagesData.forEach((page, idx) => {
                    zoomContent.appendChild(createPageDOM(page, idx));
                });
            }
            
            applyLayoutScaling();
        }

function createPageDOM(page, idx) {
            let wrapper = document.createElement("div");
            wrapper.className = "page-wrapper";
            wrapper.id = `wrapper_${page.id}`;
            
            let w = page.width;
            let totalH = page.height + 30; 
            
            wrapper.style.width = `${w}px`;
            wrapper.style.height = `${totalH}px`;
            
            let pEl = document.createElement("div");
            pEl.className = "page-container";
            pEl.dataset.pageIndex = idx;
            pEl.onclick = () => activePageIndex = idx;
            pEl.style.width = `${w}px`;
            pEl.style.height = `${totalH}px`;

            // BỔ SUNG: Khung multi-select-box
            pEl.innerHTML = `
                <div class="page-toolbar"><span>Trang ${idx+1}: ${page.title}</span><span>${page.width}x${page.height}</span></div>
                <div class="canvas-frame" id="frame_${page.id}">
                    <div class="multi-select-box" id="msb_${page.id}" style="display:none; position:absolute; border: 1.5px solid var(--blue); z-index: 9999; pointer-events: none; box-sizing: border-box;">
                        <div class="layer-handle corner tl" data-ms-handle="tl" style="pointer-events: auto;"></div>
                        <div class="layer-handle corner tr" data-ms-handle="tr" style="pointer-events: auto;"></div>
                        <div class="layer-handle corner bl" data-ms-handle="bl" style="pointer-events: auto;"></div>
                        <div class="layer-handle corner br" data-ms-handle="br" style="pointer-events: auto;"></div>
                    </div>
                </div>
            `;
            
            let frame = pEl.querySelector(".canvas-frame");
            let msb = pEl.querySelector(".multi-select-box");
            
            // Gắn sự kiện thu phóng cho Khung bao
            msb.addEventListener("mousedown", (e) => {
                let handle = e.target.getAttribute("data-ms-handle");
                if(handle) { e.stopPropagation(); startMSBResize(e, msb, handle, idx); }
            });
            msb.addEventListener("touchstart", (e) => {
                let handle = e.target.getAttribute("data-ms-handle");
                if(handle && e.touches.length === 1) {
                    e.stopPropagation(); startMSBResize(e.touches[0], msb, handle, idx, true);
                }
            }, {passive: false});

            page.layers.forEach(layerObj => {
                let lDom = createLayerDOM(idx, layerObj);
                layerObj.dom = lDom;
                frame.appendChild(lDom);
            });
            
            wrapper.appendChild(pEl);
            return wrapper;
        }

        /* STRIP THUMBNAIL (ĐỒNG BỘ REALTIME TỪ TRỰC TIẾP TỪ DỮ LIỆU) */

        /* HÀM KẾT XUẤT THUMBNAIL TỪ DATA CHUẨN XÁC 100% VÀ KHÔNG BỊ TRẮNG */
 /* HÀM KẾT XUẤT THUMBNAIL TỪ DATA CHUẨN XÁC 100% VÀ KHÔNG BỊ TRẮNG */
        function syncAllThumbnails() {
            if (currentViewMode !== 'horizontal') return;
            pagesData.forEach((p, idx) => {
                let thumbInner = document.getElementById(`thumb_canvas_${idx}`);
                if (!thumbInner) return;
                
                let scaleW = 90 / p.width;
                let scaleH = 90 / p.height;
                let scale = Math.min(scaleW, scaleH);
                
                let offsetX = (90 - (p.width * scale)) / 2;
                let offsetY = (90 - (p.height * scale)) / 2;
                
                let html = `<div style="position: absolute; top: ${offsetY}px; left: ${offsetX}px; width: ${p.width}px; height: ${p.height}px; transform: scale(${scale}); transform-origin: top left; background: #fff; overflow: hidden;">`;
                p.layers.forEach(l => {
                    // Tái tạo Filter cho Thumbnail
                    let filterStyle = "";
                    if (l.filters) {
                        let f = l.filters;
                        filterStyle = `filter: brightness(${f.bright}%) contrast(${f.contrast}%) saturate(${f.saturate}%) hue-rotate(${f.hue}deg) opacity(${f.opac}%);`;
                    }
                    html += `<div style="position:absolute; left:${l.x}px; top:${l.y}px; width:${l.w}px; height:${l.h}px; transform:rotate(${l.rot||0}deg); display:flex; justify-content:center; align-items:center; overflow:hidden;">
                                <div class="layer-content" style="width:100%; height:100%; ${filterStyle}">${l.content}</div>
                             </div>`;
                });
                html += `</div>`;
                thumbInner.innerHTML = html;
            });
        }


        /* THUẬT TOÁN ZOOM BẢO ĐẢM KHOẢNG CÁCH GAP LÀ 20PX */
        function applyLayoutScaling() {
            let zoomContent = document.getElementById("zoomContent");
            if(!zoomContent) return;

            let scale = currentZoom;
            
            // Xử lý tính toán Scale khi ở chế độ GRID
            if(currentViewMode === 'grid') {
                let cols = parseInt(document.getElementById("gridColSlider").value) || 3;
                let gap = 20;
                let padding = 40; 
                let availableWidth = document.getElementById("workspaceScroll").clientWidth - padding - (gap * (cols - 1));
                scale = availableWidth / cols / (pagesData[0]?.width || 800);
                
                // Cập nhật lại số liệu hiển thị
                currentZoom = scale;
                document.getElementById("zoomDisplay").innerText = Math.round(currentZoom * 100) + "%";
            }

            pagesData.forEach((p, idx) => {
                let wrapper = document.getElementById(`wrapper_${p.id}`);
                let container = wrapper?.querySelector('.page-container');
                if(!wrapper || !container) return; // Bỏ qua nếu ko tìm thấy

                let totalH = p.height + 30; // 30px cho toolbar

                // Gán scale cho Container
                container.style.transform = `scale(${scale})`;
                
                // Ép KÍCH THƯỚC VẬT LÝ của Wrapper bằng đúng kích thước Scale
                // Đây là mấu chốt để các trang không bao giờ đè lên nhau, luôn cách nhau đúng 20px
                wrapper.style.width = `${p.width * scale}px`;
                wrapper.style.height = `${totalH * scale}px`;
            });
        }


        /* ================= TƯƠNG TÁC LỚP LAYER ================= */
function addLayerToActivePage(content) {
            if (pagesData.length === 0) return;
            let page = pagesData[activePageIndex];
            let defW = page.width * 0.4;
            let defH = page.height * 0.4;
            let x = (page.width - defW) / 2;
            let y = (page.height - defH) / 2;
            // Gọi hàm với rot=0
            addLayerToPage(activePageIndex, content, defW, defH, x, y, 0);
        }

function createLayerDOM(pageIdx, layerObj) {
            let layerDom = document.createElement("div");
            layerDom.className = "canvas-layer";
            layerDom.id = layerObj.id;
            layerDom.style.left = `${layerObj.x}px`; 
            layerDom.style.top = `${layerObj.y}px`;
            layerDom.style.width = `${layerObj.w}px`; 
            layerDom.style.height = `${layerObj.h}px`;
            layerDom.style.transform = `rotate(${layerObj.rot||0}deg)`;
            
            // BỔ SUNG: KHÔI PHỤC TEXTURE KHI RENDER LẠI (ĐỔI CHẾ ĐỘ XEM)
            let filterStyle = "";
            if (layerObj.filters) {
                let f = layerObj.filters;
                filterStyle = `filter: brightness(${f.bright}%) contrast(${f.contrast}%) saturate(${f.saturate}%) hue-rotate(${f.hue}deg) opacity(${f.opac}%);`;
            }
            
            layerDom.innerHTML = `
                <div class="layer-content" style="${filterStyle}">${layerObj.content}</div>
                <div class="layer-handle corner tl" data-handle="tl"></div><div class="layer-handle corner tr" data-handle="tr"></div>
                <div class="layer-handle corner bl" data-handle="bl"></div><div class="layer-handle corner br" data-handle="br"></div>
                <div class="layer-handle edge tc" data-handle="tc"></div><div class="layer-handle edge bc" data-handle="bc"></div>
                <div class="layer-handle edge lc" data-handle="lc"></div><div class="layer-handle edge rc" data-handle="rc"></div>
                <div class="layer-handle rot" data-handle="rot"><i class="fas fa-sync-alt"></i></div>
                <div class="layer-mini-menu">
                    <button onclick="copyLayer()"><i class="fas fa-copy"></i></button>
                    <button onclick="pasteLayer()"><i class="fas fa-paste"></i></button>
                    <button onclick="deleteLayer(this)"><i class="fas fa-trash"></i></button>
                </div>
            `;
            
            makeLayerInteractive(layerDom, pageIdx, layerObj);
            return layerDom;

    let layerObj = { id: "l_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5), content, w, h, x, y, rot, isGroup, groupItems };

    if (filters) {
        let contentEl = layerDom.querySelector('.layer-content');
        if (contentEl) contentEl.style.filter = `brightness(${filters.bright}%) contrast(${filters.contrast}%) saturate(${filters.saturate}%) hue-rotate(${filters.hue}deg) opacity(${filters.opac}%)`;
    }

    let frame = document.getElementById(`frame_${page.id}`);
    if (frame) frame.appendChild(layerDom);
    
    if (!preventSelect) {
        selectLayer(layerDom);
        syncAllThumbnails();
    }
    return layerObj;
}

/* ================= XỬ LÝ CHỌN NHIỀU LAYER CÙNG LÚC ================= */
function updateSelectionUI() {
    // Ẩn toàn bộ khung bao của mọi trang trước
    document.querySelectorAll('.multi-select-box').forEach(msb => msb.style.display = "none");
    if (selectedLayers.length === 0) return;

    // Nhóm các layer được chọn theo Trang (Page Index)
    let pageSelections = {};
    selectedLayers.forEach(dom => {
        let pIdx = dom.closest('.page-container').dataset.pageIndex;
        if (!pageSelections[pIdx]) pageSelections[pIdx] = [];
        pageSelections[pIdx].push(dom);
    });

    // Vẽ khung bao (Bounding Box) cho từng trang có Layer được chọn
    for (let pIdx in pageSelections) {
        let layersInPage = pageSelections[pIdx];
        let p = pagesData[pIdx];
        let msb = document.getElementById(`msb_${p.id}`);
        if (!msb) continue;

        if (layersInPage.length > 1) {
            layersInPage.forEach(dom => dom.classList.add("multi-selected")); 
            let minX = Math.min(...layersInPage.map(d => parseFloat(d.style.left)));
            let minY = Math.min(...layersInPage.map(d => parseFloat(d.style.top)));
            let maxX = Math.max(...layersInPage.map(d => parseFloat(d.style.left) + parseFloat(d.style.width)));
            let maxY = Math.max(...layersInPage.map(d => parseFloat(d.style.top) + parseFloat(d.style.height)));
            
            msb.style.left = minX + "px"; msb.style.top = minY + "px";
            msb.style.width = (maxX - minX) + "px"; msb.style.height = (maxY - minY) + "px";
            msb.style.display = "block";
        } else if (layersInPage.length === 1) {
            layersInPage[0].classList.remove("multi-selected");
            layersInPage[0].classList.add("selected");
        }
    }
}

function selectLayer(dom, isShift = false) {
    if (!isShift) {
        document.querySelectorAll(".canvas-layer").forEach(el => {
            el.classList.remove("selected", "multi-selected");
        });
        selectedLayers = [dom];
    } else {
        if (selectedLayers.includes(dom)) {
            selectedLayers = selectedLayers.filter(l => l !== dom);
            dom.classList.remove("selected", "multi-selected");
        } else { selectedLayers.push(dom); }
    }
    
    if (selectedLayers.length === 1) {
        selectedLayers[0].classList.add("selected");
        selectedLayers[0].classList.remove("multi-selected");
    } else if (selectedLayers.length > 1) {
        selectedLayers.forEach(el => {
            el.classList.remove("selected");
            el.classList.add("multi-selected");
        });
    }

    loadLayerFilters(); 
    if(document.getElementById('layerPopup').style.display === 'flex') renderLayerPopupList(); 
    updateSelectionUI(); 
}

function startMove(e, dom, layerObj, isTouch=false) {
    let startX = e.clientX;
    let startY = e.clientY;
    let scaleFactor = currentZoom;
    
    let origins = [];
    if (selectedLayers.includes(dom) && selectedLayers.length > 1) {
        selectedLayers.forEach(lDom => {
            let p = pagesData[activePageIndex];
            let lData = p.layers.find(l => l.id === lDom.id);
            origins.push({ dom: lDom, data: lData, origX: lData.x, origY: lData.y });
        });
    } else {
        origins.push({ dom: dom, data: layerObj, origX: layerObj.x, origY: layerObj.y });
    }

    function onMove(ev) {
        let clientX = isTouch ? ev.touches[0].clientX : ev.clientX;
        let clientY = isTouch ? ev.touches[0].clientY : ev.clientY;
        let dx = (clientX - startX) / scaleFactor;
        let dy = (clientY - startY) / scaleFactor;
        
        origins.forEach(item => {
            item.data.x = item.origX + dx;
            item.data.y = item.origY + dy;
            item.dom.style.left = `${item.data.x}px`;
            item.dom.style.top = `${item.data.y}px`;
            
            updateFrameEditMask(item.dom, item.data);
        });
        
        if (selectedLayers.length > 1) updateSelectionUI(); 
    }
    
    function onUp(ev) { 
        window.removeEventListener(isTouch?"touchmove":"mousemove", onMove); 
        window.removeEventListener(isTouch?"touchend":"mouseup", onUp); 
        syncAllThumbnails(); 

        if (selectedLayers.length === 1 && !layerObj.isEditingFrame) {
            let p = pagesData[activePageIndex];
            let draggedData = layerObj;
            let draggedIdx = p.layers.findIndex(l => l.id === draggedData.id);
            let dropX = isTouch ? ev.changedTouches[0].clientX : ev.clientX;
            let dropY = isTouch ? ev.changedTouches[0].clientY : ev.clientY;

            // ĐẢM BẢO CHỈ DUYỆT CÁC LAYER NẰM DƯỚI LAYER ĐANG KÉO (i < draggedIdx)
            for (let i = draggedIdx - 1; i >= 0; i--) {
                let targetLayer = p.layers[i];

                let isRawFrame = targetLayer && targetLayer.content.includes('data-is-frame="true"');
                let isAlreadyFramed = targetLayer && targetLayer.isFramed === true;

                if (isRawFrame || isAlreadyFramed) {
                    let targetDom = document.getElementById(targetLayer.id);
                    if (targetDom) {
                        let rect = targetDom.getBoundingClientRect();
                        
                        if (dropX >= rect.left && dropX <= rect.right && dropY >= rect.top && dropY <= rect.bottom) {
                            saveState(); // Lưu Undo

                            let frameW, frameH, frameRadius, frameClipPath;

                            if (isRawFrame) {
                                let frameInner = targetDom.querySelector('[data-is-frame="true"]');
                                let frameStyle = window.getComputedStyle(frameInner);
                                frameW = targetLayer.w;
                                frameH = targetLayer.h;
                                frameRadius = frameStyle.borderRadius || '0px';
                                frameClipPath = frameInner.style.clipPath || frameStyle.clipPath || 'none';
                            } else {
                                frameW = targetLayer.frameW;
                                frameH = targetLayer.frameH;
                                frameRadius = targetLayer.frameRadius;
                                frameClipPath = targetLayer.frameClipPath;
                            }
                            
                            draggedData.isFramed = true;
                            draggedData.rawContent = draggedData.content; 
                            draggedData.frameW = frameW;
                            draggedData.frameH = frameH;
                            draggedData.frameRadius = frameRadius;
                            draggedData.frameClipPath = frameClipPath;

                            let scale = Math.max(frameW / draggedData.w, frameH / draggedData.h);
                            draggedData.imgW = draggedData.w * scale;
                            draggedData.imgH = draggedData.h * scale;
                            draggedData.imgX = (frameW - draggedData.imgW) / 2;
                            draggedData.imgY = (frameH - draggedData.imgH) / 2;

                            draggedData.x = targetLayer.x;
                            draggedData.y = targetLayer.y;
                            draggedData.w = frameW;
                            draggedData.h = frameH;

                            dom.style.left = `${draggedData.x}px`;
                            dom.style.top = `${draggedData.y}px`;
                            dom.style.width = `${draggedData.w}px`;
                            dom.style.height = `${draggedData.h}px`;

                            draggedData.content = `
                                <div style="width: 100%; height: 100%; clip-path: ${draggedData.frameClipPath}; border-radius: ${draggedData.frameRadius}; overflow: hidden; position: relative;">
                                    <div style="position: absolute; left: ${draggedData.imgX}px; top: ${draggedData.imgY}px; width: ${draggedData.imgW}px; height: ${draggedData.imgH}px; display: flex; align-items: center; justify-content: center;">
                                        ${draggedData.rawContent}
                                    </div>
                                </div>
                            `;
                            dom.querySelector('.layer-content').innerHTML = draggedData.content;

                            targetDom.remove(); 
                            p.layers = p.layers.filter(l => l.id !== targetLayer.id); 

                            syncAllThumbnails();
                            updateSelectionUI(); 
                            if(document.getElementById('layerPopup').style.display === 'flex') renderLayerPopupList();
                            
                            // QUAN TRỌNG: Đã hít vào Frame rồi thì phải thoát vòng lặp ngay lập tức
                            break; 
                        }
                    }
                }
            }
        }
    }
    window.addEventListener(isTouch?"touchmove":"mousemove", onMove, {passive:false}); 
    window.addEventListener(isTouch?"touchend":"mouseup", onUp);
}

function startMSBResize(e, msbDom, handle, pageIdx, isTouch=false) {
    let startX = e.clientX, startY = e.clientY;
    let origGroupX = msbDom.offsetLeft, origGroupY = msbDom.offsetTop;
    let origGroupW = msbDom.offsetWidth, origGroupH = msbDom.offsetHeight;
    let ratio = origGroupW / origGroupH;
    
    let anchorX = (handle.includes("l")) ? origGroupX + origGroupW : origGroupX;
    let anchorY = (handle.includes("t")) ? origGroupY + origGroupH : origGroupY;
    let scaleFactor = currentZoom;
    let p = pagesData[pageIdx];
    
    // Lưu tọa độ ban đầu của tất cả layer con
    let origins = selectedLayers.map(lDom => {
        let lData = p.layers.find(l => l.id === lDom.id);
        return { dom: lDom, data: lData, origX: lData.x, origY: lData.y, origW: lData.w, origH: lData.h };
    });

    function onMove(ev) {
        let clientX = isTouch ? ev.touches[0].clientX : ev.clientX;
        let clientY = isTouch ? ev.touches[0].clientY : ev.clientY;
        
        let dx = (clientX - startX) / scaleFactor; 
        let newW, newH, newX, newY;

        if (handle === 'br') { newW = origGroupW + dx; newH = newW / ratio; newX = origGroupX; newY = origGroupY; }
        else if (handle === 'bl') { newW = origGroupW - dx; newH = newW / ratio; newX = anchorX - newW; newY = origGroupY; }
        else if (handle === 'tr') { newW = origGroupW + dx; newH = newW / ratio; newX = origGroupX; newY = anchorY - newH; }
        else if (handle === 'tl') { newW = origGroupW - dx; newH = newW / ratio; newX = anchorX - newW; newY = anchorY - newH; }

        if (newW > 20 && newH > 20) { 
            let scaleX = newW / origGroupW;
            let scaleY = newH / origGroupH;
            
            origins.forEach(item => {
                let nx = newX + (item.origX - origGroupX) * scaleX;
                let ny = newY + (item.origY - origGroupY) * scaleY;
                let nw = item.origW * scaleX;
                let nh = item.origH * scaleY;
                
                item.data.x = nx; item.data.y = ny;
                item.data.w = nw; item.data.h = nh;
                
                item.dom.style.left = `${nx}px`; item.dom.style.top = `${ny}px`;
                item.dom.style.width = `${nw}px`; item.dom.style.height = `${nh}px`;
            });
            
            msbDom.style.left = `${newX}px`; msbDom.style.top = `${newY}px`;
            msbDom.style.width = `${newW}px`; msbDom.style.height = `${newH}px`;
            syncAllThumbnails();
        }
    }
    function onUp() { 
        window.removeEventListener(isTouch?"touchmove":"mousemove", onMove); 
        window.removeEventListener(isTouch?"touchend":"mouseup", onUp); 
    }
    window.addEventListener(isTouch?"touchmove":"mousemove", onMove, {passive:false}); 
    window.addEventListener(isTouch?"touchend":"mouseup", onUp);
}

        /* LOGIC THAY ĐỔI KÍCH THƯỚC (GIỮ TỶ LỆ KHI KÉO GÓC) */
/* LOGIC THAY ĐỔI KÍCH THƯỚC SCALE ĐỒNG DẠNG (GIỮ NGUYÊN TỶ LỆ CHỮ VÀ HÌNH) */
function startResize(e, dom, handle, layerObj, isTouch=false) {
    let startX = e.clientX, startY = e.clientY;
    let origX = dom.offsetLeft, origY = dom.offsetTop;
    let origW = dom.offsetWidth, origH = dom.offsetHeight;
    let ratio = origW / origH;
    
    let anchorX = (handle.includes("l")) ? origX + origW : origX;
    let anchorY = (handle.includes("t")) ? origY + origH : origY;
    let scaleFactor = currentZoom;
    
    // Tìm thẻ nội dung để áp dụng Scale
    let contentContainer = dom.querySelector('.layer-content');

    function onMove(ev) {
        let clientX = isTouch ? ev.touches[0].clientX : ev.clientX;
        let clientY = isTouch ? ev.touches[0].clientY : ev.clientY;
        
        let dx = (clientX - startX) / scaleFactor; 
        let newW, newH, newX, newY;

        // Tính toán Kích thước & Tọa độ Khung (Vật lý)
        if (handle === 'br') { newW = origW + dx; newH = newW / ratio; newX = origX; newY = origY; }
        else if (handle === 'bl') { newW = origW - dx; newH = newW / ratio; newX = anchorX - newW; newY = origY; }
        else if (handle === 'tr') { newW = origW + dx; newH = newW / ratio; newX = origX; newY = anchorY - newH; }
        else if (handle === 'tl') { newW = origW - dx; newH = newW / ratio; newX = anchorX - newW; newY = anchorY - newH; }

        if (newW > 20 && newH > 20) { 
            // 1. Cập nhật Dữ liệu
            layerObj.w = newW; layerObj.h = newH; layerObj.x = newX; layerObj.y = newY;
            
            // 2. Cập nhật Khung Bao (Vật lý để con trỏ chuột hít đúng)
            dom.style.width = `${newW}px`; dom.style.height = `${newH}px`;
            dom.style.left = `${newX}px`; dom.style.top = `${newY}px`;
            
            // 3. SCALE ĐỒNG DẠNG NỘI DUNG (Cứu tinh cho Text và SVG)
            if (contentContainer) {
                // Tính toán tỷ lệ phóng to/thu nhỏ so với kích thước gốc lúc mới kéo
                let contentScale = newW / origW; 
                
                // Nếu layer đã bị scale trước đó, ta cần lấy scale hiện tại nhân thêm với scale mới
                let currentScaleStr = contentContainer.style.transform.match(/scale\(([^)]+)\)/);
                let currentScale = currentScaleStr ? parseFloat(currentScaleStr[1]) : 1;
                
                // Lưu ý quan trọng: Vì ta thay đổi cả width/height vật lý của DOM, 
                // ta PHẢI giữ nguyên width/height vật lý của contentContainer bằng với origW/origH, 
                // và CHỈ dùng transform: scale() để tạo ảo giác to nhỏ.
                contentContainer.style.width = `${origW}px`;
                contentContainer.style.height = `${origH}px`;
                contentContainer.style.transformOrigin = 'top left'; // Fix neo góc
                contentContainer.style.transform = `scale(${newW / origW})`;
                
                // Chỉnh lại vị trí của nội dung bên trong lớp vỏ (để scale mượt mà)
                if (handle.includes('r')) contentContainer.style.transformOrigin = 'top left';
                if (handle.includes('l')) contentContainer.style.transformOrigin = 'top right';
                if (handle.includes('b')) contentContainer.style.transformOrigin = handle.includes('l') ? 'bottom right' : 'bottom left';
                if (handle.includes('t')) contentContainer.style.transformOrigin = handle.includes('l') ? 'top right' : 'top left';
            }

            // HOOK: Đồng bộ Khung tĩnh nếu đang Edit Mặt nạ
            updateFrameEditMask(dom, layerObj);
        }
    }
    
    function onUp() { 
        window.removeEventListener(isTouch?"touchmove":"mousemove", onMove); 
        window.removeEventListener(isTouch?"touchend":"mouseup", onUp);
        
        // CHỐT SCALE: Sau khi nhả chuột, ta tính toán lại kích thước thật để tránh lỗi chồng chéo Scale
        if (contentContainer) {
            let scaleVal = parseFloat(contentContainer.style.transform.match(/scale\(([^)]+)\)/)?.[1] || 1);
            if (scaleVal !== 1) {
                // Nếu nội dung là SVG, cố gắng ép lại width/height (Thường không cần vì viewBox sẽ lo việc này)
                // Nhưng nếu là TEXT, ta phải tăng font-size vật lý
                let textElements = contentContainer.querySelectorAll('[contenteditable]');
                textElements.forEach(txtEl => {
                    let currentFontSize = window.getComputedStyle(txtEl).fontSize;
                    let newFontSize = parseFloat(currentFontSize) * scaleVal;
                    txtEl.style.fontSize = `${newFontSize}px`;
                });
                
                // Reset lại Scale ảo, áp dụng vào kích thước thật
                contentContainer.style.transform = 'none';
                contentContainer.style.width = '100%';
                contentContainer.style.height = '100%';
                
                // Cập nhật lại HTML vào data gốc để lưu
                layerObj.content = contentContainer.innerHTML;
            }
        }
        
        syncAllThumbnails(); 
    }
    window.addEventListener(isTouch?"touchmove":"mousemove", onMove, {passive:false}); 
    window.addEventListener(isTouch?"touchend":"mouseup", onUp);
}

        function startCrop(e, dom, handle, layerObj, isTouch=false) {

                else if (handle === 'bc') { newH = origH + dy; }

        }

        /* LOGIC XOAY LAYER (ROTATION) */
        function startRotate(e, dom, layerObj, isTouch=false) {
            let rect = dom.getBoundingClientRect();
            let centerX = rect.left + rect.width / 2;
            let centerY = rect.top + rect.height / 2;

            function onMove(ev) {
                let clientX = isTouch ? ev.touches[0].clientX : ev.clientX;
                let clientY = isTouch ? ev.touches[0].clientY : ev.clientY;
                
                let radians = Math.atan2(clientY - centerY, clientX - centerX);
                let degrees = (radians * (180 / Math.PI)) + 90; 
                
                layerObj.rot = degrees;
                dom.style.transform = `rotate(${degrees}deg)`;
                syncAllThumbnails();
            }
            function onUp() { 
                window.removeEventListener(isTouch?"touchmove":"mousemove", onMove); 
                window.removeEventListener(isTouch?"touchend":"mouseup", onUp); 
            }
            window.addEventListener(isTouch?"touchmove":"mousemove", onMove, {passive:false}); 
            window.addEventListener(isTouch?"touchend":"mouseup", onUp);
        }

        function manualZoom(delta) {
            if(currentViewMode === 'grid') return;

            document.getElementById("zoomDisplay").innerText = Math.round(currentZoom * 100) + "%";
            applyLayoutScaling();
        }

        /* XỬ LÝ PINCH TO ZOOM NÂNG CAO */
        function initAdvancedPinchToZoom() {
            let initialDist = null;
            let initialZoom = 1;
            let initialCols = 3;
            let workspaceArea = document.getElementById("workspaceScroll");

            workspaceArea.addEventListener('wheel', (e) => {
                if(e.ctrlKey) {
                    e.preventDefault();
                    if(currentViewMode === 'grid') return;
                    let delta = e.deltaY > 0 ? -0.05 : 0.05;
                    manualZoom(delta);
                }
            }, {passive: false});

            workspaceArea.addEventListener('touchstart', e => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    initialZoom = currentZoom;
                    initialCols = parseInt(document.getElementById("gridColSlider").value);
                }
            }, {passive: false});

            workspaceArea.addEventListener('touchmove', e => {
                if (initialDist && e.touches.length === 2) {
                    e.preventDefault();
                    let dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    
                    if(currentViewMode === 'grid') {
                        let diff = Math.round((initialDist - dist) / 60); 
                        let cols = Math.min(6, Math.max(1, initialCols + diff));
                        document.getElementById("gridColSlider").value = cols;
                        setGridColumns(cols);
                    } else {
                        let zoomFactor = dist / initialDist;
                        currentZoom = Math.max(0.1, Math.min(3, initialZoom * zoomFactor));
                        document.getElementById("zoomDisplay").innerText = Math.round(currentZoom * 100) + "%";
                        applyLayoutScaling();
                    }
                }
            }, {passive: false});

            workspaceArea.addEventListener('touchend', () => { initialDist = null; });
        }

                    });

function executeUndo() {
    if (undoStack.length === 0) return;
    redoStack.push(JSON.stringify(pagesData.map(p => ({...p, layers: p.layers.map(l => {let cl = {...l}; delete cl.dom; return cl;})}))));
    let prevState = JSON.parse(undoStack.pop());
    pagesData = prevState;
    selectedLayers = [];
    renderAllPages();
}

function executeRedo() {
    if (redoStack.length === 0) return;
    undoStack.push(JSON.stringify(pagesData.map(p => ({...p, layers: p.layers.map(l => {let cl = {...l}; delete cl.dom; return cl;})}))));
    let nextState = JSON.parse(redoStack.pop());
    pagesData = nextState;
    selectedLayers = [];
    renderAllPages();
}

function selectLayer(dom, isShift = false) {
    if (!isShift) {
        document.querySelectorAll(".canvas-layer").forEach(el => el.classList.remove("selected"));
        selectedLayers = [dom];
    } else {
        if (selectedLayers.includes(dom)) {
            selectedLayers = selectedLayers.filter(l => l !== dom);
            dom.classList.remove("selected");
            return;
        } else {
            selectedLayers.push(dom);
        }
    }
    dom.classList.add("selected");
    loadLayerFilters(dom); // Load texture cho tab Tùy chỉnh
    renderLayerPopupList(); // Cập nhật ui popup
}

/* ================= 3. THAY ĐỔI THỨ TỰ LAYER (Z-INDEX) ================= */
/* ================= 3. THAY ĐỔI THỨ TỰ LAYER (Z-INDEX) ================= */
function moveLayerOrder(direction) {
    if (selectedLayers.length !== 1) return; 
    saveState();
    let layerDom = selectedLayers[0];
    let layerId = layerDom.id;
    let page = pagesData[activePageIndex];
    let idx = page.layers.findIndex(l => l.id === layerId);
    
    if (direction === -1 && idx > 0) { // Đẩy xuống (Ctrl + [)
        let temp = page.layers[idx];
        page.layers[idx] = page.layers[idx - 1];
        page.layers[idx - 1] = temp;
        
        // Đảo Node trong DOM trực tiếp
        let prevDom = document.getElementById(page.layers[idx].id);
        if (layerDom && prevDom) prevDom.parentNode.insertBefore(layerDom, prevDom);
        
    } else if (direction === 1 && idx < page.layers.length - 1) { // Đẩy lên (Ctrl + ])
        let temp = page.layers[idx];
        page.layers[idx] = page.layers[idx + 1];
        page.layers[idx + 1] = temp;
        
        // Đảo Node trong DOM trực tiếp
        let nextDom = document.getElementById(page.layers[idx].id);
        if (layerDom && nextDom) nextDom.parentNode.insertBefore(nextDom, layerDom);
    }
    
    // Cập nhật Popup List mượt mà ngay lập tức
    if (document.getElementById('layerPopup').style.display === 'flex') {
        renderLayerPopupList();
    }
}

/* ================= 5. TÙY CHỈNH TEXTURE ================= */
function loadLayerFilters() {
    let f = { bright: 100, contrast: 100, saturate: 100, hue: 0, opac: 100 }; // Mặc định luôn là 100%
    
    if (selectedLayers.length === 1) {
        let dom = selectedLayers[0];
        let container = dom.closest('.page-container');
        if (container) {
            let pIdx = container.dataset.pageIndex;
            let lData = pagesData[pIdx].layers.find(l => l.id === dom.id);
            if(lData && lData.filters) f = lData.filters;
        }
    } else if (selectedLayers.length > 1) {
        let firstFilterStr = null;
        let isUniform = true;

        for (let dom of selectedLayers) {
            let container = dom.closest('.page-container');
            if (!container) continue;
            let pIdx = container.dataset.pageIndex;
            let lData = pagesData[pIdx].layers.find(l => l.id === dom.id);
            if (!lData) continue;

            let currFilterStr = lData.filters ? JSON.stringify(lData.filters) : JSON.stringify({ bright: 100, contrast: 100, saturate: 100, hue: 0, opac: 100 });
            
            if (!firstFilterStr) firstFilterStr = currFilterStr; 
            else if (firstFilterStr !== currFilterStr) { isUniform = false; break; }
        }
        if (isUniform && firstFilterStr) f = JSON.parse(firstFilterStr);
    }
    
    document.getElementById('f-bright').value = f.bright; document.getElementById('val-bright').innerText = f.bright + '%';
    document.getElementById('f-contrast').value = f.contrast; document.getElementById('val-contrast').innerText = f.contrast + '%';
    document.getElementById('f-saturate').value = f.saturate; document.getElementById('val-saturate').innerText = f.saturate + '%';
    document.getElementById('f-hue').value = f.hue; document.getElementById('val-hue').innerText = f.hue + 'deg';
    document.getElementById('f-opac').value = f.opac; document.getElementById('val-opac').innerText = f.opac + '%';
}

function applyFilters() {
    if (selectedLayers.length === 0) return;
    // Bỏ saveState() ở đây để chống lag, chuyển sang gọi khi nhả chuột ở HTML
    
    let bright = document.getElementById('f-bright').value;
    let contrast = document.getElementById('f-contrast').value;
    let saturate = document.getElementById('f-saturate').value;
    let hue = document.getElementById('f-hue').value;
    let opac = document.getElementById('f-opac').value;
    
    selectedLayers.forEach(dom => {
        let container = dom.closest('.page-container');
        if(!container) return; // Bảo vệ nếu DOM ảo
        let pIdx = container.dataset.pageIndex;
        let lData = pagesData[pIdx].layers.find(l => l.id === dom.id);
        if (lData) {
            lData.filters = { bright, contrast, saturate, hue, opac };
            let contentEl = dom.querySelector('.layer-content');
            if (contentEl) contentEl.style.filter = `brightness(${bright}%) contrast(${contrast}%) saturate(${saturate}%) hue-rotate(${hue}deg) opacity(${opac}%)`;
        }
    });
    
    document.getElementById('val-bright').innerText = bright + '%';
    document.getElementById('val-contrast').innerText = contrast + '%';
    document.getElementById('val-saturate').innerText = saturate + '%';
    document.getElementById('val-hue').innerText = hue + 'deg';
    document.getElementById('val-opac').innerText = opac + '%';
}

function resetFilters() {
    if (selectedLayers.length === 0) return;
    saveState();
    selectedLayers.forEach(dom => {
        let container = dom.closest('.page-container');
        if(!container) return;
        let pIdx = container.dataset.pageIndex;
        let lData = pagesData[pIdx].layers.find(l => l.id === dom.id);
        if (lData) {
            lData.filters = { bright: 100, contrast: 100, saturate: 100, hue: 0, opac: 100 };

            if (contentEl) contentEl.style.filter = "none";
        }
    });
    loadLayerFilters();
    syncAllThumbnails(); // Kích hoạt render lại Thumbnail 
}

/* ================= 6. NHÓM VÀ BỎ NHÓM (CTRL + G) ================= */
function toggleGroupLayers() {
    if (selectedLayers.length === 0) return;
    saveState();
    
    // Đảm bảo chỉ Group/Ungroup các layer trên cùng 1 trang hiện hành
    let firstLayerDom = selectedLayers[0];
    let activePIdx = firstLayerDom.closest('.page-container').dataset.pageIndex;
    let page = pagesData[activePIdx];

    // TRƯỜNG HỢP 1: BỎ NHÓM (UNGROUP)
    if (selectedLayers.length === 1) {
        let dom = selectedLayers[0];
        let lData = page.layers.find(l => l.id === dom.id);
        
        if (lData && lData.isGroup && lData.groupItems) {
            let dx = lData.x; let dy = lData.y;
            
            // Lấy Filter của Group mẹ hiện tại (Nếu có)
            let parentFilters = lData.filters ? JSON.parse(JSON.stringify(lData.filters)) : null;
            let hasParentFilter = parentFilters && JSON.stringify(parentFilters) !== JSON.stringify({ bright: 100, contrast: 100, saturate: 100, hue: 0, opac: 100 });
            
            selectedLayers = []; // Xóa chọn Group mẹ
            
            lData.groupItems.forEach(child => {
                let newX = dx + child.relX; let newY = dy + child.relY;
                // Nếu Group mẹ bị chỉnh Texture, gán Texture đó cho các con. Nếu không, phục hồi Texture gốc của con.
                let filtersToApply = hasParentFilter ? parentFilters : child.filters;
                
                let newLayer = addLayerToPage(activePIdx, child.content, child.w, child.h, newX, newY, child.rot, false, null, filtersToApply, true);
                selectedLayers.push(newLayer.dom);
            });
            
            page.layers = page.layers.filter(l => l.id !== lData.id);
            dom.remove();
            
            updateSelectionUI(); // Hiển thị Bounding box cho các con vừa rã
            syncAllThumbnails();
            if(document.getElementById('layerPopup').style.display === 'flex') renderLayerPopupList();
            return;
        }
    }

    // TRƯỜNG HỢP 2: GOM NHÓM (GROUP)
    if (selectedLayers.length > 1) {
        let groupLayersData = [];
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        
        selectedLayers.forEach(dom => {
            let lData = page.layers.find(l => l.id === dom.id);
            if(lData) {
                groupLayersData.push(lData);
                if(lData.x < minX) minX = lData.x;
                if(lData.y < minY) minY = lData.y;
                if(lData.x + lData.w > maxX) maxX = lData.x + lData.w;
                if(lData.y + lData.h > maxY) maxY = lData.y + lData.h;
            }
        });
        
        let groupW = maxX - minX; let groupH = maxY - minY;
        let groupItems = []; 
        
        let groupContent = `<div style="position:relative; width:100%; height:100%; pointer-events:none;">`;
        groupLayersData.forEach(l => {
            let relX = l.x - minX; let relY = l.y - minY;
            // LƯU CẢ FILTER CỦA TỪNG CON VÀO DỮ LIỆU GROUP
            groupItems.push({ content: l.content, w: l.w, h: l.h, relX: relX, relY: relY, rot: l.rot || 0, filters: l.filters ? {...l.filters} : null });
            
            // Render Inline Filter cho con để hiển thị đúng ngay trong Group
            let inlineFilter = l.filters ? `filter: brightness(${l.filters.bright}%) contrast(${l.filters.contrast}%) saturate(${l.filters.saturate}%) hue-rotate(${l.filters.hue}deg) opacity(${l.filters.opac}%);` : '';
            groupContent += `<div style="position:absolute; left:${relX}px; top:${relY}px; width:${l.w}px; height:${l.h}px; transform:rotate(${l.rot||0}deg); display:flex; justify-content:center; align-items:center; overflow:hidden; ${inlineFilter}">${l.content}</div>`;
        });
        groupContent += `</div>`;
        
        groupLayersData.forEach(gl => {
            let dom = document.getElementById(gl.id);
            if (dom) dom.remove();
        });
        page.layers = page.layers.filter(l => !groupLayersData.some(gl => gl.id === l.id));
        
        addLayerToPage(activePIdx, groupContent, groupW, groupH, minX, minY, 0, true, groupItems);
        syncAllThumbnails();
        if(document.getElementById('layerPopup').style.display === 'flex') renderLayerPopupList();
    }
}
