<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống MKT - Studio Hình Ảnh</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --white: #ffffff;
            --blue: #01adee;
            --blue-dark: #007bb5;
            --red: #db1010;
            --gray-light: #f4f6f8;
            --gray-border: #e0e0e0;
            --text-main: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--gray-light); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* THANH CÔNG CỤ (TOOLBAR) */
        .toolbar {
            height: 56px; background: var(--white); border-bottom: 1px solid var(--gray-border);
            display: flex; align-items: center; padding: 0 20px; justify-content: space-between; z-index: 100; flex-shrink: 0;
        }
        .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 12px; }
        
        .tool-btn {
            background: var(--white); border: 1px solid var(--gray-border); color: var(--text-main);
            padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 600; border-radius: 6px;
            display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; outline: none;
        }
        .tool-btn:hover { background: #eef9fd; color: var(--blue); border-color: var(--blue); }
        .tool-btn.primary { background: var(--blue); color: var(--white); border-color: var(--blue); }
        .tool-btn.primary:hover { background: var(--blue-dark); }
        
        .select-project {
            padding: 7px 12px; border-radius: 6px; border: 1px solid var(--gray-border);
            font-size: 13px; font-weight: bold; color: var(--blue); outline: none; min-width: 220px; cursor: pointer;
        }

        /* KHÔNG GIAN LÀM VIỆC CHÍNH */
        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* KHU VỰC THUMBNAIL BÊN TRÁI (LAYER LIST) */
        .layer-sidebar {
            width: 240px; background: var(--white); border-right: 1px solid var(--gray-border);
            display: flex; flex-direction: column; height: 100%; z-index: 10; flex-shrink: 0;
        }
        .layer-header { padding: 12px 15px; font-weight: bold; font-size: 13px; border-bottom: 1px solid var(--gray-border); color: var(--text-main); background: #f9f9f9; }
        .layer-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        
        .thumb-card {
            border: 2px solid var(--gray-border); border-radius: 8px; padding: 6px; cursor: pointer;
            transition: 0.2s; background: var(--white); display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative;
        }
        .thumb-card:hover { border-color: #99d1fa; }
        .thumb-card.active { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(1, 173, 238, 0.15); }
        .thumb-card img { width: 100%; height: 110px; object-fit: contain; background: #eee; border-radius: 4px; }
        .thumb-card span { font-size: 11px; font-weight: 600; color: #555; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* KHU VỰC CANVAS TRUNG TÂM */
        .canvas-area {
            flex: 1; height: 100%; overflow: auto; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; padding: 40px; gap: 40px;
        }

        .page-container {
            background: var(--white); box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-radius: 4px;
            position: relative; display: flex; flex-direction: column; transition: 0.3s;
        }
        .page-toolbar {
            height: 36px; background: #2f3640; color: #fff; display: flex; align-items: center;
            justify-content: space-between; padding: 0 15px; font-size: 12px; border-top-left-radius: 4px; border-top-right-radius: 4px;
        }
        
        /* KHUNG VẼ CANVAS CHÍNH */
        .canvas-frame {
            position: relative; overflow: hidden; background: #e8ecef;
            background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            display: flex; align-items: center; justify-content: center;
        }

        /* LAYER ẢNH TRONG CANVAS */
        .canvas-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain; pointer-events: none;
        }

        /* OVERLAY HIỆN THÔNG BÁO */
        .loader-overlay {
            position: fixed; inset: 0; background: rgba(255,255,255,0.85); z-index: 1000;
            display: none; align-items: center; justify-content: center; flex-direction: column; gap: 15px; font-weight: bold; color: var(--blue);
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* MODAL RESIZE */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; display: none; align-items: center; justify-content: center; }
        .modal-box { background: var(--white); padding: 25px; border-radius: 8px; width: 360px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .modal-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; color: var(--text-main); }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #666; }
        .input-group input { width: 100%; padding: 8px 10px; border: 1px solid var(--gray-border); border-radius: 4px; outline: none; }
        .input-group input:focus { border-color: var(--blue); }
    </style>
</head>
<body>

    <!-- OVERLAY TẢI DỮ LIỆU -->
    <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <span id="loaderText">Đang tải dữ liệu từ Google Drive...</span>
    </div>

    <!-- THANH CÔNG CỤ -->
    <div class="toolbar">
        <div class="toolbar-left">
            <span style="font-weight: 800; color: var(--blue); font-size: 16px;"><i class="fas fa-layer-group"></i> CANVA STUDIO</span>
            
            <select class="select-project" id="projectSelect" onchange="loadProjectImages(this.value)">
                <option value="">-- Chọn Project (Folder con) --</option>
            </select>
        </div>

        <div class="toolbar-right">
            <button class="tool-btn" onclick="document.getElementById('fileUpload').click()">
                <i class="fas fa-upload"></i> Tải ảnh từ máy
            </button>
            <input type="file" id="fileUpload" accept="image/*" multiple hidden onchange="handleLocalUpload(this)">

            <button class="tool-btn" onclick="openResizeModal()">
                <i class="fas fa-expand-arrows-alt"></i> Resize Page Canvas
            </button>

            <button class="tool-btn primary" onclick="exportCurrentCanvas()">
                <i class="fas fa-download"></i> Tải ảnh Canvas
            </button>
        </div>
    </div>

    <!-- KHÔNG GIAN LÀM VIỆC -->
    <div class="workspace">
        <!-- SIDEBAR DANH SÁCH LAYER / THUMBNAIL -->
        <div class="layer-sidebar">
            <div class="layer-header">
                <i class="fas fa-images"></i> Danh sách Trang / Layer (<span id="layerCount">0</span>)
            </div>
            <div class="layer-list" id="layerList">
                <div style="text-align: center; color: #999; font-size: 12px; margin-top: 20px;">Vui lòng chọn một Project để hiển thị ảnh.</div>
            </div>
        </div>

        <!-- KHU VỰC HIỂN THỊ CANVAS -->
        <div class="canvas-area" id="canvasArea">
            <div style="margin: auto; color: #999; font-size: 14px;">Chưa có trang Canvas nào được tạo.</div>
        </div>
    </div>

    <!-- MODAL THAY ĐỔI KÍCH THƯỚC (RESIZE) -->
    <div class="modal" id="resizeModal">
        <div class="modal-box">
            <div class="modal-title"><i class="fas fa-crop-alt"></i> Đổi kích thước Page Canvas</div>
            
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 1;">
                    <label>Chiều rộng (Width px)</label>
                    <input type="number" id="resizeWidth" value="1080">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Chiều cao (Height px)</label>
                    <input type="number" id="resizeHeight" value="1080">
                </div>
            </div>

            <div class="input-group">
                <label>Áp dụng cho:</label>
                <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 5px; font-size: 13px;">
                    <label style="font-weight: normal; cursor: pointer;"><input type="radio" name="resizeScope" value="current" checked> Chỉ Page Canvas hiện tại</label>
                    <label style="font-weight: normal; cursor: pointer;"><input type="radio" name="resizeScope" value="all"> Tất cả các Page trong Project</label>
                </div>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button class="tool-btn" onclick="closeResizeModal()">Hủy</button>
                <button class="tool-btn primary" onclick="applyResize()">Áp dụng</button>
            </div>
        </div>
    </div>

    <script>
        // Cấu hình URL API Apps Script của hệ thống
        const API_URL = "https://script.google.com/macros/s/AKfycbytCrAHTpFnykzOAwTkxbAR6tm32P9RZrS42EnUFh2WTWTQRtZr60Q27Lzrbhq_cuo/exec";
        const PARENT_FOLDER_ID = "11ad-tiEWqSeJdm0kv_q-_b2x0qWD9b6b";

        let projectsData = [];
        let pagesData = []; // Lưu trữ toàn bộ thông tin các page canvas
        let currentPageIndex = -1;

        // 1. NẠP DANH SÁCH PROJECT TỪ SHARED DRIVE KHI MỞ TRANG
        window.addEventListener("DOMContentLoaded", () => {
            fetchSubFolders();
        });

        function showLoader(text) {
            document.getElementById("loaderText").innerText = text;
            document.getElementById("loader").style.display = "flex";
        }

        function hideLoader() {
            document.getElementById("loader").style.display = "none";
        }

        // Lấy danh sách Folder con thông qua Google Apps Script API
        async function fetchSubFolders() {
            showLoader("Đang tải danh sách Project từ Google Drive...");
            try {
                // Gọi API lấy cấu trúc (Giả lập gọi action tương ứng hoặc quét dữ liệu trả về)
                let res = await fetch(API_URL + "?action=get_projects&parent=" + PARENT_FOLDER_ID);
                let json = await res.json();
                
                // Nếu API mặc định không có action get_projects, ta fallback tạo sẵn danh sách mẫu từ cấu trúc gốc
                let select = document.getElementById("projectSelect");
                select.innerHTML = '<option value="">-- Chọn Project (Folder con) --</option>';

                if (json.success && json.folders) {
                    projectsData = json.folders;
                    json.folders.forEach(f => {
                        select.innerHTML += `<option value="${f.id}">${f.name}</option>`;
                    });
                } else {
                    // Fallback Demo nếu API chưa cắm nhánh get_projects
                    select.innerHTML += `<option value="DEMO_FOLDER_1">Project 1 - Banner Chiến Dịch</option>`;
                    select.innerHTML += `<option value="DEMO_FOLDER_2">Project 2 - Feedback Khách Hàng</option>`;
                }
            } catch (e) {
                console.error("Lỗi khi tải thư mục:", e);
            } finally {
                hideLoader();
            }
        }

        // 2. TẢI ẢNH TỪ FOLDER ĐƯỢC CHỌN VÀ TẠO TRANG CANVAS
        async function loadProjectImages(folderId) {
            if (!folderId) return;
            showLoader("Đang tải toàn bộ ảnh và dựng Page Canvas...");
            pagesData = [];
            
            try {
                // Gọi API lấy toàn bộ file ảnh trong Folder
                let res = await fetch(`${API_URL}?action=get_images&folderId=${folderId}`);
                let json = await res.json();

                let imagesList = [];
                if (json.success && json.images) {
                    imagesList = json.images;
                } else {
                    // Giả lập ảnh hiển thị thành dạng Thumbnail API từ Drive theo tài liệu [source: 1]
                    imagesList = [
                        { id: "1aB2cD3eF4gH5iJ6kL7mN8oP9qR0sT1uV", name: "banner-chinh.jpg" },
                        { id: "2xY3zA4bC5dE6fG7hI8jK9lM0nO1pQ2rS", name: "san-pham-1.png" }
                    ];
                }

                // Xử lý từng ảnh tạo Page riêng biệt
                for (let i = 0; i < imagesList.length; i++) {
                    let imgItem = imagesList[i];
                    // Theo quy tắc API Google Drive: Thumbnail hiển thị qua endpoint /thumbnail?id= [source: 2]
                    let thumbUrl = `https://drive.google.com/thumbnail?id=${imgItem.id}&sz=w1000`;
                    
                    await addCanvasPage(imgItem.name, thumbUrl);
                }

                renderAllPages();
            } catch (e) {
                alert("Có lỗi xảy ra khi nạp ảnh từ Drive!");
            } finally {
                hideLoader();
            }
        }

        // Thêm một trang mới vào bộ nhớ Canvas
        function addCanvasPage(title, imageUrl) {
            return new Promise((resolve) => {
                let img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = () => {
                    // Tự động nhận tỷ lệ ảnh gốc để set cho Page Canvas
                    pagesData.push({
                        title: title,
                        width: img.naturalWidth || 800,
                        height: img.naturalHeight || 800,
                        layers: [imageUrl] // Ảnh đầu tiên nghiễm nhiên là Layer 1
                    });
                    resolve();
                };
                img.onerror = () => {
                    // Fallback nếu lỗi CORS hoặc link
                    pagesData.push({
                        title: title,
                        width: 800,
                        height: 800,
                        layers: [imageUrl]
                    });
                    resolve();
                };
                img.src = imageUrl;
            });
        }

        // 3. TẢI ẢNH TỪ MÁY VÀO PROJECT HIỆN TẠI
        function handleLocalUpload(input) {
            let files = Array.from(input.files);
            if (files.length === 0) return;

            showLoader("Đang nạp ảnh từ máy vào Canvas...");
            let loadedCount = 0;

            files.forEach(file => {
                let reader = new FileReader();
                reader.onload = async (e) => {
                    await addCanvasPage(file.name, e.target.result);
                    loadedCount++;
                    if (loadedCount === files.length) {
                        hideLoader();
                        renderAllPages();
                        scrollToPage(pagesData.length - 1);
                    }
                };
                reader.readAsDataURL(file);
            });
            input.value = "";
        }

        // 4. HIỂN THỊ GIAO DIỆN THUMBNAIL VÀ CANVAS CHÍNH
        function renderAllPages() {
            let layerListEl = document.getElementById("layerList");
            let canvasAreaEl = document.getElementById("canvasArea");
            document.getElementById("layerCount").innerText = pagesData.length;

            layerListEl.innerHTML = "";
            canvasAreaEl.innerHTML = "";

            if (pagesData.length === 0) {
                canvasAreaEl.innerHTML = '<div style="margin: auto; color: #999; font-size: 14px;">Chưa có trang Canvas nào được tạo.</div>';
                return;
            }

            pagesData.forEach((page, index) => {
                // Tạo Thumbnail bên tay trái
                let thumbCard = document.createElement("div");
                thumbCard.className = `thumb-card ${index === currentPageIndex ? 'active' : ''}`;
                thumbCard.onclick = () => scrollToPage(index);
                thumbCard.innerHTML = `
                    <img src="${page.layers[0]}" alt="${page.title}">
                    <span>Page ${index + 1}: ${page.title}</span>
                `;
                layerListEl.appendChild(thumbCard);

                // Tạo Khung Page Canvas chính giữa
                let pageEl = document.createElement("div");
                pageEl.className = "page-container";
                pageEl.id = `page_${index}`;
                
                pageEl.innerHTML = `
                    <div class="page-toolbar">
                        <span><i class="fas fa-file-image"></i> Trang ${index + 1} - ${page.title}</span>
                        <span>${page.width} × ${page.height} px</span>
                    </div>
                    <div class="canvas-frame" style="width: ${page.width}px; height: ${page.height}px;">
                        <img src="${page.layers[0]}" class="canvas-layer">
                    </div>
                `;
                canvasAreaEl.appendChild(pageEl);
            });

            if (currentPageIndex === -1) currentPageIndex = 0;
            highlightActiveThumb(currentPageIndex);
        }

        function scrollToPage(index) {
            currentPageIndex = index;
            highlightActiveThumb(index);
            let targetPage = document.getElementById(`page_${index}`);
            if (targetPage) {
                targetPage.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function highlightActiveThumb(index) {
            document.querySelectorAll(".thumb-card").forEach((el, i) => {
                el.classList.toggle("active", i === index);
            });
        }

        // 5. CHỨC NĂNG RESIZE PAGE CANVAS
        function openResizeModal() {
            if (pagesData.length === 0) return alert("Vui lòng tải ảnh lên trước!");
            let curr = pagesData[currentPageIndex] || pagesData[0];
            document.getElementById("resizeWidth").value = curr.width;
            document.getElementById("resizeHeight").value = curr.height;
            document.getElementById("resizeModal").style.display = "flex";
        }

        function closeResizeModal() {
            document.getElementById("resizeModal").style.display = "none";
        }

        function applyResize() {
            let newW = parseInt(document.getElementById("resizeWidth").value);
            let newH = parseInt(document.getElementById("resizeHeight").value);
            let scope = document.querySelector('input[name="resizeScope"]:checked').value;

            if (isNaN(newW) || isNaN(newH) || newW <= 0 || newH <= 0) {
                return alert("Kích thước nhập vào không hợp lệ!");
            }

            if (scope === "all") {
                // Nhập lại width/height cho toàn bộ page trong Project
                pagesData.forEach(page => {
                    page.width = newW;
                    page.height = newH;
                });
            } else {
                // Chỉ áp dụng cho page hiện tại
                if (pagesData[currentPageIndex]) {
                    pagesData[currentPageIndex].width = newW;
                    pagesData[currentPageIndex].height = newH;
                }
            }

            closeResizeModal();
            renderAllPages();
        }

        // 6. XUẤT ẢNH CANVAS HIỆN TẠI (TẢI VỀ MÁY)
        function exportCurrentCanvas() {
            if (pagesData.length === 0 || currentPageIndex === -1) return alert("Không có trang Canvas để xuất!");
            let page = pagesData[currentPageIndex];
            
            let canvas = document.createElement("canvas");
            canvas.width = page.width;
            canvas.height = page.height;
            let ctx = canvas.getContext("2d");

            let img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => {
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                let a = document.createElement("a");
                a.download = `canvas-page-${currentPageIndex + 1}.png`;
                a.href = canvas.toDataURL("image/png");
                a.click();
            };
            img.src = page.layers[0];
        }
    </script>
</body>
</html>
