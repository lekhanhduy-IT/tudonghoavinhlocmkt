<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Chỉnh Sửa Ảnh (Image Editor)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        :root { 
            --white: #ffffff; 
            --blue: #01adee; 
            --red: #db1010; 
            --gray-light: #f1f3f4; 
            --gray-border: #e0e0e0; 
            --text-main: #333333; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--gray-light); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header Toolbar */
        .toolbar { height: 50px; background: var(--white); border-bottom: 1px solid var(--gray-border); display: flex; align-items: center; padding: 0 15px; justify-content: space-between; flex-shrink: 0; }
        .toolbar-left { display: flex; gap: 10px; align-items: center; }
        .toolbar-right { display: flex; gap: 10px; }
        .btn { padding: 6px 12px; border: none; background: var(--blue); color: var(--white); border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: 500; }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background: var(--red); }
        select.project-select { padding: 6px; border: 1px solid var(--gray-border); border-radius: 4px; }

        /* Main Workspace */
        .workspace { display: flex; flex: 1; overflow: hidden; }
        
        /* Canvas Area (Left/Center) */
        .canvas-container-wrapper { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 30px; align-items: center; background: #e9ebee; }
        .page-wrapper { background: var(--white); box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 10px; border-radius: 4px; display: flex; flex-direction: column; }
        .page-title { font-weight: bold; margin-bottom: 10px; font-size: 14px; color: #555; }
        
        /* Sidebar (Right) */
        .sidebar { width: 300px; background: var(--white); border-left: 1px solid var(--gray-border); display: flex; flex-direction: column; }
        .tabs { display: flex; border-bottom: 1px solid var(--gray-border); }
        .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-weight: 500; background: #f9f9f9; border-bottom: 2px solid transparent; }
        .tab.active { background: var(--white); border-bottom: 2px solid var(--blue); color: var(--blue); }
        
        .tab-content { flex: 1; overflow-y: auto; padding: 10px; display: none; }
        .tab-content.active { display: block; }
        
        .image-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .image-item { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid var(--gray-border); }
        .image-item:hover { border-color: var(--blue); box-shadow: 0 0 5px rgba(1, 173, 238, 0.5); }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="toolbar-left">
            <select class="project-select" id="projectSelect" onchange="loadProjectPages()">
                <option value="">-- Chọn ID Bài Viết (Project) --</option>
                </select>
            <button class="btn btn-danger" onclick="deleteSelectedLayer()"><i class="fas fa-trash"></i> Xóa Layer</button>
        </div>
        <div class="toolbar-right">
            <label class="btn">
                <i class="fas fa-upload"></i> Tải ảnh lên
                <input type="file" id="uploadInput" accept="image/*" style="display: none;" onchange="handleDirectUpload(event)">
            </label>
            <button class="btn" onclick="saveAllCanvases()"><i class="fas fa-save"></i> Lưu Project</button>
        </div>
    </div>

    <div class="workspace">
        <div class="canvas-container-wrapper" id="canvasArea">
            <p style="color:#777; margin-top:20px;">Vui lòng chọn ID bài viết để tải Canvas.</p>
            </div>

        <div class="sidebar">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('uploads')">Tải lên</div>
                <div class="tab" onclick="switchTab('elements')">Elements</div>
            </div>
            
            <div id="tab-uploads" class="tab-content active">
                <div class="image-grid" id="grid-uploads">
                    </div>
            </div>
            
            <div id="tab-elements" class="tab-content">
                <div class="image-grid" id="grid-elements">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // Mảng chứa các instance của Fabric Canvas để quản lý nhiều page
        let fabricCanvases = [];
        let activeCanvas = null;

        // Giả lập Dữ liệu Bài viết (Sẽ thay thế bằng logic rút trích ảnh bìa và HTML từ sysData.sheets["Bài viết_hidden"])
        const mockProjects = {
            "ID_BAI_VIET_1": [
                { type: 'Ảnh Bìa', url: 'https://via.placeholder.com/800x400?text=Anh+Bia' },
                { type: 'Ảnh Nội Dung 1', url: 'https://via.placeholder.com/800x600?text=Anh+Noi+Dung+1' }
            ]
        };

        // Chuyển Tab Sidebar
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        // Khởi tạo Canvas khi chọn Bài viết
        function loadProjectPages() {
            const projectId = document.getElementById('projectSelect').value;
            const canvasArea = document.getElementById('canvasArea');
            canvasArea.innerHTML = "";
            fabricCanvases = [];

            if (!projectId) {
                canvasArea.innerHTML = '<p style="color:#777; margin-top:20px;">Vui lòng chọn ID bài viết để tải Canvas.</p>';
                return;
            }

            const images = mockProjects[projectId] || []; // Gọi logic parse HTML bài viết tại đây
            
            images.forEach((imgData, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'page-wrapper';
                
                const title = document.createElement('div');
                title.className = 'page-title';
                title.innerText = `Page ${index + 1}: ${imgData.type}`;
                
                const canvasEl = document.createElement('canvas');
                canvasEl.id = `canvas-page-${index}`;
                
                wrapper.appendChild(title);
                wrapper.appendChild(canvasEl);
                canvasArea.appendChild(wrapper);

                // Khởi tạo Fabric Canvas
                const fCanvas = new fabric.Canvas(canvasEl.id, {
                    width: 800,
                    height: 500,
                    backgroundColor: '#fff'
                });

                // Đặt ảnh gốc làm hình nền (Background)
                fabric.Image.fromURL(imgData.url, function(img) {
                    // Tự động scale ảnh vừa với canvas
                    const scale = Math.min(800 / img.width, 500 / img.height);
                    img.set({ originX: 'center', originY: 'center', left: 400, top: 250, scaleX: scale, scaleY: scale });
                    fCanvas.setBackgroundImage(img, fCanvas.renderAll.bind(fCanvas));
                });

                // Lắng nghe sự kiện click để biết user đang tương tác với Canvas nào
                fCanvas.on('mouse:down', function() {
                    activeCanvas = fCanvas;
                });

                fabricCanvases.push(fCanvas);
            });
            
            if (fabricCanvases.length > 0) activeCanvas = fabricCanvases[0]; // Mặc định chọn trang 1
            loadSidebarImages(projectId);
        }

        // Hàm thêm Layer Ảnh vào Canvas hiện tại
        function addImageLayer(url) {
            if (!activeCanvas) {
                alert("Vui lòng click vào trang Canvas bạn muốn thêm ảnh!");
                return;
            }
            fabric.Image.fromURL(url, function(img) {
                img.set({
                    left: 50,
                    top: 50,
                    scaleX: 0.5,
                    scaleY: 0.5,
                    cornerColor: '#01adee',
                    cornerStrokeColor: '#01adee',
                    borderColor: '#01adee',
                    transparentCorners: false
                });
                activeCanvas.add(img);
                activeCanvas.setActiveObject(img);
            }, { crossOrigin: 'anonymous' });
        }

        // Xóa Layer đang chọn
        function deleteSelectedLayer() {
            if (!activeCanvas) return;
            const activeObj = activeCanvas.getActiveObject();
            if (activeObj) {
                activeCanvas.remove(activeObj);
            }
        }

        // Tải ảnh trực tiếp từ máy (Nút Upload)
        function handleDirectUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 1. Hiển thị ngay lên Canvas (hoặc Elements Tab) bằng FileReader
            const reader = new FileReader();
            reader.onload = function(f) {
                const data = f.target.result;
                addImageLayer(data);
                
                // Thêm vào UI tab Elements tạm thời
                const imgEl = document.createElement('img');
                imgEl.src = data;
                imgEl.className = 'image-item';
                imgEl.onclick = () => addImageLayer(data);
                document.getElementById('grid-elements').prepend(imgEl);
            };
            reader.readAsDataURL(file);

            // 2. Gửi API sang Google Apps Script để lưu vào Folder Canva (Cần code thêm ở file GS)
            /*
            const base64 = data.split(',')[1];
            google.script.run.uploadImageToCanvaFolder(file.name, file.type, base64, "11ad-tiEWqSeJdm0kv_q-_b2x0qWD9b6b");
            */
        }

        // Đổ giả lập dữ liệu vào thanh Sidebar
        function loadSidebarImages(projectId) {
            const uploadGrid = document.getElementById('grid-uploads');
            const elementGrid = document.getElementById('grid-elements');
            
            uploadGrid.innerHTML = `
                <img src="https://via.placeholder.com/150/0000FF/808080 ?Text=Upload+1" class="image-item" onclick="addImageLayer(this.src)">
                <img src="https://via.placeholder.com/150/FF0000/FFFFFF ?Text=Upload+2" class="image-item" onclick="addImageLayer(this.src)">
            `;
            
            elementGrid.innerHTML = `
                <img src="https://via.placeholder.com/150/00FF00/000000 ?Text=Element+1" class="image-item" onclick="addImageLayer(this.src)">
            `;
            // Cần gọi google.script.run để get list file URL từ Google Drive dựa vào Folder ID
        }

        // Gán Mock List vào dropdown
        window.onload = () => {
            const select = document.getElementById('projectSelect');
            for (let id in mockProjects) {
                let opt = document.createElement('option');
                opt.value = id; opt.text = "Project: " + id;
                select.appendChild(opt);
            }
        };
    </script>
</body>
</html>
