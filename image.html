<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
    <title>Canva Studio - Hệ Thống MKT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --white: #ffffff;
            --blue: #01adee;
            --blue-dark: #007bb5;
            --red: #db1010;
            --gray-light: #f4f6f8;
            --gray-border: #e0e0e0;
            --text-main: #333333;
            --zoom: 1; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body { background: #e8ecef; color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* THANH CÔNG CỤ TRÊN CÙNG */
        .toolbar {
            height: 56px; background: var(--white); border-bottom: 1px solid var(--gray-border);
            display: flex; align-items: center; padding: 0 15px; justify-content: space-between; z-index: 100; flex-shrink: 0;
            gap: 10px;
        }
        .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
        
        .tool-btn {
            background: var(--white); border: 1px solid var(--gray-border); color: var(--text-main);
            padding: 6px 12px; cursor: pointer; font-size: 12px; font-weight: 600; border-radius: 6px;
            display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; outline: none; white-space: nowrap;
        }
        .tool-btn:hover, .tool-btn.active { background: #eef9fd; color: var(--blue); border-color: var(--blue); }
        .tool-btn.primary { background: var(--blue); color: var(--white); border-color: var(--blue); }
        
        .select-project {
            padding: 6px 10px; border-radius: 6px; border: 1px solid var(--gray-border);
            font-size: 12px; font-weight: bold; color: var(--blue); outline: none; min-width: 180px; cursor: pointer;
        }

        /* KHÔNG GIAN LÀM VIỆC CHÍNH */
        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* VÙNG CANVAS TRUNG TÂM */
        .canvas-area {
            flex: 1; height: 100%; overflow: auto; position: relative;
            padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 40px;
        }

        /* CHẾ ĐỘ HIỂN THỊ CANVAS */
        .canvas-area.view-vertical { flex-direction: column; align-items: center; }
        .canvas-area.view-grid {
            display: grid;
            grid-template-columns: repeat(var(--grid-cols, 3), 1fr);
            gap: 30px; align-items: start; justify-content: start; padding: 30px; align-content: start;
        }
        .canvas-area.view-horizontal { display: flex; flex-direction: column; padding: 15px; gap: 15px; }
        
        .horiz-main-stage { flex: 1; width: 100%; display: flex; justify-content: center; align-items: center; overflow: auto; min-height: 300px; }
        .horiz-thumbs-strip { height: 160px; width: 100%; background: var(--white); border-top: 1px solid var(--gray-border); display: flex; gap: 15px; padding: 15px; overflow-x: auto; flex-shrink: 0; align-items: flex-start; }
        
        .horiz-thumb-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; }
        .horiz-thumb-item { 
            border: 2px solid var(--gray-border); border-radius: 6px; cursor: pointer; 
            height: 100px; aspect-ratio: 1/1; position: relative; background: #fff; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        .horiz-thumb-item.active { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(1,173,238,0.3); }
        .thumb-canvas-inner { position: absolute; }
        .horiz-thumb-label { font-size: 11px; font-weight: bold; color: #555; }

        /* KHUNG PAGE CANVAS CÓ THỂ ZOOM */
        .page-wrapper {
            transition: transform 0.1s;
            transform-origin: top center;
            transform: scale(var(--zoom));
        }
        .page-container {
            background: #ffffff; box-shadow: 0 8px 24px rgba(0,0,0,0.15); border-radius: 4px;
            position: relative; display: flex; flex-direction: column; overflow: hidden;
        }
        .page-toolbar {
            height: 32px; background: #2f3640; color: #fff; display: flex; align-items: center;
            justify-content: space-between; padding: 0 10px; font-size: 11px; flex-shrink: 0;
        }
        .canvas-frame {
            position: relative; overflow: hidden; background: #ffffff;
        }

        /* LAYER TRONG CANVAS */
        .canvas-layer {
            position: absolute; cursor: move; transform-origin: center center;
            /* Đảm bảo Layer luôn bo sát nội dung bên trong */
            display: flex; justify-content: center; align-items: center;
        }
        .layer-content { width: 100%; height: 100%; pointer-events: none; display: flex; }
        .layer-content img, .layer-content svg { width: 100%; height: 100%; object-fit: fill; display: block; pointer-events: none;}
        
        .canvas-layer.selected { outline: 2px solid var(--blue); }
        .layer-handle {
            position: absolute; width: 12px; height: 12px; background: var(--white); border: 2px solid var(--blue);
            border-radius: 50%; z-index: 10; display: none;
        }
        .canvas-layer.selected .layer-handle { display: block; }
        .layer-handle.tl { top: -6px; left: -6px; cursor: nwse-resize; }
        .layer-handle.tr { top: -6px; right: -6px; cursor: nesw-resize; }
        .layer-handle.bl { bottom: -6px; left: -6px; cursor: nesw-resize; }
        .layer-handle.br { bottom: -6px; right: -6px; cursor: nwse-resize; }
        
        /* NÚT XOAY LAYER */
        .layer-handle.rot {
            top: -30px; left: 50%; transform: translateX(-50%); cursor: grab;
            width: 24px; height: 24px; border-radius: 50%; background: var(--white);
            color: var(--text-main); display: none; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2); border: 1px solid var(--gray-border);
        }
        .layer-handle.rot i { font-size: 12px; pointer-events: none; }
        .canvas-layer.selected .layer-handle.rot { display: flex; }

        /* MINI POPUP MENU LAYER */
        .layer-mini-menu {
            position: absolute; top: -45px; right: 0;
            background: #2f3640; border-radius: 6px; display: flex; gap: 4px; padding: 4px; z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); white-space: nowrap;
        }
        .layer-mini-menu button {
            background: transparent; border: none; color: #fff; font-size: 12px; padding: 4px 8px;
            cursor: pointer; border-radius: 3px;
        }
        .layer-mini-menu button:hover { background: var(--blue); }

        /* RIGHT SIDEBAR DỌC */
        .right-sidebar-container {
            display: flex; height: 100%; z-index: 50; flex-shrink: 0;
            border-left: 1px solid var(--gray-border); background: var(--white);
        }
        .sidebar-panel {
            width: 300px; background: var(--white); display: flex; flex-direction: column;
            transition: width 0.2s ease; overflow: hidden;
        }
        .sidebar-panel.collapsed { width: 0; border: none; opacity: 0; pointer-events: none;}

        .sidebar-icon-strip {
            width: 65px; background: #f9f9f9; border-left: 1px solid var(--gray-border);
            display: flex; flex-direction: column; align-items: center; padding-top: 15px; gap: 15px;
        }
        .icon-tab {
            width: 50px; height: 50px; border-radius: 8px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer; color: #666; font-size: 18px; transition: 0.2s;
        }
        .icon-tab span { font-size: 9px; font-weight: bold; margin-top: 3px; white-space: nowrap;}
        .icon-tab:hover, .icon-tab.active { background: #eef9fd; color: var(--blue); }

        .sidebar-panel-header {
            padding: 15px; border-bottom: 1px solid var(--gray-border);
            font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; align-items: center;
        }
        .close-panel-btn { cursor: pointer; color: #999; font-size: 14px; padding: 5px; }
        .close-panel-btn:hover { color: var(--red); }

        .tab-content { flex: 1; overflow-y: auto; padding: 15px; display: none; }
        .tab-content.active { display: flex; flex-direction: column; gap: 15px; }

        .sub-tabs { display: flex; gap: 5px; border-bottom: 1px solid var(--gray-border); padding-bottom: 8px; }
        .sub-tab-btn { font-size: 11px; padding: 5px 10px; border-radius: 4px; cursor: pointer; background: var(--gray-light); font-weight: 600; flex: 1; text-align: center; }
        .sub-tab-btn.active { background: var(--blue); color: #fff; }
        .sub-content { display: none; flex-direction: column; gap: 10px; }
        .sub-content.active { display: flex; }

        .asset-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .asset-item { border: 1px solid var(--gray-border); border-radius: 6px; padding: 6px; cursor: pointer; background: #fff; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .asset-item img, .asset-item svg { width: 100%; height: 100%; object-fit: contain; }
        .asset-item:hover { border-color: var(--blue); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        /* MODAL & LOADER */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; display: none; align-items: center; justify-content: center; }
        .modal-box { background: var(--white); padding: 20px; border-radius: 8px; width: 340px; }
        .loader-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.85); z-index: 1000; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; font-weight: bold; color: var(--blue); }
        .spinner { width: 36px; height: 36px; border: 4px solid #f3f3f3; border-top: 4px solid var(--blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <span id="loaderText">Đang tải dữ liệu...</span>
    </div>

    <div class="toolbar">
        <div class="toolbar-left">
            <select class="select-project" id="projectSelect" onchange="loadProjectImages(this.value)">
                <option value="">-- Chọn Project (Folder con) --</option>
            </select>
            <button class="tool-btn" onclick="document.getElementById('localUpload').click()"><i class="fas fa-upload"></i> Từ máy</button>
            <input type="file" id="localUpload" accept="image/*" multiple hidden onchange="handleLocalUpload(this)">
            <button class="tool-btn" onclick="openResizeModal()"><i class="fas fa-expand-arrows-alt"></i> Resize Page</button>
        </div>

        <div class="toolbar-right">
            <div style="display: flex; align-items: center; gap: 5px; margin-right: 15px; font-size: 12px; font-weight: bold;">
                <button class="tool-btn" onclick="manualZoom(-0.1)" title="Thu nhỏ"><i class="fas fa-search-minus"></i></button>
                <span id="zoomDisplay" style="min-width: 40px; text-align: center;">100%</span>
                <button class="tool-btn" onclick="manualZoom(0.1)" title="Phóng to"><i class="fas fa-search-plus"></i></button>
            </div>

            <div style="display: flex; border: 1px solid var(--gray-border); border-radius: 6px; overflow: hidden;" id="viewModeGroup">
                <button class="tool-btn active" onclick="setViewMode('vertical')" title="Cuộn Dọc"><i class="fas fa-list"></i></button>
                <button class="tool-btn" onclick="setViewMode('horizontal')" title="Trượt Ngang"><i class="fas fa-columns"></i></button>
                <button class="tool-btn" onclick="setViewMode('grid')" title="Lưới Tổng Quan"><i class="fas fa-th"></i></button>
            </div>
            
            <div id="gridZoomBar" style="display: none; align-items: center; gap: 5px; font-size: 11px; margin-left: 10px;">
                <span>Cột:</span>
                <input type="range" min="1" max="6" value="3" id="gridColSlider" oninput="setGridColumns(this.value)">
            </div>
        </div>
    </div>

    <div class="workspace" id="mainWorkspace">
        <div class="canvas-area view-vertical" id="canvasArea">
            <div style="color: #999; margin: auto; padding-top: 50px;">Vui lòng chọn Project hoặc Tải ảnh lên để bắt đầu.</div>
        </div>

        <div class="right-sidebar-container">
            <div class="sidebar-panel" id="sidebarPanel">
                <div class="sidebar-panel-header">
                    <span id="panelTitle">Tải lên</span>
                    <i class="fas fa-chevron-right close-panel-btn" onclick="toggleSidebarPanel(false)" title="Đóng panel"></i>
                </div>

                <div class="tab-content active" id="tab-upload">
                    <div style="font-size: 11px; color: #666; margin-bottom: 5px;">Ảnh từ Project & Máy tính:</div>
                    <div class="asset-grid" id="uploadAssetGrid"></div>
                </div>

                <div class="tab-content" id="tab-resource">
                    <div class="sub-tabs">
                        <div class="sub-tab-btn active" onclick="switchSubTab('res-img', this)">Ảnh Drive</div>
                        <div class="sub-tab-btn" onclick="switchSubTab('res-shape', this)">Shape</div>
                        <div class="sub-tab-btn" onclick="switchSubTab('res-frame', this)">Frame</div>
                    </div>

                    <div class="sub-content active" id="sub-res-img">
                        <button class="tool-btn primary" style="justify-content: center;" onclick="document.getElementById('resUpload').click()"><i class="fas fa-cloud-upload-alt"></i> Tải ảnh lên Drive</button>
                        <input type="file" id="resUpload" accept="image/*" multiple hidden onchange="handleResourceUpload(this)">
                        <div class="asset-grid" id="resourceImgGrid"></div>
                    </div>

                    <div class="sub-content" id="sub-res-shape">
                        <textarea id="shapeSvgInput" rows="3" placeholder="Nhập mã HTML/SVG Shape..." style="width:100%; font-size:11px; padding:5px; border-radius:4px; border:1px solid #ccc;"></textarea>
                        <button class="tool-btn primary" onclick="saveCanvaHidden('Shape', document.getElementById('shapeSvgInput').value)">Lưu & Cập nhật Shape</button>
                        <div class="asset-grid" id="resourceShapeGrid"></div>
                    </div>

                    <div class="sub-content" id="sub-res-frame">
                        <textarea id="frameSvgInput" rows="3" placeholder="Nhập mã HTML/SVG Frame..." style="width:100%; font-size:11px; padding:5px; border-radius:4px; border:1px solid #ccc;"></textarea>
                        <button class="tool-btn primary" onclick="saveCanvaHidden('Frame', document.getElementById('frameSvgInput').value)">Lưu & Cập nhật Frame</button>
                        <div class="asset-grid" id="resourceFrameGrid"></div>
                    </div>
                </div>
            </div>

            <div class="sidebar-icon-strip">
                <div class="icon-tab active" onclick="switchMainTab('upload', 'Tải lên', this)">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span>Tải lên</span>
                </div>
                <div class="icon-tab" onclick="switchMainTab('resource', 'Tài nguyên', this)">
                    <i class="fas fa-shapes"></i>
                    <span>Tài nguyên</span>
                </div>
                <div style="flex-grow:1;"></div>
                <div class="icon-tab" style="margin-bottom:15px;" onclick="toggleSidebarPanel(true)" id="btnOpenPanel" style="display:none;">
                    <i class="fas fa-chevron-left"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="resizeModal">
        <div class="modal-box">
            <h4 style="margin-bottom: 12px; font-size: 14px;">Cài đặt kích thước Canvas</h4>
            <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                <input type="number" id="resizeW" placeholder="Width (px)" style="flex:1; padding:6px; border-radius:4px; border:1px solid #ccc;">
                <input type="number" id="resizeH" placeholder="Height (px)" style="flex:1; padding:6px; border-radius:4px; border:1px solid #ccc;">
            </div>
            <div style="font-size: 12px; margin-bottom: 15px;">
                <label><input type="radio" name="rScope" value="current" checked> Chỉ thay đổi Page hiện tại</label><br>
                <label><input type="radio" name="rScope" value="all"> Thay đổi Tất cả Page</label>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button class="tool-btn" onclick="document.getElementById('resizeModal').style.display='none'">Hủy</button>
                <button class="tool-btn primary" onclick="applyResize()">Áp dụng</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbytCrAHTpFnykzOAwTkxbAR6tm32P9RZrS42EnUFh2WTWTQRtZr60Q27Lzrbhq_cuo/exec";
        
        let pagesData = []; 
        let activePageIndex = 0;
        let selectedLayer = null;
        let layerClipboard = null;
        let currentViewMode = 'vertical';
        let currentZoom = 1;

        window.addEventListener("DOMContentLoaded", () => {
            fetchSubFolders();
            fetchResourceData();
            initAdvancedPinchToZoom();

            // CLICK RA NGOÀI BỎ CHỌN LAYER
            document.getElementById("mainWorkspace").addEventListener("mousedown", (e) => {
                if(!e.target.closest(".canvas-layer")) deselectAllLayers();
            });
            document.getElementById("mainWorkspace").addEventListener("touchstart", (e) => {
                if(!e.target.closest(".canvas-layer")) deselectAllLayers();
            }, {passive: true});

            // Lắng nghe sự thay đổi kích thước cửa sổ để vẽ lại Lưới
            window.addEventListener('resize', updateGridScale);
        });

        function showLoader(text) { document.getElementById("loaderText").innerText = text; document.getElementById("loader").style.display = "flex"; }
        function hideLoader() { document.getElementById("loader").style.display = "none"; }

        function deselectAllLayers() {
            document.querySelectorAll(".canvas-layer").forEach(el => {
                el.classList.remove("selected");
                let menu = el.querySelector(".layer-mini-menu");
                if(menu) menu.style.display = "none";
            });
            selectedLayer = null;
        }

        /* ================= QUẢN LÝ MENU & SIDEBAR ================= */
        function toggleSidebarPanel(forceOpen) {
            const panel = document.getElementById("sidebarPanel");
            if(forceOpen || panel.classList.contains("collapsed")) {
                panel.classList.remove("collapsed");
                document.getElementById("btnOpenPanel").style.display = "none";
            } else {
                panel.classList.add("collapsed");
                document.getElementById("btnOpenPanel").style.display = "flex";
            }
        }

        function switchMainTab(tabId, title, btn) {
            toggleSidebarPanel(true);
            document.getElementById("panelTitle").innerText = title;
            document.querySelectorAll(".sidebar-icon-strip .icon-tab").forEach(b => b.classList.remove("active"));
            document.querySelectorAll(".sidebar-panel .tab-content").forEach(c => c.classList.remove("active"));
            btn.classList.add("active"); 
            document.getElementById(`tab-${tabId}`).classList.add("active");
        }

        function switchSubTab(subId, btn) {
            document.querySelectorAll(".sub-tabs .sub-tab-btn").forEach(b => b.classList.remove("active"));
            document.querySelectorAll("#tab-resource .sub-content").forEach(c => c.classList.remove("active"));
            btn.classList.add("active"); 
            document.getElementById(`sub-${subId}`).classList.add("active");
        }

        /* ================= TẢI DỮ LIỆU TỪ SHEET & DRIVE ================= */
        async function fetchSubFolders() {
            try {
                let res = await fetch(`${API_URL}?action=get_projects`);
                let json = await res.json();
                let select = document.getElementById("projectSelect");
                if (json.success && json.folders) {
                    json.folders.forEach(f => select.innerHTML += `<option value="${f.id}">${f.name}</option>`);
                }
            } catch(e) {}
        }

        async function fetchResourceData() {
            try {
                let res = await fetch(`${API_URL}?action=get_canva_resources`);
                let json = await res.json();
                if (json.success) {
                    renderAssetGrid("resourceImgGrid", json.images, 'img');
                    renderAssetGrid("resourceShapeGrid", json.shapes, 'svg');
                    renderAssetGrid("resourceFrameGrid", json.frames, 'svg');
                }
            } catch(e) {}
        }

        function renderAssetGrid(containerId, list, type) {
            let el = document.getElementById(containerId);
            el.innerHTML = "";
            (list || []).forEach(item => {
                let div = document.createElement("div");
                div.className = "asset-item";
                let content = type === 'img' ? `<img src="https://drive.google.com/thumbnail?id=${item.id}&sz=w1000">` : item.code;
                div.innerHTML = content;
                div.onclick = () => addLayerToActivePage(content);
                el.appendChild(div);
            });
        }

        /* ================= LOAD HÌNH ẢNH & CANVAS ================= */
        async function loadProjectImages(folderId) {
            if (!folderId) return;
            showLoader("Đang nạp ảnh Project...");
            pagesData = [];
            document.getElementById("uploadAssetGrid").innerHTML = "";
            try {
                let res = await fetch(`${API_URL}?action=get_images&folderId=${folderId}`);
                let json = await res.json();
                if (json.success && json.images) {
                    for (let img of json.images) {
                        let thumbUrl = `https://drive.google.com/thumbnail?id=${img.id}&sz=w1000`;
                        await createPageFromImage(img.name, thumbUrl);
                    }
                }
                renderAllPages();
            } finally { hideLoader(); }
        }

        function handleLocalUpload(input) {
            Array.from(input.files).forEach(file => {
                let reader = new FileReader();
                reader.onload = async (e) => {
                    await createPageFromImage(file.name, e.target.result);
                    renderAllPages();
                };
                reader.readAsDataURL(file);
            });
        }

        function createPageFromImage(title, url) {
            return new Promise(resolve => {
                let img = new Image();
                img.onload = () => {
                    let canvasW = 800; 
                    let canvasH = 800;
                    
                    let page = { id: Date.now() + Math.random(), title, width: canvasW, height: canvasH, layers: [] };
                    pagesData.push(page);
                    addAssetToUploadTab(url);
                    
                    let imgRatio = img.naturalWidth / img.naturalHeight;
                    let layerW = canvasW * 0.8; 
                    let layerH = layerW / imgRatio;
                    
                    if (layerH > canvasH * 0.8) {
                        layerH = canvasH * 0.8;
                        layerW = layerH * imgRatio;
                    }
                    
                    let startX = (canvasW - layerW) / 2;
                    let startY = (canvasH - layerH) / 2;

                    addLayerToPage(pagesData.length - 1, `<img src="${url}">`, startX, startY, layerW, layerH);
                    resolve();
                };
                img.onerror = () => { console.error("Không thể tải ảnh: ", url); resolve(); };
                img.src = url;
            });
        }

        function addAssetToUploadTab(url) {
            let grid = document.getElementById("uploadAssetGrid");
            let div = document.createElement("div");
            div.className = "asset-item";
            div.innerHTML = `<img src="${url}">`;
            div.onclick = () => addLayerToActivePage(`<img src="${url}">`);
            grid.appendChild(div);
        }

        /* ================= RENDER CANVAS & VIEW MODES ================= */
        function renderAllPages() {
            let area = document.getElementById("canvasArea");
            area.innerHTML = "";
            if (pagesData.length === 0) {
                area.innerHTML = `<div style="color:#999; margin:auto; padding-top:50px;">Chưa có trang canvas nào.</div>`;
                return;
            }

            if (currentViewMode === 'horizontal') {
                renderHorizontalMode(area);
            } else if (currentViewMode === 'grid') {
                pagesData.forEach((page, idx) => {
                    let pEl = createPageDOM(page, idx);
                    area.appendChild(pEl);
                });
                updateGridScale(); // Tự tính toán scale để nhét vừa cột
            } else {
                pagesData.forEach((page, idx) => {
                    let pEl = createPageDOM(page, idx);
                    area.appendChild(pEl);
                });
            }
        }

        function createPageDOM(page, idx) {
            let wrapper = document.createElement("div");
            wrapper.className = "page-wrapper";
            wrapper.id = `wrapper_${page.id}`;
            // Chỉ apply zoom bằng biến CSS khi ở chế độ cuộn dọc
            if (currentViewMode === 'vertical') {
                wrapper.style.transform = `scale(var(--zoom))`;
            }
            
            let pEl = document.createElement("div");
            pEl.className = "page-container";
            pEl.onclick = () => activePageIndex = idx;
            pEl.innerHTML = `
                <div class="page-toolbar"><span>Trang ${idx+1}: ${page.title}</span><span>${page.width}x${page.height}</span></div>
                <div class="canvas-frame" style="width:${page.width}px; height:${page.height}px;" id="frame_${page.id}"></div>
            `;
            let frame = pEl.querySelector(".canvas-frame");
            page.layers.forEach(layer => frame.appendChild(layer.dom));
            
            wrapper.appendChild(pEl);
            return wrapper;
        }

        function renderHorizontalMode(area) {
            let mainStage = document.createElement("div"); mainStage.className = "horiz-main-stage";
            let strip = document.createElement("div"); strip.className = "horiz-thumbs-strip";
            
            let activePage = pagesData[activePageIndex] || pagesData[0];
            mainStage.appendChild(createPageDOM(activePage, activePageIndex));

            pagesData.forEach((p, idx) => {
                let thumbWrap = document.createElement("div");
                thumbWrap.className = "horiz-thumb-wrapper";
                
                let thumb = document.createElement("div");
                thumb.className = `horiz-thumb-item ${idx === activePageIndex ? 'active' : ''}`;
                thumb.onclick = () => { activePageIndex = idx; renderAllPages(); };
                
                let thumbCanvas = document.createElement("div");
                thumbCanvas.id = `thumb_canvas_${idx}`;
                thumbCanvas.className = "thumb-canvas-inner";
                thumb.appendChild(thumbCanvas);

                let label = document.createElement("div");
                label.className = "horiz-thumb-label";
                label.innerText = `Trang ${idx + 1}`;

                thumbWrap.appendChild(thumb);
                thumbWrap.appendChild(label);
                strip.appendChild(thumbWrap);
            });
            area.appendChild(mainStage); 
            area.appendChild(strip);
            
            // Render bản xem trước vào thumbnail
            setTimeout(() => { pagesData.forEach((p, i) => syncThumbnail(i)); }, 50);
        }

        /* HÀM ĐỒNG BỘ THUMBNAIL REALTIME */
        function syncThumbnail(pageIdx) {
            if (currentViewMode !== 'horizontal') return;
            let thumbInner = document.getElementById(`thumb_canvas_${pageIdx}`);
            let sourceFrame = document.getElementById(`frame_${pagesData[pageIdx].id}`);
            let thumbItem = thumbInner?.parentElement;
            
            if(thumbInner && sourceFrame && thumbItem) {
                thumbInner.innerHTML = sourceFrame.innerHTML;
                thumbInner.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
                thumbInner.querySelectorAll('.layer-handle, .layer-mini-menu').forEach(el => el.remove());
                
                let scale = thumbItem.clientWidth / pagesData[pageIdx].width;
                thumbInner.style.transform = `scale(${scale})`;
                thumbInner.style.transformOrigin = 'top left';
                thumbInner.style.width = `${pagesData[pageIdx].width}px`;
                thumbInner.style.height = `${pagesData[pageIdx].height}px`;
            }
        }

        /* TÍNH TOÁN SCALE CHO LƯỚI GRID ĐỂ KHÔNG BỊ TRÀN */
        function updateGridScale() {
            if(currentViewMode !== 'grid') return;
            let area = document.getElementById("canvasArea");
            let cols = parseInt(getComputedStyle(area).getPropertyValue('--grid-cols')) || 3;
            let gap = 30;
            let padding = 60; // 30px padding left + 30px right
            
            let availableWidth = area.clientWidth - padding - (gap * (cols - 1));
            let cellWidth = availableWidth / cols;

            pagesData.forEach(p => {
                let wrapper = document.getElementById(`wrapper_${p.id}`);
                if(wrapper) {
                    let scale = cellWidth / p.width;
                    wrapper.style.transform = `scale(${scale})`;
                    wrapper.style.transformOrigin = "top left";
                    // Thu gọn không gian dư thừa do scale
                    wrapper.style.marginBottom = `-${p.height * (1 - scale)}px`;
                    wrapper.style.marginRight = `-${p.width * (1 - scale)}px`;
                }
            });
        }

        /* ================= TƯƠNG TÁC LỚP LAYER ================= */
        function addLayerToActivePage(content) {
            if (pagesData.length === 0) return;
            let page = pagesData[activePageIndex];
            let defW = page.width * 0.4;
            let defH = page.height * 0.4;
            addLayerToPage(activePageIndex, content, (page.width-defW)/2, (page.height-defH)/2, defW, defH);
            syncThumbnail(activePageIndex);
        }

        function addLayerToPage(pageIdx, content, x, y, w, h) {
            let page = pagesData[pageIdx];
            let layerDom = document.createElement("div");
            layerDom.className = "canvas-layer";
            layerDom.style.left = `${x}px`; layerDom.style.top = `${y}px`;
            layerDom.style.width = `${w}px`; layerDom.style.height = `${h}px`;
            layerDom.dataset.rotation = 0;
            
            layerDom.innerHTML = `
                <div class="layer-content">${content}</div>
                <div class="layer-handle tl" data-handle="tl"></div><div class="layer-handle tr" data-handle="tr"></div>
                <div class="layer-handle bl" data-handle="bl"></div><div class="layer-handle br" data-handle="br"></div>
                <div class="layer-handle rot" data-handle="rot"><i class="fas fa-sync-alt"></i></div>
                <div class="layer-mini-menu" style="display:none;">
                    <button onclick="copyLayer()"><i class="fas fa-copy"></i></button>
                    <button onclick="pasteLayer()"><i class="fas fa-paste"></i></button>
                    <button onclick="deleteLayer(this)"><i class="fas fa-trash"></i></button>
                </div>
            `;

            let layerObj = { id: Date.now(), dom: layerDom, content };
            page.layers.push(layerObj);

            let frame = document.getElementById(`frame_${page.id}`);
            if (frame) frame.appendChild(layerDom);
            makeLayerInteractive(layerDom, pageIdx, layerObj);
        }

        function makeLayerInteractive(dom, pageIdx, layerObj) {
            dom.addEventListener("mousedown", (e) => {
                e.stopPropagation();
                selectLayer(dom);
                activePageIndex = pageIdx;

                let handle = e.target.getAttribute("data-handle");
                if (handle === 'rot') startRotate(e, dom);
                else if (handle) startResize(e, dom, handle);
                else startMove(e, dom);
            });
            dom.addEventListener("touchstart", (e) => {
                if(e.touches.length === 1) {
                    e.stopPropagation();
                    selectLayer(dom);
                    activePageIndex = pageIdx;
                    let handle = e.target.getAttribute("data-handle");
                    if (handle === 'rot') startRotate(e.touches[0], dom, true);
                    else if (handle) startResize(e.touches[0], dom, handle, true);
                    else startMove(e.touches[0], dom, true);
                }
            }, {passive: false});
        }

        function selectLayer(dom) {
            deselectAllLayers();
            dom.classList.add("selected");
            dom.querySelector(".layer-mini-menu").style.display = "flex";
            selectedLayer = dom;
        }

        /* LOGIC KÉO DI CHUYỂN */
        function startMove(e, dom, isTouch=false) {
            let startX = e.clientX;
            let startY = e.clientY;
            let origLeft = dom.offsetLeft;
            let origTop = dom.offsetTop;
            
            // Cần lấy scale hiện tại của Grid hoặc Vertical
            let scaleFactor = currentViewMode === 'vertical' ? currentZoom : 
                              (currentViewMode === 'grid' ? getGridScaleFactor(dom) : 1);

            function onMove(ev) {
                let clientX = isTouch ? ev.touches[0].clientX : ev.clientX;
                let clientY = isTouch ? ev.touches[0].clientY : ev.clientY;
                let dx = (clientX - startX) / scaleFactor;
                let dy = (clientY - startY) / scaleFactor;
                dom.style.left = `${origLeft + dx}px`;
                dom.style.top = `${origTop + dy}px`;
            }
            function onUp() { 
                window.removeEventListener(isTouch?"touchmove":"mousemove", onMove); 
                window.removeEventListener(isTouch?"touchend":"mouseup", onUp); 
                syncThumbnail(activePageIndex);
            }
            window.addEventListener(isTouch?"touchmove":"mousemove", onMove, {passive:false}); 
            window.addEventListener(isTouch?"touchend":"mouseup", onUp);
        }

        /* LOGIC THAY ĐỔI KÍCH THƯỚC */
        function startResize(e, dom, handle, isTouch=false) {
            let startX = e.clientX, startY = e.clientY;
            let origX = dom.offsetLeft, origY = dom.offsetTop;
            let origW = dom.offsetWidth, origH = dom.offsetHeight;
            let anchorX = (handle.includes("l")) ? origX + origW : origX;
            let anchorY = (handle.includes("t")) ? origY + origH : origY;
            
            let scaleFactor = currentViewMode === 'vertical' ? currentZoom : 
                              (currentViewMode === 'grid' ? getGridScaleFactor(dom) : 1);

            function onMove(ev) {
                let clientX = isTouch ? ev.touches[0].clientX : ev.clientX;
                let clientY = isTouch ? ev.touches[0].clientY : ev.clientY;
                
                let dx = (clientX - startX) / scaleFactor; 
                let dy = (clientY - startY) / scaleFactor;
                
                let newW, newH, newX, newY;

                if (handle === 'br') { newW = origW + dx; newH = origH + dy; newX = origX; newY = origY; }
                else if (handle === 'bl') { newW = origW - dx; newH = origH + dy; newX = anchorX - newW; newY = origY; }
                else if (handle === 'tr') { newW = origW + dx; newH = origH - dy; newX = origX; newY = anchorY - newH; }
                else if (handle === 'tl') { newW = origW - dx; newH = origH - dy; newX = anchorX - newW; newY = anchorY - newH; }

                if (newW > 20) { dom.style.width = `${newW}px`; dom.style.left = `${newX}px`; }
                if (newH > 20) { dom.style.height = `${newH}px`; dom.style.top = `${newY}px`; }
            }
            function onUp() { 
                window.removeEventListener(isTouch?"touchmove":"mousemove", onMove); 
                window.removeEventListener(isTouch?"touchend":"mouseup", onUp); 
                syncThumbnail(activePageIndex);
            }
            window.addEventListener(isTouch?"touchmove":"mousemove", onMove, {passive:false}); 
            window.addEventListener(isTouch?"touchend":"mouseup", onUp);
        }

        /* LOGIC XOAY LAYER (ROTATION) */
        function startRotate(e, dom, isTouch=false) {
            let rect = dom.getBoundingClientRect();
            let centerX = rect.left + rect.width / 2;
            let centerY = rect.top + rect.height / 2;

            function onMove(ev) {
                let clientX = isTouch ? ev.touches[0].clientX : ev.clientX;
                let clientY = isTouch ? ev.touches[0].clientY : ev.clientY;
                
                let radians = Math.atan2(clientY - centerY, clientX - centerX);
                let degrees = (radians * (180 / Math.PI)) + 90; // Cộng 90 vì handle nằm ở TOP
                
                dom.dataset.rotation = degrees;
                dom.style.transform = `rotate(${degrees}deg)`;
            }
            function onUp() { 
                window.removeEventListener(isTouch?"touchmove":"mousemove", onMove); 
                window.removeEventListener(isTouch?"touchend":"mouseup", onUp); 
                syncThumbnail(activePageIndex);
            }
            window.addEventListener(isTouch?"touchmove":"mousemove", onMove, {passive:false}); 
            window.addEventListener(isTouch?"touchend":"mouseup", onUp);
        }

        function getGridScaleFactor(dom) {
            let wrapper = dom.closest('.page-wrapper');
            if(!wrapper) return 1;
            // Bóc tách giá trị scale từ thuộc tính transform
            let transform = wrapper.style.transform;
            let match = transform.match(/scale\(([^)]+)\)/);
            return match ? parseFloat(match[1]) : 1;
        }

        function copyLayer() { if (selectedLayer) layerClipboard = selectedLayer.querySelector(".layer-content").innerHTML; }
        function pasteLayer() { if (layerClipboard) addLayerToActivePage(layerClipboard); }
        function deleteLayer(btn) { 
            btn.closest(".canvas-layer").remove(); 
            syncThumbnail(activePageIndex); 
        }

        /* ================= KIỂM SOÁT VIEW VÀ ZOOM ================= */
        function openResizeModal() { 
            let p = pagesData[activePageIndex];
            if(p){
                document.getElementById("resizeW").value = p.width;
                document.getElementById("resizeH").value = p.height;
            }
            document.getElementById("resizeModal").style.display = "flex"; 
        }
        
        function applyResize() {
            let w = parseInt(document.getElementById("resizeW").value);
            let h = parseInt(document.getElementById("resizeH").value);
            if(!w || !h) return;
            let scope = document.querySelector('input[name="rScope"]:checked').value;
            if (scope === 'all') pagesData.forEach(p => { p.width = w; p.height = h; });
            else if (pagesData[activePageIndex]) { pagesData[activePageIndex].width = w; pagesData[activePageIndex].height = h; }
            document.getElementById("resizeModal").style.display = "none";
            renderAllPages();
        }

        function setViewMode(mode) {
            currentViewMode = mode;
            let area = document.getElementById("canvasArea");
            
            // Xóa transform inline nếu rời khỏi Grid
            if(mode !== 'grid') {
                document.querySelectorAll(".page-wrapper").forEach(w => {
                    w.style.transform = `scale(var(--zoom))`;
                    w.style.margin = '0';
                });
            }

            area.className = `canvas-area view-${mode}`;
            document.querySelectorAll("#viewModeGroup .tool-btn").forEach(b => b.classList.remove("active"));
            document.querySelector(`#viewModeGroup button[onclick="setViewMode('${mode}')"]`).classList.add("active");
            document.getElementById("gridZoomBar").style.display = mode === 'grid' ? 'flex' : 'none';
            renderAllPages();
        }

        function setGridColumns(cols) { 
            document.getElementById("canvasArea").style.setProperty('--grid-cols', cols); 
            updateGridScale();
        }

        function manualZoom(delta) {
            if(currentViewMode === 'grid') return; // Lưới dùng zoom bằng chỉnh cột
            currentZoom = Math.max(0.1, Math.min(3, currentZoom + delta));
            applyGlobalZoom();
        }

        function applyGlobalZoom() {
            document.documentElement.style.setProperty('--zoom', currentZoom);
            document.getElementById("zoomDisplay").innerText = Math.round(currentZoom * 100) + "%";
        }

        /* XỬ LÝ PINCH TO ZOOM NÂNG CAO (CHO CANVAS VÀ GRID) */
        function initAdvancedPinchToZoom() {
            let initialDist = null;
            let initialZoom = 1;
            let initialCols = 3;
            let canvasArea = document.getElementById("canvasArea");

            canvasArea.addEventListener('wheel', (e) => {
                if(e.ctrlKey) {
                    e.preventDefault();
                    if(currentViewMode === 'grid') return;
                    let delta = e.deltaY > 0 ? -0.05 : 0.05;
                    manualZoom(delta);
                }
            }, {passive: false});

            canvasArea.addEventListener('touchstart', e => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    initialZoom = currentZoom;
                    initialCols = parseInt(document.getElementById("gridColSlider").value);
                }
            }, {passive: false});

            canvasArea.addEventListener('touchmove', e => {
                if (initialDist && e.touches.length === 2) {
                    e.preventDefault();
                    let dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    
                    if(currentViewMode === 'grid') {
                        let diff = Math.round((initialDist - dist) / 60); 
                        let cols = Math.min(6, Math.max(1, initialCols + diff));
                        document.getElementById("gridColSlider").value = cols;
                        setGridColumns(cols);
                    } else {
                        let zoomFactor = dist / initialDist;
                        currentZoom = Math.max(0.1, Math.min(3, initialZoom * zoomFactor));
                        applyGlobalZoom();
                    }
                }
            }, {passive: false});

            canvasArea.addEventListener('touchend', () => { initialDist = null; });
        }

        /* ================= GỬI DATA VỀ APPS SCRIPT ================= */
        async function handleResourceUpload(input) {
            let file = input.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = async (e) => {
                showLoader("Đang tải ảnh lên Shared Drive...");
                await fetch(API_URL, {
                    method: 'POST', body: JSON.stringify({ action: "UPLOAD_RESOURCE_IMAGE", base64: e.target.result, fileName: file.name })
                });
                hideLoader(); fetchResourceData();
            };
            reader.readAsDataURL(file);
        }

        async function saveCanvaHidden(type, code) {
            if (!code.trim()) return alert("Vui lòng nhập mã SVG/HTML");
            showLoader("Đang lưu vào Sheet Canva_hidden...");
            try {
                let response = await fetch(API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: "SAVE_CANVA_HIDDEN", type: type, code: code }) 
                });
                let result = await response.json();
                if(result.success) {
                    document.getElementById(type === 'Shape' ? 'shapeSvgInput' : 'frameSvgInput').value = '';
                    fetchResourceData(); 
                } else {
                    alert("Có lỗi xảy ra khi lưu: " + result.error);
                }
            } catch(e) {
                alert("Lỗi kết nối mạng!");
            }
            hideLoader(); 
        }
    </script>
</body>
