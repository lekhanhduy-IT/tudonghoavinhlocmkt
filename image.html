<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trình Chỉnh Sửa Hình Ảnh (Canva Clone)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --white: #ffffff; --blue: #01adee; --red: #db1010; 
            --gray-light: #f4f6f8; --gray-border: #e0e0e0; --text-main: #333333; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body { background: var(--gray-light); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* TOOLBAR */
        .toolbar { height: 55px; background: var(--white); border-bottom: 1px solid var(--gray-border); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; z-index: 100; flex-shrink: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .tool-group { display: flex; align-items: center; gap: 10px; }
        .tool-btn { background: var(--white); border: 1px solid var(--gray-border); color: var(--text-main); padding: 6px 15px; cursor: pointer; font-size: 13px; font-weight: bold; border-radius: 4px; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; outline: none; }
        .tool-btn:hover, .tool-btn.active { background: var(--gray-light); border-color: var(--blue); color: var(--blue); }
        .tool-btn.primary { background: var(--blue); color: var(--white); border-color: var(--blue); }
        .tool-select { padding: 6px 10px; border: 1px solid var(--gray-border); border-radius: 4px; font-size: 13px; outline: none; min-width: 150px; }

        /* MAIN CONTAINER */
        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* WORKSPACE */
        .workspace-wrapper { flex: 1; display: flex; flex-direction: column; position: relative; background: #e9ecef; }
        .workspace { flex: 1; position: relative; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: 40px; touch-action: none; }
        .workspace-scaler { transform-origin: top center; transition: transform 0.1s; display: flex; flex-direction: column; gap: 40px; align-items: center; width: 100%; position: relative;}
        
        /* VIEW MODES */
        .mode-horizontal .cv-page-wrap { display: none; }
        .mode-horizontal .cv-page-wrap.active-wrap { display: block; margin: auto; }
        .mode-grid { display: grid !important; gap: 20px !important; width: auto !important; margin: 0 auto; justify-content: center; }

        /* CANVAS PAGE */
        .cv-page-wrap { position: relative; }
        .cv-page { background: var(--white); box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: relative; overflow: hidden; margin: 0 auto; transition: box-shadow 0.2s; }
        .cv-page.active-page { box-shadow: 0 0 0 2px var(--blue), 0 8px 30px rgba(1, 173, 238, 0.2); }
        .cv-page-label { position: absolute; top: -25px; left: 0; font-size: 12px; color: #777; font-weight: bold; }
        
        /* LAYERS */
        .cv-layer { position: absolute; cursor: move; transform-origin: center center; }
        .cv-layer img, .cv-layer svg { width: 100%; height: 100%; display: block; pointer-events: none; object-fit: fill; }
        
        /* BOUNDING BOX (SELECTION) nằm ngoài cùng để không bị crop bởi overflow:hidden của page */
        .cv-selection { position: absolute; border: 1.5px solid var(--blue); pointer-events: none; z-index: 9999; display: none; transform-origin: center center; }
        .cv-handle { position: absolute; width: 12px; height: 12px; background: var(--white); border: 1.5px solid var(--blue); border-radius: 50%; pointer-events: auto; }
        /* 8 Handles */
        .cv-handle.nw { top: -6px; left: -6px; cursor: nwse-resize; }
        .cv-handle.ne { top: -6px; right: -6px; cursor: nesw-resize; }
        .cv-handle.sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
        .cv-handle.se { bottom: -6px; right: -6px; cursor: nwse-resize; }
        .cv-handle.n { top: -6px; left: calc(50% - 6px); cursor: ns-resize; border-radius: 2px; width: 16px; height: 8px; margin-left:-2px;}
        .cv-handle.s { bottom: -6px; left: calc(50% - 6px); cursor: ns-resize; border-radius: 2px; width: 16px; height: 8px; margin-left:-2px;}
        .cv-handle.e { top: calc(50% - 6px); right: -6px; cursor: ew-resize; border-radius: 2px; height: 16px; width: 8px; margin-top:-2px;}
        .cv-handle.w { top: calc(50% - 6px); left: -6px; cursor: ew-resize; border-radius: 2px; height: 16px; width: 8px; margin-top:-2px;}
        
        .cv-handle.rotate { bottom: -35px; left: calc(50% - 6px); cursor: crosshair; }
        
        /* MINI CONTEXT MENU */
        .cv-mini-menu { position: absolute; top: -45px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 5px; border-radius: 6px; display: flex; gap: 5px; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .cv-mini-btn { background: transparent; border: none; color: #fff; padding: 5px 8px; cursor: pointer; border-radius: 4px; font-size: 12px; }
        .cv-mini-btn:hover { background: rgba(255,255,255,0.2); }

        /* VIEW CONTROLS (BOTTOM BAR) */
        .view-controls { height: 50px; background: var(--white); border-top: 1px solid var(--gray-border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; flex-shrink: 0; }
        .thumbnails-strip { display: none; gap: 10px; overflow-x: auto; padding: 5px; flex: 1; margin: 0 20px; }
        .thumb-item { width: 50px; height: 50px; background: #eee; border: 2px solid transparent; border-radius: 4px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #999; overflow:hidden;}
        .thumb-item.active { border-color: var(--blue); }
        .thumb-item canvas { width: 100%; height: 100%; object-fit: contain; }
        
        .grid-slider { display: none; align-items: center; gap: 10px; }

        /* RIGHT SIDEBAR */
        .sidebar { width: 320px; background: var(--white); border-left: 1px solid var(--gray-border); display: flex; flex-direction: column; z-index: 50; }
        .sb-tabs { display: flex; border-bottom: 1px solid var(--gray-border); background: var(--gray-light); }
        .sb-tab { flex: 1; text-align: center; padding: 12px 0; cursor: pointer; font-size: 12px; font-weight: bold; color: #666; border-bottom: 2px solid transparent; }
        .sb-tab.active { color: var(--blue); border-bottom-color: var(--blue); background: var(--white); }
        .sb-content { flex: 1; overflow-y: auto; padding: 15px; display: none; }
        .sb-content.active { display: block; }
        .sub-tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .sub-tab { padding: 5px 10px; font-size: 11px; cursor: pointer; border-radius: 15px; background: #eee; color: #555; }
        .sub-tab.active { background: var(--blue); color: #fff; }
        .grid-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .grid-item { border: 1px solid var(--gray-border); border-radius: 6px; padding: 5px; cursor: pointer; transition: 0.2s; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #fdfdfd; overflow: hidden; }
        .grid-item:hover { border-color: var(--blue); box-shadow: 0 2px 8px rgba(1,173,238,0.2); transform: translateY(-2px); }
        .grid-item img, .grid-item svg { max-width: 100%; max-height: 100%; object-fit: contain; }
        .input-group { margin-bottom: 15px; display: none; }
        .input-group.active { display: block; }
        textarea.sb-input { width: 100%; height: 80px; padding: 8px; border: 1px solid var(--gray-border); border-radius: 4px; resize: none; font-family: monospace; font-size: 11px; margin-bottom: 5px; }
        
        #loader { position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; color: var(--blue); display: none; }
    </style>
</head>
<body>

    <div id="loader"><i class="fas fa-spinner fa-spin fa-3x" style="margin-bottom: 10px;"></i> Đang xử lý...</div>

    <div class="toolbar">
        <div class="tool-group">
            <span style="font-weight: 900; color: var(--blue); margin-right: 10px;"><i class="fas fa-paint-brush"></i> STUDIO</span>
            <select id="projectSelect" class="tool-select" onchange="loadProject(this.value)">
                <option value="">-- Chọn Project (Thư mục) --</option>
            </select>
            <button class="tool-btn primary" onclick="document.getElementById('localUpload').click()">
                <i class="fas fa-upload"></i> Tải ảnh lên
            </button>
            <input type="file" id="localUpload" accept="image/*" multiple style="display:none" onchange="handleLocalUpload(event)">
        </div>
        <div class="tool-group">
            <span style="font-size: 12px; color: #777;">Thu phóng: <span id="zoomLabel">100%</span></span>
            <button class="tool-btn" onclick="resizeCanvasPrompt()"><i class="fas fa-compress-arrows-alt"></i> Đổi kích cỡ Page</button>
        </div>
    </div>

    <div class="main-container">
        
        <div class="workspace-wrapper">
            <div class="workspace" id="workspace">
                <div class="workspace-scaler" id="wsScaler">
                    <div style="color: #999; margin-top: 100px;" id="emptyMsg">Vui lòng chọn Project từ thanh công cụ để bắt đầu.</div>
                </div>
                
                <div id="selectionBox" class="cv-selection">
                    <div class="cv-mini-menu">
                        <button class="cv-mini-btn" onclick="layerAction('copy')" title="Sao chép"><i class="fas fa-copy"></i></button>
                        <button class="cv-mini-btn" onclick="layerAction('cut')" title="Cắt"><i class="fas fa-cut"></i></button>
                        <button class="cv-mini-btn" onclick="layerAction('delete')" title="Xóa"><i class="fas fa-trash" style="color:#ff4d4f;"></i></button>
                    </div>
                    <div class="cv-handle nw" data-dir="nw"></div>
                    <div class="cv-handle n" data-dir="n"></div>
                    <div class="cv-handle ne" data-dir="ne"></div>
                    <div class="cv-handle e" data-dir="e"></div>
                    <div class="cv-handle se" data-dir="se"></div>
                    <div class="cv-handle s" data-dir="s"></div>
                    <div class="cv-handle sw" data-dir="sw"></div>
                    <div class="cv-handle w" data-dir="w"></div>
                    <div class="cv-handle rotate" data-dir="rotate"><i class="fas fa-sync-alt" style="position:absolute; top:-16px; left:-2px; color:var(--blue); font-size:12px; pointer-events:none;"></i></div>
                </div>
            </div>

            <div class="view-controls">
                <div class="tool-group">
                    <button class="tool-btn active" id="btnViewV" onclick="setViewMode('vertical')" title="Cuộn dọc"><i class="fas fa-arrows-alt-v"></i></button>
                    <button class="tool-btn" id="btnViewH" onclick="setViewMode('horizontal')" title="Cuộn ngang"><i class="fas fa-arrows-alt-h"></i></button>
                    <button class="tool-btn" id="btnViewG" onclick="setViewMode('grid')" title="Dạng lưới"><i class="fas fa-th"></i></button>
                </div>
                
                <div class="thumbnails-strip" id="thumbStrip"></div>
                
                <div class="grid-slider" id="gridSliderWrap">
                    <span style="font-size:11px; color:#777;">Cột lưới:</span>
                    <input type="range" id="gridColsSlider" min="1" max="5" value="2" oninput="updateGridCols(this.value)">
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="sb-tabs">
                <div class="sb-tab active" onclick="switchMainTab('uploads')">DỰ ÁN HIỆN TẠI</div>
                <div class="sb-tab" onclick="switchMainTab('resources')">TÀI NGUYÊN</div>
            </div>
            
            <div id="tab-uploads" class="sb-content active">
                <div style="font-size: 11px; margin-bottom: 10px; color: #777;">Ảnh trong thư mục Project:</div>
                <div class="grid-list" id="projectImagesGrid"></div>
            </div>

            <div id="tab-resources" class="sb-content">
                <div class="sub-tabs">
                    <div class="sub-tab active" onclick="switchSubTab('res-img')">Ảnh</div>
                    <div class="sub-tab" onclick="switchSubTab('res-shape')">Shape</div>
                    <div class="sub-tab" onclick="switchSubTab('res-frame')">Frame</div>
                </div>

                <div id="view-res-img" class="input-group active">
                    <button class="tool-btn" style="width:100%; justify-content:center; margin-bottom:10px;" onclick="document.getElementById('resUpload').click()">
                        <i class="fas fa-cloud-upload-alt"></i> Tải lên kho Tài nguyên
                    </button>
                    <input type="file" id="resUpload" accept="image/*" style="display:none" onchange="uploadToGlobalResources(event)">
                    <div class="grid-list" id="globalImagesGrid"></div>
                </div>

                <div id="view-res-shape" class="input-group">
                    <textarea id="svgShapeInput" class="sb-input" placeholder="Dán mã SVG Shape vào đây..."></textarea>
                    <button class="tool-btn primary" style="width:100%; justify-content:center;" onclick="saveSvgToSheet('Shape', 'svgShapeInput')">Lưu Shape</button>
                    <div class="grid-list" id="shapesGrid" style="margin-top:15px;"></div>
                </div>

                <div id="view-res-frame" class="input-group">
                    <textarea id="svgFrameInput" class="sb-input" placeholder="Dán mã SVG Frame vào đây..."></textarea>
                    <button class="tool-btn primary" style="width:100%; justify-content:center;" onclick="saveSvgToSheet('Frame', 'svgFrameInput')">Lưu Frame</button>
                    <div class="grid-list" id="framesGrid" style="margin-top:15px;"></div>
                </div>
            </div>
        </div>
    </div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbytCrAHTpFnykzOAwTkxbAR6tm32P9RZrS42EnUFh2WTWTQRtZr60Q27Lzrbhq_cuo/exec";

let currentFolderId = null;
let activePage = null;
let activeLayer = null;
let zoomLevel = 1.0;
let clipboardLayer = null;
let viewMode = 'vertical'; // vertical, horizontal, grid

// --- HIỂN THỊ ẢNH GOOGLE DRIVE BẰNG CƠ CHẾ THUMBNAIL ---
function escapeAttr(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function extractDriveFileId(source) {
    if(!source) return "";

    // API có thể trả về object {id, url} hoặc trả về trực tiếp URL
    if(typeof source === "object") {
        if(source.id) return String(source.id);
        source = source.url || source.driveUrl || source.downloadUrl || "";
    }

    let text = String(source);
    let patterns = [
        /\/thumbnail\?id=([a-zA-Z0-9_-]{10,})/,
        /[?&]id=([a-zA-Z0-9_-]{10,})/,
        /\/file\/d\/([a-zA-Z0-9_-]{10,})/,
        /\/d\/([a-zA-Z0-9_-]{10,})/
    ];

    for(let i = 0; i < patterns.length; i++) {
        let match = text.match(patterns[i]);
        if(match && match[1]) return match[1];
    }

    return "";
}

function driveThumbnailUrl(fileId, size = "w2000") {
    if(!fileId) return "";
    return `https://drive.google.com/thumbnail?id=${encodeURIComponent(fileId)}&sz=${encodeURIComponent(size)}`;
}

function driveFallbackUrl(fileId) {
    if(!fileId) return "";
    return `https://drive.google.com/uc?export=view&id=${encodeURIComponent(fileId)}`;
}

function fixDriveUrl(source, size = "w2000") {
    if(!source) return "";

    // Data URL ảnh vừa upload từ máy thì giữ nguyên
    if(typeof source === "string" && source.startsWith("data:")) return source;

    let fileId = extractDriveFileId(source);
    if(fileId) return driveThumbnailUrl(fileId, size);

    if(typeof source === "object") return source.url || source.driveUrl || source.downloadUrl || "";
    return String(source);
}

function buildImageTag(source, className = "", extraAttrs = "", size = "w2000") {
    let fileId = extractDriveFileId(source);
    let src = fileId ? driveThumbnailUrl(fileId, size) : fixDriveUrl(source, size);
    let fallback = fileId ? driveFallbackUrl(fileId) : "";

    return `<img src="${escapeAttr(src)}" class="${escapeAttr(className)}" ${extraAttrs}
        loading="lazy"
        decoding="async"
        referrerpolicy="no-referrer"
        data-fallback-src="${escapeAttr(fallback)}"
        onerror="handleDriveImageError(this)">`;
}

function handleDriveImageError(img) {
    let fallback = img.dataset.fallbackSrc;
    if(fallback && img.src !== fallback) {
        img.src = fallback;
        img.dataset.fallbackSrc = "";
        return;
    }

    img.style.display = "none";
    let holder = img.parentElement;
    if(holder && !holder.querySelector(".drive-img-error")) {
        let err = document.createElement("div");
        err.className = "drive-img-error";
        err.style.cssText = "font-size:11px;color:#999;text-align:center;padding:8px;line-height:1.4;";
        err.innerHTML = "<i class='fas fa-image'></i><br>Không tải được ảnh";
        holder.appendChild(err);
    }
}

window.onload = () => {
    fetchProjects();
    fetchGlobalResources();
    fetchShapesAndFrames();
    initWorkspaceEvents();
    initInteractEvents();
    
    // Đưa Selection Box vào Scaler để nó float tự do
    document.getElementById("wsScaler").appendChild(document.getElementById("selectionBox"));
};

function showLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }

async function apiCall(action, payload = {}) {
    payload.action = action;
    try {
        let res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
        return await res.json();
    } catch (e) {
        return { success: false, error: e.message };
    }
}

async function fetchProjects() {
    let res = await apiCall("CANVA_GET_PROJECTS");
    if(res.success) {
        let sel = document.getElementById("projectSelect");
        sel.innerHTML = '<option value="">-- Chọn Project --</option>';
        res.folders.forEach(f => sel.innerHTML += `<option value="${f.id}">${f.name}</option>`);
    }
}

// --- TẢI DỰ ÁN VÀ RENDER CANVAS CHUẨN TỶ LỆ ---
async function loadProject(folderId) {
    if(!folderId) return;
    currentFolderId = folderId;
    showLoader(true);
    let res = await apiCall("CANVA_GET_PROJECT_IMAGES", { folderId: folderId });
    
    let scaler = document.getElementById("wsScaler");
    scaler.innerHTML = "";
    document.getElementById("selectionBox").style.display = "none";
    scaler.appendChild(document.getElementById("selectionBox")); 
    
    document.getElementById("projectImagesGrid").innerHTML = "";
    document.getElementById("thumbStrip").innerHTML = "";
    activePage = null; activeLayer = null;
    
    if(res.success && res.images.length > 0) {
        let loadedCount = 0;
        
        // Render trước lên Sidebar bằng thumbnail nhỏ của Google Drive
        res.images.forEach(img => {
            let previewUrl = fixDriveUrl(img, "w400");
            let insertUrl = fixDriveUrl(img, "w2000");
            addToSidebarGrid("projectImagesGrid", insertUrl, "image", previewUrl);
        });

        // Preload thumbnail lớn để lấy đúng kích thước thật rồi mới tạo Canvas Page
        res.images.forEach((img, index) => {
            let fixedUrl = fixDriveUrl(img, "w2000");
            let fallbackUrl = driveFallbackUrl(extractDriveFileId(img));
            let tempImg = new Image();
            tempImg.referrerPolicy = "no-referrer";

            tempImg.onload = function() {
                createCanvasPage(fixedUrl, this.naturalWidth || 800, this.naturalHeight || 800, index + 1);
                checkDone();
            };

            tempImg.onerror = function() {
                // Nếu thumbnail lỗi, thử link uc?export=view một lần nữa
                if(fallbackUrl && tempImg.src !== fallbackUrl) {
                    tempImg.src = fallbackUrl;
                    return;
                }
                createCanvasPage(fixedUrl, 800, 800, index + 1);
                checkDone();
            };

            tempImg.src = fixedUrl;
        });

        function checkDone() {
            loadedCount++;
            if(loadedCount === res.images.length) {
                showLoader(false);
                // Chọn trang đầu tiên làm mặc định
                let firstPage = scaler.querySelector('.cv-page-wrap');
                if(firstPage) selectPage(firstPage.querySelector('.cv-page'));
                updateViewModeUI();
            }
        }
    } else {
        showLoader(false);
        scaler.innerHTML += "<div style='margin-top:50px' id='emptyMsg'>Thư mục trống hoặc không có file ảnh hợp lệ.</div>";
    }
}

async function fetchGlobalResources() {
    let res = await apiCall("CANVA_GET_GLOBAL_IMAGES");
    if(res.success) {
        let grid = document.getElementById("globalImagesGrid");
        grid.innerHTML = "";
        res.images.forEach(img => {
            let previewUrl = fixDriveUrl(img, "w400");
            let insertUrl = fixDriveUrl(img, "w2000");
            addToSidebarGrid("globalImagesGrid", insertUrl, "image", previewUrl);
        });
    }
}

async function fetchShapesAndFrames() {
    let res = await apiCall("CANVA_GET_SHEET_DATA");
    if(res.success) {
        document.getElementById("shapesGrid").innerHTML = "";
        document.getElementById("framesGrid").innerHTML = "";
        res.data.forEach(item => {
            if(item.type === 'Shape') addToSidebarGrid("shapesGrid", item.svg, "svg");
            if(item.type === 'Frame') addToSidebarGrid("framesGrid", item.svg, "svg");
        });
    }
}

// --- CANVAS PAGES ---

function createCanvasPage(url, w, h, index) {
    let scaler = document.getElementById("wsScaler");
    
    let pageWrap = document.createElement("div");
    pageWrap.className = "cv-page-wrap";
    pageWrap.id = "wrap_" + index;
    pageWrap.style.width = w + "px";
    pageWrap.style.height = h + "px";
    pageWrap.innerHTML = `<div class="cv-page-label">Page ${index} - ${w}x${h}</div>`;
    
    let page = document.createElement("div");
    page.className = "cv-page";
    page.id = "page_" + index;
    page.style.width = "100%";
    page.style.height = "100%";
    
    // Auto scale to fit workspace width
    let screenW = document.getElementById("workspace").clientWidth - 100;
    if(w > screenW) {
        let ratio = screenW / w;
        pageWrap.style.width = screenW + "px";
        pageWrap.style.height = (h * ratio) + "px";
        page.style.transform = `scale(${ratio})`;
        page.style.transformOrigin = "top left";
        pageWrap.dataset.scale = ratio;
    } else {
        pageWrap.dataset.scale = 1;
    }

    page.addEventListener("mousedown", (e) => {
        if(!e.target.closest('.cv-layer')) {
            activeLayer = null;
            document.getElementById("selectionBox").style.display = "none";
        }
        selectPage(page);
    });

    pageWrap.appendChild(page);
    scaler.appendChild(pageWrap);
    
    // Tạo Thumbnail
    let thumb = document.createElement("div");
    thumb.className = "thumb-item";
    thumb.id = "thumb_" + index;
    thumb.innerText = index;
    thumb.onclick = () => selectPage(page);
    document.getElementById("thumbStrip").appendChild(thumb);
    
    addLayerToPage(page, url, "image", w, h, 0, 0);
}

function selectPage(page) {
    activePage = page;
    document.querySelectorAll(".cv-page-wrap").forEach(p => p.classList.remove("active-wrap"));
    document.querySelectorAll(".cv-page").forEach(p => p.classList.remove("active-page"));
    document.querySelectorAll(".thumb-item").forEach(t => t.classList.remove("active"));
    
    page.classList.add("active-page");
    page.parentElement.classList.add("active-wrap");
    
    let idx = page.id.split('_')[1];
    let thumb = document.getElementById("thumb_" + idx);
    if(thumb) thumb.classList.add("active");
    
    updateSelectionBox();
}

// --- THÊM LAYER CHUẨN XÁC VÀO PAGE ---
function addLayerToPage(page, content, type, w = 200, h = 200, x = 50, y = 50) {
    let layer = document.createElement("div");
    layer.className = "cv-layer";
    layer.id = "layer_" + Date.now() + Math.random().toString(36).substr(2,5);
    layer.style.width = w + "px";
    layer.style.height = h + "px";
    layer.style.left = x + "px";
    layer.style.top = y + "px";
    layer.style.transform = "rotate(0deg)";
    layer.dataset.angle = 0;
    
    // Ảnh Drive luôn render qua thumbnail?id=... để tránh lỗi không hiện ảnh
    if(type === "image") {
        layer.innerHTML = buildImageTag(content, "", 'draggable="false"', "w2000");
    } else if(type === "svg") {
        layer.innerHTML = content;
    }

    layer.addEventListener("mousedown", (e) => {
        e.stopPropagation();
        selectPage(page);
        selectLayer(layer);
    });

    page.appendChild(layer);
    return layer;
}

function addToSidebarGrid(gridId, content, type, previewContent = null) {
    let grid = document.getElementById(gridId);
    let item = document.createElement("div");
    item.className = "grid-item";

    if(type === "image") {
        // Sidebar dùng thumbnail nhỏ để tải nhanh, khi chèn vào page dùng thumbnail lớn
        item.innerHTML = buildImageTag(previewContent || content, "", "", "w400");
    } else {
        item.innerHTML = content;
    }

    item.onclick = () => {
        if(!activePage) { alert("Vui lòng click chọn 1 Page Canvas trước khi chèn!"); return; }
        // Tính tỷ lệ bù trừ
        let pScale = parseFloat(activePage.parentElement.dataset.scale || 1);
        addLayerToPage(activePage, content, type, 200/pScale, 200/pScale, 50/pScale, 50/pScale);
    };
    grid.appendChild(item);
}

// --- THUẬT TOÁN ENGINE TOÁN HỌC (8 ĐIỂM NEO KÉO THẢ & ROTATE) ---
let dragAction = null; 
let startX, startY, startRect, startAngle;

function selectLayer(layer) {
    activeLayer = layer;
    updateSelectionBox();
}

// Hàm tính tọa độ hộp Selection Box bám theo Layer (Tính bù trừ tọa độ của PageWrap)
function updateSelectionBox() {
    let box = document.getElementById("selectionBox");
    if(!activeLayer || !activePage) {
        box.style.display = "none";
        return;
    }
    box.style.display = "block";
    
    let pScale = parseFloat(activePage.parentElement.dataset.scale || 1);
    
    // Kích thước thật trên màn hình của Layer
    let lw = parseFloat(activeLayer.style.width) * pScale;
    let lh = parseFloat(activeLayer.style.height) * pScale;
    
    // Tọa độ thật trên màn hình (Tính từ góc trên cùng của workspace-scaler)
    // selection box nằm trong scaler nên tọa độ = tọa độ Page + tọa độ Layer
    let wrapLeft = activePage.parentElement.offsetLeft;
    let wrapTop = activePage.parentElement.offsetTop;
    
    let layerLeft = parseFloat(activeLayer.style.left) * pScale;
    let layerTop = parseFloat(activeLayer.style.top) * pScale;

    box.style.width = lw + "px";
    box.style.height = lh + "px";
    box.style.left = (wrapLeft + layerLeft) + "px";
    box.style.top = (wrapTop + layerTop) + "px";
    
    // Góc xoay
    let angle = activeLayer.dataset.angle || 0;
    box.style.transform = `rotate(${angle}deg)`;
}

function initInteractEvents() {
    let ws = document.getElementById("workspace");
    
    ws.addEventListener("mousedown", (e) => {
        if(e.target.closest(".cv-handle")) {
            isDragging = true;
            dragAction = e.target.dataset.dir;
            startX = e.clientX; startY = e.clientY;
            
            // Lưu thông số gốc của Layer (Chưa nhân scale)
            startRect = { 
                w: parseFloat(activeLayer.style.width), 
                h: parseFloat(activeLayer.style.height), 
                x: parseFloat(activeLayer.style.left), 
                y: parseFloat(activeLayer.style.top) 
            };
            startAngle = parseFloat(activeLayer.dataset.angle) || 0;
            e.stopPropagation();
        } else if (e.target.closest(".cv-layer")) {
            isDragging = true;
            dragAction = 'move';
            startX = e.clientX; startY = e.clientY;
            startRect = { x: parseFloat(activeLayer.style.left), y: parseFloat(activeLayer.style.top) };
        }
    });

    window.addEventListener("mousemove", (e) => {
        if(!isDragging || !activeLayer) return;
        
        let pScale = parseFloat(activePage.parentElement.dataset.scale || 1);
        let totalZoom = zoomLevel * pScale;
        
        // Quãng đường chuột di chuyển đã quy đổi theo độ Zoom
        let dx = (e.clientX - startX) / totalZoom;
        let dy = (e.clientY - startY) / totalZoom;
        
        // Tính toán góc xoay bù trừ khi kéo (Nâng cao: Để đơn giản, giả định layer không xoay khi kéo dãn, 
        // nếu đã xoay thì tọa độ sẽ bị lệch một chút theo hệ trục tọa độ của CSS. 
        // Tuy nhiên hàm dưới đây xử lý kéo cơ bản khá mượt).

        if(dragAction === 'move') {
            activeLayer.style.left = (startRect.x + dx) + "px";
            activeLayer.style.top = (startRect.y + dy) + "px";
        } 
        else if (dragAction === 'rotate') {
            let rect = activeLayer.getBoundingClientRect();
            let cx = rect.left + rect.width/2;
            let cy = rect.top + rect.height/2;
            let angle = Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
            angle += 90; // Góc 0 độ nằm hướng 12h
            activeLayer.style.transform = `rotate(${angle}deg)`;
            activeLayer.dataset.angle = angle;
        }
        else {
            // THUẬT TOÁN KÉO 8 GÓC / CẠNH - GIỮ ĐIỂM NEO ĐỐI DIỆN
            let newW = startRect.w;
            let newH = startRect.h;
            let newX = startRect.x;
            let newY = startRect.y;
            
            let ratio = startRect.w / startRect.h; // Aspect Ratio cho 4 góc

            // Xử lý kéo cạnh (Stretching)
            if (dragAction === 'e') { newW = startRect.w + dx; }
            if (dragAction === 's') { newH = startRect.h + dy; }
            if (dragAction === 'w') { newW = startRect.w - dx; newX = startRect.x + dx; }
            if (dragAction === 'n') { newH = startRect.h - dy; newY = startRect.y + dy; }

            // Xử lý kéo 4 góc (Giữ tỷ lệ - Lock Aspect Ratio)
            if (dragAction === 'se') { 
                newW = startRect.w + dx; newH = newW / ratio; 
            }
            if (dragAction === 'ne') { 
                newW = startRect.w + dx; newH = newW / ratio; 
                newY = startRect.y + (startRect.h - newH); 
            }
            if (dragAction === 'sw') { 
                newW = startRect.w - dx; newH = newW / ratio; 
                newX = startRect.x + dx; 
            }
            if (dragAction === 'nw') { 
                newW = startRect.w - dx; newH = newW / ratio; 
                newX = startRect.x + dx; 
                newY = startRect.y + (startRect.h - newH); 
            }

            // Chống âm kích thước
            if(newW > 10 && newH > 10) {
                activeLayer.style.width = newW + "px";
                activeLayer.style.height = newH + "px";
                activeLayer.style.left = newX + "px";
                activeLayer.style.top = newY + "px";
            }
        }
        updateSelectionBox();
    });

    window.addEventListener("mouseup", () => { isDragging = false; dragAction = null; });
}

function layerAction(action) {
    if(!activeLayer) return;
    if(action === 'delete') {
        activeLayer.remove();
        activeLayer = null;
        updateSelectionBox();
    } else if (action === 'copy') {
        clipboardLayer = activeLayer.cloneNode(true);
    } else if (action === 'cut') {
        clipboardLayer = activeLayer.cloneNode(true);
        activeLayer.remove();
        activeLayer = null;
        updateSelectionBox();
    }
}

document.addEventListener("keydown", (e) => {
    if(e.ctrlKey && e.key === 'v' && clipboardLayer && activePage) {
        let newLayer = clipboardLayer.cloneNode(true);
        newLayer.id = "layer_" + Date.now();
        newLayer.style.left = (parseFloat(newLayer.style.left) + 20) + "px";
        newLayer.style.top = (parseFloat(newLayer.style.top) + 20) + "px";
        newLayer.addEventListener("mousedown", (ev) => { ev.stopPropagation(); selectPage(activePage); selectLayer(newLayer); });
        activePage.appendChild(newLayer);
        selectLayer(newLayer);
    }
    if((e.key === 'Delete' || e.key === 'Backspace') && activeLayer) layerAction('delete');
});

// --- CHẾ ĐỘ XEM (VIEW MODES) & ZOOM ---
function setViewMode(mode) {
    viewMode = mode;
    document.querySelectorAll('.view-controls .tool-btn').forEach(b => b.classList.remove('active'));
    
    let scaler = document.getElementById("wsScaler");
    scaler.className = "workspace-scaler mode-" + mode;
    
    if(mode === 'vertical') {
        document.getElementById('btnViewV').classList.add('active');
        document.getElementById("thumbStrip").style.display = "none";
        document.getElementById("gridSliderWrap").style.display = "none";
        scaler.style.gridTemplateColumns = ""; // Clear grid
    } 
    else if (mode === 'horizontal') {
        document.getElementById('btnViewH').classList.add('active');
        document.getElementById("thumbStrip").style.display = "flex";
        document.getElementById("gridSliderWrap").style.display = "none";
        scaler.style.gridTemplateColumns = ""; 
        if(activePage) selectPage(activePage); // Re-trigger to hide others
    } 
    else if (mode === 'grid') {
        document.getElementById('btnViewG').classList.add('active');
        document.getElementById("thumbStrip").style.display = "none";
        document.getElementById("gridSliderWrap").style.display = "flex";
        updateGridCols(document.getElementById("gridColsSlider").value);
    }
    setTimeout(updateSelectionBox, 50); // Cập nhật lại khung viền
}

function updateGridCols(cols) {
    if(viewMode === 'grid') {
        document.getElementById("wsScaler").style.gridTemplateColumns = `repeat(${cols}, auto)`;
        setTimeout(updateSelectionBox, 50);
    }
}

function initWorkspaceEvents() {
    let ws = document.getElementById("workspace");
    let scaler = document.getElementById("wsScaler");

    ws.addEventListener("wheel", (e) => {
        if(e.ctrlKey || e.metaKey) {
            e.preventDefault();
            // Nếu đang ở chế độ Grid, cuộn chuột bằng 2 ngón tay -> Thay đổi số cột
            if(viewMode === 'grid') {
                let slider = document.getElementById("gridColsSlider");
                let cur = parseInt(slider.value);
                if(e.deltaY > 0 && cur < 5) slider.value = cur + 1;
                else if (e.deltaY < 0 && cur > 1) slider.value = cur - 1;
                updateGridCols(slider.value);
                return;
            }
            
            // Chế độ khác: Zoom in/out
            let delta = e.deltaY > 0 ? -0.1 : 0.1;
            zoomLevel = Math.max(0.2, Math.min(zoomLevel + delta, 3));
            scaler.style.transform = `scale(${zoomLevel})`;
            document.getElementById("zoomLabel").innerText = Math.round(zoomLevel * 100) + "%";
            updateSelectionBox(); 
        }
    }, {passive: false});
}

function updateViewModeUI() {
    setViewMode(viewMode); // Refresh current mode when loading project
}

// --- TẢI ẢNH LÊN & SIDEBAR ---
function handleLocalUpload(e) {
    if(!currentFolderId) { alert("Vui lòng chọn Project trước!"); return; }
    let file = e.target.files[0];
    if(!file) return;
    
    let reader = new FileReader();
    reader.onload = async (ev) => {
        let dataUrl = ev.target.result;
        addToSidebarGrid("projectImagesGrid", dataUrl, "image");
        if(activePage) {
            let pScale = parseFloat(activePage.parentElement.dataset.scale || 1);
            addLayerToPage(activePage, dataUrl, "image", 200/pScale, 200/pScale, 50/pScale, 50/pScale);
        }
        apiCall("CANVA_UPLOAD_IMAGE", { folderId: currentFolderId, filename: file.name, base64: dataUrl.split(',')[1], mime: file.type });
    };
    reader.readAsDataURL(file);
}

function uploadToGlobalResources(e) {
    let file = e.target.files[0];
    if(!file) return;
    let reader = new FileReader();
    reader.onload = async (ev) => {
        let dataUrl = ev.target.result;
        addToSidebarGrid("globalImagesGrid", dataUrl, "image");
        apiCall("CANVA_UPLOAD_GLOBAL_IMAGE", { filename: file.name, base64: dataUrl.split(',')[1], mime: file.type });
    };
    reader.readAsDataURL(file);
}

async function saveSvgToSheet(type, inputId) {
    let svgCode = document.getElementById(inputId).value.trim();
    if(!svgCode || !svgCode.startsWith("<svg")) { alert("Mã SVG không hợp lệ!"); return; }
    addToSidebarGrid(type === 'Shape' ? "shapesGrid" : "framesGrid", svgCode, "svg");
    document.getElementById(inputId).value = "";
    apiCall("CANVA_SAVE_SVG", { type: type, svg: svgCode });
}

function switchMainTab(tab) {
    document.querySelectorAll('.sb-tab').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.sb-content').forEach(el => el.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
}

function switchSubTab(tab) {
    document.querySelectorAll('.sub-tab').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.input-group').forEach(el => el.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('view-' + tab).classList.add('active');
}

function resizeCanvasPrompt() {
    if(!activePage) { alert("Chọn một Page để đổi kích thước"); return; }
    let wrap = activePage.parentElement;
    let pScale = parseFloat(wrap.dataset.scale || 1);
    let curW = parseFloat(activePage.style.width);
    let curH = parseFloat(activePage.style.height);
    
    let choice = prompt(`Kích thước gốc hiện tại: ${curW}x${curH} px.\n1. Nhập "ALL:W,H" để đổi toàn bộ dự án.\n2. Nhập "W,H" để đổi trang này.`, `${curW},${curH}`);
    if(choice) {
        let isAll = choice.startsWith("ALL:");
        let dims = isAll ? choice.replace("ALL:", "").split(',') : choice.split(',');
        if(dims.length === 2) {
            let nw = parseFloat(dims[0].trim());
            let nh = parseFloat(dims[1].trim());
            
            if(isAll) {
                document.querySelectorAll(".cv-page").forEach(p => {
                    p.style.width = nw + "px"; p.style.height = nh + "px";
                    let w = p.parentElement;
                    w.style.width = (nw * pScale) + "px"; w.style.height = (nh * pScale) + "px";
                    w.querySelector('.cv-page-label').innerText = `Page - ${nw}x${nh}`;
                });
            } else {
                activePage.style.width = nw + "px"; activePage.style.height = nh + "px";
                wrap.style.width = (nw * pScale) + "px"; wrap.style.height = (nh * pScale) + "px";
                wrap.querySelector('.cv-page-label').innerText = `Page - ${nw}x${nh}`;
            }
            updateSelectionBox();
        }
    }
}
