<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio Ảnh & Canvas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --white: #ffffff; --blue: #01adee; --red: #db1010; 
            --gray-light: #f4f6f8; --gray-border: #e0e0e0; --text-main: #333333; 
            --canvas-bg: #d1d5db; --grid-cols: 3;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--gray-light); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* BỘ CÔNG CỤ (TOOLBAR) */
        .toolbar { height: 52px; background: var(--white); border-bottom: 1px solid var(--gray-border); display: flex; align-items: center; padding: 0 15px; justify-content: space-between; z-index: 100; flex-shrink: 0; }
        .tool-btn { background: var(--white); border: 0.5px solid var(--gray-border); color: var(--text-main); padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: bold; border-radius: 4px; display: inline-flex; align-items: center; gap: 5px; outline: none; }
        .tool-btn:hover { background: var(--blue); color: var(--white); border-color: var(--blue); }
        .tool-select { padding: 6px; border: 0.5px solid var(--gray-border); border-radius: 4px; font-size: 13px; outline: none; max-width: 200px; }

        /* CHẾ ĐỘ XEM (VIEW MODES) */
        .view-controls { display: flex; background: #fff; padding: 3px; border-radius: 6px; border: 1px solid var(--gray-border); gap: 2px;}
        .view-btn { border: none; background: transparent; color: #777; cursor: pointer; padding: 4px 10px; border-radius: 4px; }
        .view-btn.active, .view-btn:hover { color: var(--blue); background: #eaf9fe; }

        /* KHÔNG GIAN LÀM VIỆC (WORKSPACE) */
        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }
        .canvas-area { flex: 1; background: var(--canvas-bg); overflow: auto; display: flex; flex-direction: column; align-items: center; padding: 40px; }
        .side-panel { width: 300px; background: var(--white); border-left: 1px solid var(--gray-border); display: flex; flex-direction: column; z-index: 10; flex-shrink: 0; }

        /* CANVAS PAGES */
        .canvas-page { background: var(--white); position: relative; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.15); margin-bottom: 40px; transform-origin: top center; flex-shrink: 0; transition: outline 0.2s;}
        .canvas-page.active-page { outline: 3px solid var(--blue); }
        .page-label { position: absolute; top: -25px; left: 0; font-size: 12px; font-weight: bold; color: #555; }

        /* LỚP LAYER & ĐIỂM NEO THU PHÓNG */
        .layer { position: absolute; cursor: move; user-select: none; }
        .layer img, .layer svg { width: 100%; height: 100%; display: block; pointer-events: none; }
        .layer.selected { outline: 1.5px solid var(--blue); z-index: 100 !important; }
        
        .handle { position: absolute; width: 12px; height: 12px; background: var(--white); border: 1.5px solid var(--blue); border-radius: 50%; display: none; z-index: 101;}
        .layer.selected .handle { display: block; }
        .handle.tl { top: -6px; left: -6px; cursor: nwse-resize; }
        .handle.tr { top: -6px; right: -6px; cursor: nesw-resize; }
        .handle.bl { bottom: -6px; left: -6px; cursor: nesw-resize; }
        .handle.br { bottom: -6px; right: -6px; cursor: nwse-resize; }

        /* CSS CÁC CHẾ ĐỘ XEM */
        .view-horizontal { flex-direction: row; overflow-x: auto; overflow-y: hidden; align-items: center; padding: 20px 40px; gap: 40px; }
        .view-horizontal .canvas-page { margin-bottom: 0; }
        
        .horizontal-strip { display: none; position: absolute; bottom: 0; left: 0; width: calc(100% - 300px); height: 90px; background: rgba(255,255,255,0.9); border-top: 1px solid var(--gray-border); padding: 10px; gap: 10px; overflow-x: auto; z-index: 50; backdrop-filter: blur(5px);}
        .strip-item { height: 100%; aspect-ratio: 16/9; background: #fff; cursor: pointer; border: 2px solid var(--gray-border); border-radius: 4px; overflow: hidden; position: relative; }
        .strip-item.active { border-color: var(--blue); }
        .strip-item img { width: 100%; height: 100%; object-fit: contain; }

        .view-grid { display: grid; grid-template-columns: repeat(var(--grid-cols), 1fr); gap: 30px; align-items: start; padding: 40px; }
        .view-grid .canvas-page { margin-bottom: 0; width: 100% !important; height: auto !important; aspect-ratio: 1; }

        /* SIDEBAR (TẢI LÊN & TÀI NGUYÊN) */
        .panel-tabs { display: flex; border-bottom: 1px solid var(--gray-border); background: var(--gray-light);}
        .ptab { flex: 1; text-align: center; padding: 12px; font-size: 13px; font-weight: bold; color: #777; cursor: pointer; border-bottom: 2px solid transparent; }
        .ptab.active { color: var(--blue); border-bottom-color: var(--blue); background: var(--white); }
        
        .sub-tabs { display: flex; padding: 10px; gap: 5px; border-bottom: 1px solid var(--gray-border); }
        .stab { padding: 5px 12px; font-size: 11px; font-weight: bold; border-radius: 15px; cursor: pointer; background: var(--gray-light); color: #666; border: 1px solid var(--gray-border);}
        .stab.active { background: var(--blue); color: #fff; border-color: var(--blue);}

        .panel-content { flex: 1; overflow-y: auto; padding: 15px; }
        .resource-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .res-item { background: #fdfdfd; border: 1px solid var(--gray-border); border-radius: 6px; overflow: hidden; cursor: pointer; aspect-ratio: 1; display: flex; justify-content: center; align-items: center; padding: 5px; }
        .res-item:hover { border-color: var(--blue); }
        .res-item img, .res-item svg { max-width: 100%; max-height: 100%; object-fit: contain; }

        textarea.code-input { width: 100%; height: 80px; padding: 8px; font-family: monospace; font-size: 11px; border: 1px solid var(--gray-border); border-radius: 4px; resize: none; margin-bottom: 5px;}

        /* CONTEXT MENU LAYER */
        .ctx-menu { position: fixed; background: #fff; border: 1px solid var(--gray-border); box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-radius: 4px; z-index: 9999; display: none; min-width: 160px; padding: 5px 0; }
        .ctx-item { padding: 8px 15px; font-size: 13px; cursor: pointer; color: var(--text-main); font-weight: 500;}
        .ctx-item:hover { background: #eaf9fe; color: var(--blue); }
        .ctx-item.danger:hover { background: #fef0f0; color: var(--red); }
        
        #loadingOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index: 10000; display: flex; justify-content: center; align-items: center; font-weight: bold; color: var(--blue); flex-direction: column; display: none;}
    </style>
</head>
<body>

<div id="loadingOverlay">
    <i class="fas fa-spinner fa-spin fa-3x"></i>
    <div style="margin-top: 15px;" id="loadingText">Đang xử lý dữ liệu...</div>
</div>

<div class="toolbar">
    <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-weight: bold; color: var(--blue);"><i class="fas fa-layer-group"></i> Canva Studio</span>
        
        <select id="projectSelect" class="tool-select" onchange="loadProjectImages()">
            <option value="">-- Đang tải Project... --</option>
        </select>
        
        <button class="tool-btn" onclick="document.getElementById('uploadProjectFile').click()">
            <i class="fas fa-upload"></i> Tải ảnh (Project)
        </button>
        <input type="file" id="uploadProjectFile" multiple accept="image/*" style="display: none;" onchange="uploadToDrive(event, 'project')">
    </div>

    <div class="view-controls">
        <button class="view-btn active" onclick="setViewMode('vertical')" title="Cuộn Dọc"><i class="fas fa-align-center"></i></button>
        <button class="view-btn" onclick="setViewMode('horizontal')" title="Cuộn Ngang"><i class="fas fa-ellipsis-h"></i></button>
        <button class="view-btn" onclick="setViewMode('grid')" title="Dạng Lưới (Dùng 2 ngón tay thu phóng)"><i class="fas fa-th"></i></button>
        <div id="gridZoomWrapper" style="display: none; align-items: center; gap: 5px; margin-left: 5px; padding-left: 5px; border-left: 1px solid #ccc;">
            <input type="range" id="gridZoom" min="1" max="6" value="3" style="width: 70px;" oninput="changeGridZoom(this.value)">
        </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
        <button class="tool-btn" onclick="resizeCanvas()"><i class="fas fa-crop"></i> Đổi size Canvas</button>
    </div>
</div>

<div class="workspace">
    <div class="canvas-area view-vertical" id="canvasArea"></div>
    
    <div class="horizontal-strip" id="horizontalStrip"></div>

    <div class="side-panel">
        <div class="panel-tabs">
            <div class="ptab active" onclick="switchMainTab('tabProject')">Tải Lên (Project)</div>
            <div class="ptab" onclick="switchMainTab('tabGlobal')">Tài Nguyên Chung</div>
        </div>

        <div id="tabProject" class="panel-content">
            <div class="resource-grid" id="projectGrid"></div>
        </div>

        <div id="tabGlobal" class="panel-content" style="display: none; padding:0;">
            <div class="sub-tabs">
                <div class="stab active" onclick="switchSubTab('subImg', this)">Ảnh Drive</div>
                <div class="stab" onclick="switchSubTab('subShape', this)">Shape</div>
                <div class="stab" onclick="switchSubTab('subFrame', this)">Frame</div>
            </div>
            
            <div style="padding: 15px; height: calc(100% - 40px); overflow-y: auto;">
                <div id="subImg" class="sub-content">
                    <button class="tool-btn" style="width: 100%; justify-content: center; margin-bottom: 15px; background: #eaf9fe; border-color: var(--blue);" onclick="document.getElementById('uploadGlobalFile').click()">
                        <i class="fas fa-cloud-upload-alt"></i> Tải lên Thư Viện Chung
                    </button>
                    <input type="file" id="uploadGlobalFile" multiple accept="image/*" style="display: none;" onchange="uploadToDrive(event, 'global')">
                    <div class="resource-grid" id="globalImageGrid"></div>
                </div>

                <div id="subShape" class="sub-content" style="display: none;">
                    <textarea id="svgShapeInput" class="code-input" placeholder="Dán mã <svg> Shape vào đây..."></textarea>
                    <button class="tool-btn" style="width: 100%; justify-content: center; margin-bottom: 15px;" onclick="saveVectorToSheet('Shape')"><i class="fas fa-save"></i> Lưu Shape</button>
                    <div class="resource-grid" id="shapeGrid"></div>
                </div>

                <div id="subFrame" class="sub-content" style="display: none;">
                    <textarea id="svgFrameInput" class="code-input" placeholder="Dán mã <svg> Frame vào đây..."></textarea>
                    <button class="tool-btn" style="width: 100%; justify-content: center; margin-bottom: 15px;" onclick="saveVectorToSheet('Frame')"><i class="fas fa-save"></i> Lưu Frame</button>
                    <div class="resource-grid" id="frameGrid"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="layerContextMenu" class="ctx-menu">
    <div class="ctx-item" onclick="layerAction('copy')"><i class="fas fa-copy"></i> Sao chép</div>
    <div class="ctx-item" onclick="layerAction('cut')"><i class="fas fa-cut"></i> Cắt</div>
    <div class="ctx-item" onclick="layerAction('paste')"><i class="fas fa-paste"></i> Dán</div>
    <div class="ctx-item danger" style="border-top: 1px solid #eee;" onclick="layerAction('delete')"><i class="fas fa-trash"></i> Xóa</div>
</div>

<script>
    // ==========================================
    // CẤU HÌNH API VÀ ID THẬT
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbytCrAHTpFnykzOAwTkxbAR6tm32P9RZrS42EnUFh2WTWTQRtZr60Q27Lzrbhq_cuo/exec";
    const GLOBAL_FOLDER_ID = "1JOMYxGCnoj4nhVaV37EDwPuq4dKcUiCL";
    
    let sysData = {};
    let pages = [];
    let activePageId = null;
    let activeLayer = null;
    let clipboardLayer = null;
    let currentViewMode = 'vertical';

    // ==========================================
    // KHỞI TẠO DỮ LIỆU TỪ NGUỒN THẬT
    // ==========================================
    window.onload = () => {
        fetchDriveProjects();
        fetchGlobalImages();
        loadCanvaResourcesFromLocalSheet();
        
        document.addEventListener('keydown', handleKeyboard);
        document.addEventListener('click', (e) => {
            if(!e.target.closest('.layer') && !e.target.closest('.ctx-menu')) {
                document.getElementById('layerContextMenu').style.display = 'none';
                clearLayerSelection();
            }
        });
        
        // Bắt sự kiện Pinch Zoom bằng Wheel + Ctrl
        document.getElementById('canvasArea').addEventListener('wheel', (e) => {
            if (e.ctrlKey) {
                e.preventDefault();
                if (currentViewMode === 'grid') {
                    let z = document.getElementById('gridZoom');
                    let val = parseInt(z.value);
                    z.value = e.deltaY > 0 ? Math.min(6, val + 1) : Math.max(1, val - 1);
                    changeGridZoom(z.value);
                }
            }
        }, { passive: false });
    };

    function showLoading(text) {
        document.getElementById('loadingText').innerText = text;
        document.getElementById('loadingOverlay').style.display = 'flex';
    }
    function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

    // --- 1. LẤY DANH SÁCH PROJECT TỪ DRIVE ---
    async function fetchDriveProjects() {
        const select = document.getElementById('projectSelect');
        try {
            let res = await fetch(API_URL + "?action=get_drive_projects");
            let json = await res.json();
            select.innerHTML = '<option value="">-- Chọn Project (Drive) --</option>';
            if (json.success) {
                json.projects.forEach(f => {
                    select.innerHTML += `<option value="${f.id}">${f.name}</option>`;
                });
            }
        } catch (e) { console.error(e); select.innerHTML = '<option value="">Lỗi tải API</option>'; }
    }

    // --- 2. LẤY ẢNH TỪ PROJECT ĐƯỢC CHỌN ---
    async function loadProjectImages() {
        const folderId = document.getElementById('projectSelect').value;
        if(!folderId) return;

        const grid = document.getElementById('projectGrid');
        const canvasArea = document.getElementById('canvasArea');
        grid.innerHTML = "Đang tải ảnh...";
        canvasArea.innerHTML = "";
        pages = [];

        try {
            let res = await fetch(API_URL + "?action=get_images_in_folder&folderId=" + folderId);
            let json = await res.json();
            grid.innerHTML = "";

            if (json.success && json.images.length > 0) {
                json.images.forEach((img, idx) => {
                    // Cột bên phải
                    let div = document.createElement('div');
                    div.className = 'res-item';
                    div.innerHTML = `<img src="${img.url}">`;
                    div.onclick = () => addLayerToActivePage('image', img.url);
                    grid.appendChild(div);

                    // Tạo trang Canvas theo kích thước thật của ảnh
                    let tempImg = new Image();
                    tempImg.onload = function() {
                        createCanvasPage(this.width, this.height, img.url, `Page ${idx + 1}`);
                        if(currentViewMode === 'horizontal') renderStrip();
                    };
                    tempImg.src = img.url;
                });
            } else {
                grid.innerHTML = "Không có ảnh.";
            }
        } catch(e) { console.error(e); grid.innerHTML = "Lỗi kết nối."; }
    }

    // --- 3. LẤY ẢNH TÀI NGUYÊN CHUNG TỪ DRIVE GLOBAL ---
    async function fetchGlobalImages() {
        const grid = document.getElementById('globalImageGrid');
        try {
            let res = await fetch(API_URL + "?action=get_images_in_folder&folderId=" + GLOBAL_FOLDER_ID);
            let json = await res.json();
            if (json.success) {
                json.images.forEach(img => {
                    let div = document.createElement('div');
                    div.className = 'res-item';
                    div.innerHTML = `<img src="${img.url}">`;
                    div.onclick = () => addLayerToActivePage('image', img.url);
                    grid.appendChild(div);
                });
            }
        } catch(e) {}
    }

    // --- 4. TẢI ẢNH THẬT LÊN GOOGLE DRIVE BẰNG BASE64 ---
    async function uploadToDrive(event, target) {
        const files = event.target.files;
        if (!files.length) return;
        
        let folderId = target === 'global' ? GLOBAL_FOLDER_ID : document.getElementById('projectSelect').value;
        if(!folderId) return alert("Vui lòng chọn Project trước khi tải lên!");

        showLoading("Đang tải ảnh lên Google Drive...");
        let grid = target === 'global' ? document.getElementById('globalImageGrid') : document.getElementById('projectGrid');

        for(let file of files) {
            let reader = new FileReader();
            reader.onload = async function(e) {
                let base64 = e.target.result.split(',')[1];
                let payload = {
                    action: "UPLOAD_IMAGE_TO_DRIVE",
                    folderId: folderId,
                    fileName: file.name,
                    mimeType: file.type,
                    base64: base64
                };

                try {
                    let res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
                    let json = await res.json();
                    if(json.success) {
                        let div = document.createElement('div');
                        div.className = 'res-item';
                        div.innerHTML = `<img src="${json.url}">`;
                        div.onclick = () => addLayerToActivePage('image', json.url);
                        grid.prepend(div);
                    }
                } catch(err) { console.error(err); }
            };
            reader.readAsDataURL(file);
        }
        event.target.value = "";
        hideLoading();
    }

    // --- 5. LƯU & TẢI SHAPE/FRAME VÀO GOOGLE SHEET ---
    function loadCanvaResourcesFromLocalSheet() {
        try {
            let cached = localStorage.getItem("MKT_DATA");
            if (cached) sysData = JSON.parse(cached);
            
            let sheet = sysData.sheets && sysData.sheets["Canva_hidden"];
            if (sheet) {
                for(let i=1; i<sheet.length; i++) {
                    let type = sheet[i][0]; 
                    let svgCode = sheet[i][1];
                    let grid = document.getElementById(type.toLowerCase() + 'Grid');
                    if(grid && svgCode) {
                        let div = document.createElement('div');
                        div.className = 'res-item';
                        div.innerHTML = svgCode;
                        div.onclick = () => addLayerToActivePage('svg', svgCode);
                        grid.appendChild(div);
                    }
                }
            }
        } catch(e) {}
    }

    function saveVectorToSheet(type) {
        let inputId = type === 'Shape' ? 'svgShapeInput' : 'svgFrameInput';
        let svgCode = document.getElementById(inputId).value.trim();
        if(!svgCode.startsWith('<svg')) return alert("Mã phải bắt đầu bằng <svg>");

        // Đẩy vào giao diện ngay lập tức
        let grid = document.getElementById(type.toLowerCase() + 'Grid');
        let div = document.createElement('div');
        div.className = 'res-item'; div.innerHTML = svgCode;
        div.onclick = () => addLayerToActivePage('svg', svgCode);
        grid.prepend(div);
        document.getElementById(inputId).value = "";

        // Gửi lệnh lên Sheet qua cấu trúc Queue (Giống post.html)
        if (!sysData.sheets) sysData.sheets = {};
        if (!sysData.sheets["Canva_hidden"]) sysData.sheets["Canva_hidden"] = [["Type", "Code"]];
        
        let targetRow = sysData.sheets["Canva_hidden"].length + 1;
        let batch = [
            {type:'STRUCTURAL', action:'insertRow', index: targetRow, count: 1, tab: "Canva_hidden"},
            {type:'SYNC_CELL', row: targetRow, col: 1, val: type, tab: "Canva_hidden"},
            {type:'SYNC_CELL', row: targetRow, col: 2, val: svgCode, tab: "Canva_hidden"}
        ];
        
        fetch(API_URL, { method: "POST", body: JSON.stringify(batch) });
    }

    // ==========================================
    // THUẬT TOÁN CANVAS & LAYER ENGINE
    // ==========================================
    function createCanvasPage(w, h, initialImgUrl, title) {
        const pageId = 'page_' + Date.now();
        const area = document.getElementById('canvasArea');

        const wrapper = document.createElement('div');
        wrapper.className = 'canvas-page';
        wrapper.id = pageId;
        wrapper.style.width = w + 'px';
        wrapper.style.height = h + 'px';
        
        const label = document.createElement('div');
        label.className = 'page-label';
        label.innerText = title;
        wrapper.appendChild(label);

        wrapper.addEventListener('mousedown', (e) => {
            if(e.target === wrapper) { clearLayerSelection(); setActivePage(pageId); }
        });

        area.appendChild(wrapper);
        pages.push({ id: pageId, width: w, height: h, dom: wrapper });

        if(initialImgUrl) appendLayer(wrapper, 'image', initialImgUrl, 0, 0, w, h);
        if(!activePageId) setActivePage(pageId);
    }

    function setActivePage(id) {
        document.querySelectorAll('.canvas-page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(id).classList.add('active-page');
        activePageId = id;
    }

    function addLayerToActivePage(type, content) {
        if(!activePageId) return alert("Click chọn 1 khung Canvas trước khi chèn!");
        const page = document.getElementById(activePageId);
        appendLayer(page, type, content, 50, 50, 200, 200);
    }

    function appendLayer(pageDom, type, content, x, y, w, h) {
        const layer = document.createElement('div');
        layer.className = 'layer';
        layer.style.left = x + 'px';
        layer.style.top = y + 'px';
        layer.style.width = w + 'px';
        layer.style.height = h + 'px';

        if(type === 'image') layer.innerHTML = `<img src="${content}">`;
        else layer.innerHTML = content;

        // Bơm 4 mỏ neo resize
        const handles = ['tl', 'tr', 'bl', 'br'].map(pos => `<div class="handle ${pos}" data-pos="${pos}"></div>`).join('');
        layer.insertAdjacentHTML('beforeend', handles);

        layer.addEventListener('mousedown', initDragOrResize);
        layer.addEventListener('contextmenu', (e) => {
            e.preventDefault(); e.stopPropagation();
            activeLayer = layer; clearLayerSelection(); layer.classList.add('selected');
            let ctx = document.getElementById('layerContextMenu');
            ctx.style.display = 'block'; ctx.style.left = e.clientX + 'px'; ctx.style.top = e.clientY + 'px';
        });
        
        pageDom.appendChild(layer);
    }

    function clearLayerSelection() {
        document.querySelectorAll('.layer').forEach(l => l.classList.remove('selected'));
        activeLayer = null;
    }

    // --- THUẬT TOÁN RESIZE ĐỐI ĐỈNH (OPPOSITE ANCHOR) ---
    let dragObj = null;

    function initDragOrResize(e) {
        if(e.button !== 0) return;
        e.stopPropagation();
        clearLayerSelection();
        activeLayer = e.currentTarget;
        activeLayer.classList.add('selected');
        setActivePage(activeLayer.parentElement.id);

        const handle = e.target.closest('.handle');
        dragObj = {
            action: handle ? 'resize' : 'move',
            anchor: handle ? handle.dataset.pos : null,
            startX: e.clientX, startY: e.clientY,
            lX: parseFloat(activeLayer.style.left),
            lY: parseFloat(activeLayer.style.top),
            lW: parseFloat(activeLayer.style.width),
            lH: parseFloat(activeLayer.style.height)
        };

        document.addEventListener('mousemove', processDragOrResize);
        document.addEventListener('mouseup', stopDragOrResize);
    }

    function processDragOrResize(e) {
        if(!dragObj || !activeLayer) return;
        const dx = e.clientX - dragObj.startX;
        const dy = e.clientY - dragObj.startY;

        if (dragObj.action === 'move') {
            activeLayer.style.left = (dragObj.lX + dx) + 'px';
            activeLayer.style.top = (dragObj.lY + dy) + 'px';
        } 
        else if (dragObj.action === 'resize') {
            let ratio = dragObj.lW / dragObj.lH;
            let newW = dragObj.lW, newH = dragObj.lH, newX = dragObj.lX, newY = dragObj.lY;

            // Xử lý neo đối diện để giữ nguyên 1 góc
            if (dragObj.anchor === 'br') {
                newW = Math.max(20, dragObj.lW + dx);
                newH = newW / ratio;
            } else if (dragObj.anchor === 'tl') {
                newW = Math.max(20, dragObj.lW - dx);
                newH = newW / ratio;
                newX = dragObj.lX + (dragObj.lW - newW);
                newY = dragObj.lY + (dragObj.lH - newH);
            } else if (dragObj.anchor === 'tr') {
                newW = Math.max(20, dragObj.lW + dx);
                newH = newW / ratio;
                newY = dragObj.lY + (dragObj.lH - newH);
            } else if (dragObj.anchor === 'bl') {
                newW = Math.max(20, dragObj.lW - dx);
                newH = newW / ratio;
                newX = dragObj.lX + (dragObj.lW - newW);
            }

            activeLayer.style.width = newW + 'px';
            activeLayer.style.height = newH + 'px';
            activeLayer.style.left = newX + 'px';
            activeLayer.style.top = newY + 'px';
        }
    }

    function stopDragOrResize() {
        dragObj = null;
        document.removeEventListener('mousemove', processDragOrResize);
        document.removeEventListener('mouseup', stopDragOrResize);
        if(currentViewMode === 'horizontal') renderStrip();
    }

    // --- CONTEXT MENU THAO TÁC ---
    function layerAction(act) {
        document.getElementById('layerContextMenu').style.display = 'none';
        if(!activeLayer) return;
        if(act === 'delete') { activeLayer.remove(); activeLayer = null; }
        else if(act === 'copy') { clipboardLayer = activeLayer.cloneNode(true); clipboardLayer.classList.remove('selected'); }
        else if(act === 'cut') { clipboardLayer = activeLayer.cloneNode(true); clipboardLayer.classList.remove('selected'); activeLayer.remove(); activeLayer = null; }
        else if(act === 'paste' && clipboardLayer) {
            let n = clipboardLayer.cloneNode(true);
            n.style.left = (parseFloat(n.style.left) + 30) + 'px';
            n.style.top = (parseFloat(n.style.top) + 30) + 'px';
            n.addEventListener('mousedown', initDragOrResize);
            n.addEventListener('contextmenu', (e) => { e.preventDefault(); activeLayer=n; document.getElementById('layerContextMenu').style.display='block'; });
            activeLayer.parentElement.appendChild(n);
            clearLayerSelection(); activeLayer = n; n.classList.add('selected');
        }
    }
    
    function handleKeyboard(e) {
        if(!activeLayer) return;
        if(e.key === 'Delete') layerAction('delete');
        if(e.ctrlKey && e.key === 'c') layerAction('copy');
        if(e.ctrlKey && e.key === 'x') layerAction('cut');
        if(e.ctrlKey && e.key === 'v') layerAction('paste');
    }

    // --- TÙY CHỈNH KÍCH THƯỚC TRANG ---
    function resizeCanvas() {
        if(!activePageId) return alert("Chọn 1 trang Canvas trước!");
        const p = pages.find(x => x.id === activePageId);
        let w = prompt("Chiều rộng (px):", p.width);
        let h = prompt("Chiều cao (px):", p.height);
        if(w && h) {
            if(confirm("Áp dụng cho TOÀN BỘ trang? (OK=Tất cả, Cancel=Chỉ trang hiện tại)")) {
                pages.forEach(pg => { pg.width = w; pg.height = h; pg.dom.style.width = w+'px'; pg.dom.style.height = h+'px'; });
            } else {
                p.width = w; p.height = h; p.dom.style.width = w+'px'; p.dom.style.height = h+'px';
            }
        }
    }

    // --- GIAO DIỆN VIEW MODES ---
    function switchMainTab(id) {
        document.querySelectorAll('.ptab').forEach(b => b.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.getElementById('tabProject').style.display = id === 'tabProject' ? 'block' : 'none';
        document.getElementById('tabGlobal').style.display = id === 'tabGlobal' ? 'block' : 'none';
    }

    function switchSubTab(id, btn) {
        document.querySelectorAll('.stab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.sub-content').forEach(c => c.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    }

    function setViewMode(mode) {
        currentViewMode = mode;
        const area = document.getElementById('canvasArea');
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        event.currentTarget.classList.add('active');
        area.className = `canvas-area view-${mode}`;
        
        document.getElementById('horizontalStrip').style.display = mode === 'horizontal' ? 'flex' : 'none';
        document.getElementById('gridZoomWrapper').style.display = mode === 'grid' ? 'flex' : 'none';
        
        if(mode === 'horizontal') renderStrip();
    }

    function changeGridZoom(val) { document.documentElement.style.setProperty('--grid-cols', val); }

    function renderStrip() {
        const strip = document.getElementById('horizontalStrip');
        strip.innerHTML = '';
        pages.forEach(p => {
            let thumb = document.createElement('div');
            thumb.className = `strip-item ${p.id === activePageId ? 'active' : ''}`;
            let img = p.dom.querySelector('img');
            thumb.innerHTML = img ? `<img src="${img.src}">` : `<div style="font-size:10px; padding:10px;">${p.dom.querySelector('.page-label').innerText}</div>`;
            thumb.onclick = () => {
                setActivePage(p.id);
                p.dom.scrollIntoView({behavior: "smooth", inline: "center"});
                document.querySelectorAll('.strip-item').forEach(i=>i.classList.remove('active'));
                thumb.classList.add('active');
            };
            strip.appendChild(thumb);
        });
    }
</script>
